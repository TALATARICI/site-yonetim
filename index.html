function renderReports(user) {
  const db = getDB();
  const sid = currentSiteId();
  const startStr = sessionStorage.getItem('repStart') || '';
  const endStr = sessionStorage.getItem('repEnd') || '';
  const repType = sessionStorage.getItem('repType') || 'all';
  const startDate = startStr ? new Date(startStr + 'T00:00:00') : null;
  const endDate = endStr ? new Date(endStr + 'T23:59:59') : null;
  
  const all = [];
  siteFilter(db.dues).filter(d => d.is_paid && d.paid_at).forEach(d => {
    const apt = db.apartments.find(a => a.id === d.apartment_id);
    const cat = d.category === 'ısı' ? 'Isı' : d.category === 'proje' ? 'Proje' : 'Aidat';
    all.push({ date: d.paid_at, type: 'gelir', source: 'aidat', category: cat, description: `${cat} — ${apt ? aptLabel(apt) : '-'}`, amount: Number(d.amount), ref: `AID-${d.id}` });
  });
  (db.partialPayments || []).filter(pp => pp.site_id === sid).forEach(pp => {
    const due = db.dues.find(d => d.id === pp.due_id);
    const apt = due ? db.apartments.find(a => a.id === due.apartment_id) : null;
    all.push({ date: pp.paid_at, type: 'gelir', source: 'kısmi', category: 'Kısmi', description: `Kısmi — ${apt ? aptLabel(apt) : '-'}`, amount: Number(pp.amount), ref: `KSM-${pp.id}` });
  });
  siteFilter(db.extraIncomes).forEach(x => {
    all.push({ date: x.date || new Date(x.year, x.month-1, 1).toISOString(), type: 'gelir', source: 'ekstra', category: x.category, description: `Ekstra — ${x.category}`, amount: Number(x.amount), ref: `EKS-${x.id}` });
  });
  siteFilter(db.cashMovements).forEach(m => {
    all.push({ date: m.date, type: m.type, source: 'manuel', category: m.type === 'gelir' ? 'Manuel G.' : 'Manuel Gid.', description: m.description, amount: Number(m.amount), ref: `MAN-${m.id}` });
  });
  siteFilter(db.expenses).forEach(e => {
    all.push({ date: e.paid_at || e.created_at, type: 'gider', source: 'gider', category: e.category, description: `Gider — ${e.category}`, amount: Number(e.amount), ref: `GDR-${e.id}` });
  });
  
  let filtered = all.filter(m => {
    const t = new Date(m.date).getTime();
    if (startDate && t < startDate.getTime()) return false;
    if (endDate && t > endDate.getTime()) return false;
    if (repType === 'gelir' && m.type !== 'gelir') return false;
    if (repType === 'gider' && m.type !== 'gider') return false;
    return true;
  });
  filtered.sort((a,b) => new Date(a.date) - new Date(b.date));
  
  const preRange = all.filter(m => startDate && new Date(m.date).getTime() < startDate.getTime());
  const openingBalance = preRange.reduce((s,m) => s + (m.type === 'gelir' ? m.amount : -m.amount), 0);
  
  let running = openingBalance;
  const rowsWithBalance = filtered.map(m => {
    if (m.type === 'gelir') running += m.amount;
    else running -= m.amount;
    return { ...m, balance: running };
  });
  
  const totalIn = filtered.filter(m => m.type === 'gelir').reduce((s,m) => s + m.amount, 0);
  const totalOut = filtered.filter(m => m.type === 'gider').reduce((s,m) => s + m.amount, 0);
  
  const monthlySummary = {};
  filtered.forEach(m => {
    const dt = new Date(m.date);
    const key = dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2,'0');
    if (!monthlySummary[key]) monthlySummary[key] = { gelir: 0, gider: 0 };
    if (m.type === 'gelir') monthlySummary[key].gelir += m.amount;
    else monthlySummary[key].gider += m.amount;
  });
  
  const catSummary = {};
  filtered.forEach(m => {
    const k = m.type + '|' + m.category;
    if (!catSummary[k]) catSummary[k] = { type: m.type, category: m.category, total: 0, count: 0 };
    catSummary[k].total += m.amount;
    catSummary[k].count += 1;
  });
  
  const activeTab = sessionStorage.getItem('repTab') || 'defter';
  
  return `<div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
    <h3 class="mb-0">Raporlar <small class="text-muted">— ${esc(activeSite()?.name || '')}</small></h3>
    <div class="dropdown">
      <button class="btn btn-outline-primary btn-sm dropdown-toggle" data-bs-toggle="dropdown">📥 Dışa Aktar</button>
      <ul class="dropdown-menu dropdown-menu-end">
        <li><button class="dropdown-item" onclick="exportReportsCSV()">📊 CSV</button></li>
      </ul>
    </div>
  </div>
  
  <div class="card mb-3"><div class="card-body py-2">
    <div class="row g-2 align-items-center">
      <div class="col-auto"><span class="small text-muted">📅 Dönem:</span></div>
      <div class="col-md-2"><input type="date" class="form-control form-control-sm" value="${startStr}" onchange="sessionStorage.setItem('repStart',this.value);render()"></div>
      <div class="col-auto"><span class="small">→</span></div>
      <div class="col-md-2"><input type="date" class="form-control form-control-sm" value="${endStr}" onchange="sessionStorage.setItem('repEnd',this.value);render()"></div>
      <div class="col-md-2"><select class="form-select form-select-sm" onchange="sessionStorage.setItem('repType',this.value);render()">
        <option value="all" ${repType === 'all' ? 'selected' : ''}>Tümü</option>
        <option value="gelir" ${repType === 'gelir' ? 'selected' : ''}>Sadece Gelir</option>
        <option value="gider" ${repType === 'gider' ? 'selected' : ''}>Sadece Gider</option>
      </select></div>
      <div class="col-auto"><button class="btn btn-sm btn-outline-secondary" onclick="sessionStorage.removeItem('repStart');sessionStorage.removeItem('repEnd');sessionStorage.removeItem('repType');render()">Sıfırla</button></div>
    </div>
  </div></div>
  
  <div class="row g-2 mb-3">
    <div class="col-md-3"><div class="card text-bg-secondary mb-0"><div class="card-body py-2">
      <div class="small">Açılış</div><div class="fs-5">${money(openingBalance)}</div>
    </div></div></div>
    <div class="col-md-3"><div class="card text-bg-success mb-0"><div class="card-body py-2">
      <div class="small">Gelir</div><div class="fs-5">+${money(totalIn)}</div>
    </div></div></div>
    <div class="col-md-3"><div class="card text-bg-danger mb-0"><div class="card-body py-2">
      <div class="small">Gider</div><div class="fs-5">−${money(totalOut)}</div>
    </div></div></div>
    <div class="col-md-3"><div class="card text-bg-primary mb-0"><div class="card-body py-2">
      <div class="small">Kapanış</div><div class="fs-5">${money(openingBalance + totalIn - totalOut)}</div>
    </div></div></div>
  </div>
  
  <ul class="nav nav-tabs mb-3">
    <li class="nav-item"><a class="nav-link ${activeTab==='defter'?'active':''}" href="#" onclick="event.preventDefault(); sessionStorage.setItem('repTab','defter'); render();">📒 Kasa Defteri</a></li>

  </ul>
  
  ${activeTab === 'defter' ? `
    <div class="card"><div class="card-body">
      <h6>📒 Kasa Defteri (${rowsWithBalance.length} hareket)</h6>
      <div class="table-responsive-wrap" style="max-height:600px;">
        <table class="table table-sm table-hover mb-0">
          <thead class="table-light" style="position:sticky;top:0;">
            <tr><th>Tarih</th><th>Ref</th><th>Açıklama</th><th>Kategori</th><th class="text-end">Gelir</th><th class="text-end">Gider</th><th class="text-end">Bakiye</th></tr>

          <tbody>
            <tr class="table-secondary"><td colspan="6" class="text-end fw-bold small">AÇILIŞ</td><td class="text-end fw-bold">${money(openingBalance)}</td></tr>
            ${rowsWithBalance.length ? rowsWithBalance.map(r => `<tr>

  ${activeTab === 'aylik' ? `
