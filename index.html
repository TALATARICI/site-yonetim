      <tbody>${preview}${rows.length > 5 ? `<tr><td colspan="2" class="text-muted small">… ${rows.length - 5} satır daha</td></tr>` : ''}</tbody></table>
    <div class="mt-2"><button class="btn btn-primary" onclick="previewHeatBilling()">📊 Hesapla ve Önizle →</button></div>
  </div>`;
}
function previewHeatBilling() {
  if (!pendingHeat) { alert('Önce dosya seç.'); return; }
  const totalBill = parseFloat(document.getElementById('heatTotal').value);
  const month = parseInt(document.getElementById('heatMonth').value);
  const year = parseInt(document.getElementById('heatYear').value);
  const desc = (document.getElementById('heatDesc').value || '').trim();
  const consumptionPct = parseFloat(document.getElementById('heatConsumptionPct').value) || 70;
  if (!totalBill || totalBill <= 0) { alert('Tutar gir.'); return; }
  if (consumptionPct < 0 || consumptionPct > 100) { alert('Oran 0-100.'); return; }
  const db = getDB();
  const apts = siteFilter(db.apartments);
  const { rows, colApt, colPay } = pendingHeat;
  const parsed = []; const errors = [];
  rows.forEach((r, idx) => {
    const daireRaw = String(r[colApt] || '').trim();
    const payRaw = String(r[colPay] || '').trim().replace(',', '.');
    const pay = parseFloat(payRaw);
    if (!daireRaw) return;
    if (!isFinite(pay) || pay < 0) { errors.push(`Satır ${idx+2}: Geçersiz (${payRaw})`); return; }
    const norm = daireRaw.toUpperCase().replace(/\s/g, '');
    let apt = apts.find(a => (a.meter_no || '').toUpperCase() === norm);
    if (!apt) apt = apts.find(a => aptLabel(a).toUpperCase() === norm);
    if (!apt) apt = apts.find(a => String(a.number) === norm);
    if (!apt) { const m = norm.match(/^([A-Z])[-/]?(\d+)$/); if (m) apt = apts.find(a => (a.block||'').toUpperCase() === m[1] && String(a.number) === m[2]); }
    if (!apt) { errors.push(`Satır ${idx+2}: Daire/sayaç yok (${daireRaw})`); return; }
    const existing = parsed.find(p => p.apartment_id === apt.id);
    if (existing) existing.pay += pay;
    else parsed.push({ apartment_id: apt.id, apartment_label: aptLabel(apt), area: Number(apt.area) || 0, pay });
  });
  const missingInFile = apts.filter(a => !parsed.find(p => p.apartment_id === a.id));
  const totalPay = parsed.reduce((s,p) => s + p.pay, 0);
  const totalArea = parsed.reduce((s,p) => s + p.area, 0);
  const consumptionTotal = totalBill * consumptionPct / 100;
  const fixedTotal = totalBill - consumptionTotal;
  parsed.forEach(p => {
    p.consumptionShare = totalPay > 0 ? (p.pay / totalPay) * consumptionTotal : 0;
    p.fixedShare = totalArea > 0 ? (p.area / totalArea) * fixedTotal : 0;
    p.amount = p.consumptionShare + p.fixedShare;
  });
  const sumAmounts = parsed.reduce((s,p) => s + p.amount, 0);
  const diff = totalBill - sumAmounts;
  if (parsed.length && Math.abs(diff) > 0.005) {
    const biggest = parsed.reduce((a,b) => a.pay > b.pay ? a : b);
    biggest.amount += diff; biggest.fixedShare += diff;
  }
  pendingHeat.preview = { month, year, desc, totalBill, consumptionPct, consumptionTotal, fixedTotal,
    items: parsed.sort((a,b) => a.apartment_label.localeCompare(b.apartment_label)),
    totalPay, totalArea,
    missingInFile: missingInFile.map(a => ({ label: aptLabel(a), area: Number(a.area) || 0 })),
    errors };
  showHeatPreview();
}
function showHeatPreview() {
  const p = pendingHeat.preview;
  const existing = document.getElementById('heatPreviewModal');
  if (existing) existing.remove();
  const modal = document.createElement('div');

function deleteHeatBill(billId) {

function recalcHeatBill(billId) {
  const db = getDB();
  const b = (db.heatBills || []).find(x => x.id === billId);
  if (!b) return;
  const paidCount = db.dues.filter(d => d.heat_bill_id === billId && d.is_paid).length;
  if (paidCount > 0 && !confirm(`${paidCount} borç ödenmiş. Devam edilsin mi?`)) return;
  const existing = document.getElementById('recalcModal');
  if (existing) existing.remove();
  const modal = document.createElement('div');
  modal.id = 'recalcModal';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
  modal.onclick = e => { if (e.target === modal) modal.remove(); };
  modal.innerHTML = `<div style="background:white;border-radius:8px;max-width:600px;width:100%;padding:20px;">
    <h5 class="mb-3">🔄 Yeniden Hesapla</h5>
    <form id="recalcForm">
      <div class="mb-3"><label class="form-label">Toplam Fatura</label><input name="totalBill" type="number" step="0.01" class="form-control" value="${b.totalBill}" required></div>
      <div class="mb-3"><label class="form-label">Tüketim Oranı (%)</label><input name="consumptionPct" type="number" min="0" max="100" class="form-control" value="${b.consumptionPct}" required></div>
      <div class="mb-3"><label class="form-label">Açıklama</label><input name="description" class="form-control" value="${esc(b.description||'')}"></div>
      <div class="d-flex gap-2">
        <button class="btn btn-warning flex-grow-1">🔄 Hesapla</button>
        <button type="button" class="btn btn-outline-secondary" onclick="document.getElementById('recalcModal').remove()">Vazgeç</button>
      </div>
    </form>
  </div>`;
  document.body.appendChild(modal);
  document.getElementById('recalcForm').addEventListener('submit', e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const newTotal = parseFloat(fd.get('totalBill'));
    const newPct = parseFloat(fd.get('consumptionPct'));
    if (!newTotal || newPct < 0 || newPct > 100) return;
    const db2 = getDB();
    const bill = db2.heatBills.find(x => x.id === billId);
    if (!bill) return;
    const totalPay = bill.distribution.reduce((s,i) => s + Number(i.pay), 0);
    const totalArea = bill.distribution.reduce((s,i) => s + Number(i.area), 0);
    const consumptionTotal = newTotal * newPct / 100;
    const fixedTotal = newTotal - consumptionTotal;
    const newDist = bill.distribution.map(i => {
      const cs = totalPay > 0 ? (Number(i.pay) / totalPay) * consumptionTotal : 0;
      const fs = totalArea > 0 ? (Number(i.area) / totalArea) * fixedTotal : 0;
      return { ...i, consumptionShare: cs, fixedShare: fs, amount: cs + fs };
    });
    const sumAmounts = newDist.reduce((s,i) => s + i.amount, 0);
    const diff = newTotal - sumAmounts;
    if (newDist.length && Math.abs(diff) > 0.005) {
      const biggest = newDist.reduce((a,b) => Number(a.pay) > Number(b.pay) ? a : b);
      biggest.amount += diff; biggest.fixedShare += diff;
    }
    let updated = 0, kept = 0;
    newDist.forEach(i => {
      const due = db2.dues.find(d => d.heat_bill_id === billId && d.apartment_id === i.apartment_id);
      if (!due) { db2.dues.push({ id: db2.nextId.due++, site_id: currentSiteId(), apartment_id: i.apartment_id, month: bill.month, year: bill.year, amount: Number(i.amount.toFixed(2)), is_paid: false, paid_at: null, category: 'ısı', heat_bill_id: billId, description: `Isı (${MONTHS[bill.month-1]} ${bill.year})` }); updated++; }
      else if (!due.is_paid) { due.amount = Number(i.amount.toFixed(2)); updated++; }
      else kept++;
    });
    bill.totalBill = newTotal; bill.consumptionPct = newPct;
    bill.consumptionTotal = consumptionTotal; bill.fixedTotal = fixedTotal;
    bill.description = (fd.get('description') || '').trim() || bill.description;
    bill.distribution = newDist;
    setDB(db2); modal.remove();
    alert(`${updated} güncellendi, ${kept} korundu.`);
    render();
  });
}

function detectAnomalies() {
  const db = getDB();
  const bills = siteFilter(db.heatBills || []).sort((a,b) => a.year !== b.year ? a.year - b.year : a.month - b.month);
  if (bills.length < 3) return [];
  const alerts = [];
  const apts = siteFilter(db.apartments);
  apts.forEach(apt => {
    const history = [];
    bills.forEach(b => {
      const item = b.distribution.find(d => d.apartment_id === apt.id);
      if (item && Number(item.pay) > 0) history.push({ year: b.year, month: b.month, pay: Number(item.pay) });
    });
    if (history.length < 3) return;
    const last = history[history.length - 1];
    const prev = history.slice(0, -1);
    const avg = prev.reduce((s,h) => s + h.pay, 0) / prev.length;
    if (avg <= 0) return;
    const deviation = (last.pay - avg) / avg;
    if (Math.abs(deviation) >= 0.50) alerts.push({ aptLabel: aptLabel(apt), month: last.month, year: last.year, pay: last.pay, avg, deviation });
  });
  return alerts.sort((a,b) => Math.abs(b.deviation) - Math.abs(a.deviation));
}

  const validValues = values.filter(v => v !== null && v > 0);
  const avg = validValues.reduce((s,v) => s + v, 0) / validValues.length;
  heatHistoryChartInstance = new Chart(el, {
    type: 'bar',
    data: { labels: MONTHS.map(m => m.substring(0,3)), datasets: [
      { label: aptLabel(apt), data: values, backgroundColor: '#0d6efd' },
      { label: 'Ortalama', data: MONTHS.map(() => avg), type: 'line', borderColor: '#fd7e14', borderDash: [5,5], pointRadius: 0, borderWidth: 2, fill: false }
    ]},
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'top' }, tooltip: { callbacks: { label: ctx => {
        const v = ctx.raw;
        if (v === null || v === undefined) return `${ctx.dataset.label}: yok`;
        return `${ctx.dataset.label}: ${type === 'pay' ? Number(v).toFixed(2) : money(v)}`;
      }}}},
      scales: { y: { beginAtZero: true } } }
  });
  const total = validValues.reduce((s,v) => s + v, 0);
  const max = Math.max(...validValues);
  const maxIdx = values.indexOf(max);
  const info = document.getElementById('heatHistoryInfo');
  if (info) info.innerHTML = `${MONTHS[maxIdx]} en yüksek (${type === 'pay' ? max.toFixed(2) : money(max)}) · Ort: ${type === 'pay' ? avg.toFixed(2) : money(avg)} · Yıl: ${type === 'pay' ? total.toFixed(2) : money(total)}`;
}
function downloadYearlyHeatPDF() {
  const db = getDB();
  const year = parseInt(sessionStorage.getItem('heatCompareYear') || new Date().getFullYear());
  const bills = siteFilter(db.heatBills || []).filter(b => b.year === year).sort((a,b) => a.month - b.month);
  if (!bills.length) { alert(`${year} için ısı kaydı yok.`); return; }
  const apts = siteFilter(db.apartments).sort((a,b) => (a.block||'').localeCompare(b.block||'') || a.number.localeCompare(b.number));
  const site = activeSite() || { name: 'Site', address: '' };
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'landscape' });
  const pageW = 297, margin = 10;
  let y = 15;
  doc.setFont('helvetica', 'bold'); doc.setFontSize(14);
  doc.text(`${site.name || 'Site Yönetimi'} — ${year} Yıllık Isı`, pageW/2, y, { align: 'center' }); y += 5;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8);
  doc.text(`Rapor: ${new Date().toLocaleString('tr-TR')}`, pageW/2, y, { align: 'center' }); y += 8;
  const monthW = (pageW - 2*margin - 55) / bills.length;
  doc.setFont('helvetica', 'bold'); doc.setFontSize(7);
  doc.setFillColor(240,240,240); doc.rect(margin, y - 4, pageW - 2*margin, 7, 'F');
  doc.text('Daire', margin + 1, y); doc.text('m²', margin + 18, y);
  let colX = margin + 28;
  bills.forEach(b => { doc.text(MONTHS[b.month-1].substring(0,3), colX + monthW/2, y, { align: 'center' }); colX += monthW; });
  doc.text('YILLIK', pageW - margin - 1, y, { align: 'right' });
  y += 5;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(7);
  apts.forEach((apt, idx) => {
    if (y > 200) { doc.addPage('a4', 'landscape'); y = 15; }
    if (idx % 2 === 0) { doc.setFillColor(250,250,250); doc.rect(margin, y - 3, pageW - 2*margin, 4.5, 'F'); }
    doc.text(aptLabel(apt), margin + 1, y);
    doc.text(String(apt.area || '-'), margin + 18, y);
    let cx = margin + 28; let total = 0;
    bills.forEach(b => {
      const item = b.distribution.find(d => d.apartment_id === apt.id);
      const val = item ? Number(item.pay) : 0;
      total += val;
      doc.text(val > 0 ? val.toFixed(0) : '-', cx + monthW/2, y, { align: 'center' });
      cx += monthW;
    });
    doc.setFont('helvetica', 'bold');
    doc.text(total > 0 ? total.toFixed(0) : '-', pageW - margin - 1, y, { align: 'right' });
    doc.setFont('helvetica', 'normal');
    y += 4.5;
  });
  doc.save(`yillik-isi-raporu-${year}.pdf`);
}
function downloadHeatDueReceipt(dueId) {
  const db = getDB();
  const d = db.dues.find(x => x.id === dueId);
  if (!d || !d.heat_bill_id) return;
  const bill = (db.heatBills || []).find(b => b.id === d.heat_bill_id);
  if (!bill) return;
  const apt = db.apartments.find(a => a.id === d.apartment_id);
  const resident = db.users.find(u => u.role === 'resident' && u.apartment_id === d.apartment_id);
  const site = activeSite() || { name: 'Site', address: '' };
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a5' });
  const pageW = 148, margin = 10;
  let y = 15;
  doc.setDrawColor(200); doc.rect(4, 4, pageW - 8, 200);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(13);
  doc.text('ISI PAYI MAKBUZU', pageW/2, y, { align: 'center' }); y += 6;
  doc.setFontSize(9); doc.setFont('helvetica', 'normal');
  doc.text(site.name || 'Site Yönetimi', pageW/2, y, { align: 'center' }); y += 6;
  doc.line(margin, y, pageW - margin, y); y += 6;
  doc.setFontSize(9);
  const line = (label, value) => { doc.setFont('helvetica','bold'); doc.text(label, margin, y); doc.setFont('helvetica','normal'); doc.text(String(value), margin + 30, y); y += 5; };
  line('Makbuz No:', 'ISI-' + String(d.id).padStart(5,'0'));
  line('Daire:', apt ? aptLabel(apt) : '-');
  line('Sakin:', resident ? (resident.full_name || resident.username) : '-');
  line('Dönem:', `${MONTHS[bill.month-1]} ${bill.year}`);
  line('Durum:', d.is_paid ? 'ÖDENDİ' : 'ÖDENMEDİ');
  if (d.paid_at) line('Ödeme:', new Date(d.paid_at).toLocaleDateString('tr-TR'));
  y += 3;
  doc.setFillColor(255,243,224); doc.rect(margin, y, pageW - 2*margin, 32, 'F'); y += 4;
  doc.setFont('helvetica', 'bold'); doc.setFontSize(8);
  doc.text('HESAPLAMA DETAYI', margin + 3, y); y += 4;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(7);
  const item = bill.distribution.find(x => x.apartment_id === d.apartment_id);
  if (item) {
    const leftX = margin + 3, rightX = pageW/2 + 2;
    doc.text('Pay Ölçer:', leftX, y); doc.text(Number(item.pay).toFixed(2), leftX + 20, y);
    doc.text('m²:', rightX, y); doc.text(Number(item.area).toFixed(1), rightX + 10, y); y += 4;
    doc.text(`Tüketim (%${bill.consumptionPct}):`, leftX, y); doc.text(money(item.consumptionShare), leftX + 35, y); y += 4;
    doc.text(`Ortak (%${100-bill.consumptionPct}):`, leftX, y); doc.text(money(item.fixedShare), leftX + 35, y); y += 4;
  }
  y += 5;
  doc.setFillColor(230,245,233); doc.rect(margin, y, pageW - 2*margin, 12, 'F');
  doc.setFont('helvetica', 'bold'); doc.setFontSize(11);
  doc.text('TOPLAM: ' + money(d.amount), pageW/2, y + 8, { align: 'center' });
  doc.save(`isi-makbuz-${apt ? aptLabel(apt) : d.apartment_id}-${bill.year}-${String(bill.month).padStart(2,'0')}.pdf`);
}

function deleteProject(projId) {
  const db = getDB();
  const proj = (db.projects || []).find(p => p.id === projId);
  if (!proj) return;
  const relatedDues = db.dues.filter(d => d.project_id === projId);
  const paidCount = relatedDues.filter(d => d.is_paid).length;
  if (paidCount > 0) { if (!confirm(`${paidCount} borç ödenmiş. Ödenmişler korunur, ödenmemişler silinir. Devam?`)) return; }
  else { if (!confirm('Proje ve bağlı borçlar silinecek.')) return; }
  db.dues = db.dues.filter(d => !(d.project_id === projId && !d.is_paid));
  db.dues.filter(d => d.project_id === projId).forEach(d => { delete d.project_id; });
  db.projectFiles = (db.projectFiles || []).filter(f => f.project_id !== projId);
  db.projects = db.projects.filter(p => p.id !== projId);
  setDB(db); render();
}
function viewProjectDetail(projId) {
  const db = getDB();

  const aptGroups = {};
  projectDues.forEach(d => {
    if (!aptGroups[d.apartment_id]) aptGroups[d.apartment_id] = { dues: [], paid: 0, total: 0 };
    aptGroups[d.apartment_id].dues.push(d);
    aptGroups[d.apartment_id].total += Number(d.amount);
    if (d.is_paid) aptGroups[d.apartment_id].paid += Number(d.amount);
  });
  const rows = Object.entries(aptGroups).sort((a,b) => {
    const aptA = db.apartments.find(x => x.id === parseInt(a[0]));

    return `<tr>

function uploadProjectFile(projId, file, category) {

  reader.onload = ev => {

    const existing = db.projectFiles.find(f => f.project_id === projId && f.name === file.name && f.is_latest !== false);
    let newVersion = 1;
    if (existing) { newVersion = (existing.version || 1) + 1; existing.is_latest = false; }
    const newId = db.nextId.projectFile = (db.nextId.projectFile || 1);
    db.nextId.projectFile = newId + 1;
    db.projectFiles.push({ id: newId, site_id: currentSiteId(), project_id: projId, name: file.name, type: file.type, size: file.size, category: finalCategory, data: ev.target.result, version: newVersion, is_latest: true, uploaded_by: currentUser()?.username || '', uploaded_at: new Date().toISOString() });

function openAllWhatsAppLinks(phonesCsv, message) {

  if (!confirm(`${phones.length} WhatsApp penceresi sırayla açılacak.`)) return;

  const openNext = () => {
    if (idx >= phones.length) { alert('Tamamlandı.'); return; }

    const wa = ph.startsWith('90') ? ph : '90' + ph.replace(/^0/,'');
    window.open(`https://wa.me/${wa}?text=${encodeURIComponent(message)}`, '_blank');
    idx++;

  };

function addContactRecord(aptId, form) {
  const fd = new FormData(form);
  const type = fd.get('type'), person = fd.get('person'), contacted_at = fd.get('contacted_at'), note = (fd.get('note') || '').trim();
  if (!type || !person || !contacted_at || !note) { alert('Tüm alanlar zorunlu.'); return; }
  const db = getDB();
  const newId = db.nextId.contactHistory = (db.nextId.contactHistory || 1);
  db.nextId.contactHistory = newId + 1;
  db.contactHistory.push({ id: newId, site_id: currentSiteId(), apartment_id: aptId, type, person, contacted_at: new Date(contacted_at).toISOString(), note, created_by: currentUser()?.username || '', created_at: new Date().toISOString() });
  setDB(db); alert('Kaydedildi.'); render();
}
function deleteContactRecord(recordId) {
  if (!confirm('Silinsin mi?')) return;
  const db = getDB();
  db.contactHistory = (db.contactHistory || []).filter(c => c.id !== recordId);
  setDB(db); render();
}

  doc.save(`daire-gecmisi-${aptLabel(apt)}-${new Date().toISOString().slice(0,10)}.pdf`);

function getBudget(siteId, year) {
  const db = getDB();
  let b = (db.budgets || []).find(x => x.site_id === siteId && x.year === year);
  if (!b) b = { site_id: siteId, year, income: Array(12).fill(0), expense: Array(12).fill(0), notes: Array(12).fill('') };
  return b;
}
function getActuals(siteId, year) {
  const db = getDB();
  const inc = Array(12).fill(0);
  const exp = Array(12).fill(0);
  (db.dues || []).filter(d => d.site_id === siteId && d.is_paid && d.paid_at).forEach(d => { const dt = new Date(d.paid_at); if (dt.getFullYear() === year) inc[dt.getMonth()] += Number(d.amount); });
  (db.extraIncomes || []).filter(x => x.site_id === siteId).forEach(x => { const dt = new Date(x.date); if (dt.getFullYear() === year) inc[dt.getMonth()] += Number(x.amount); });
  (db.cashMovements || []).filter(m => m.site_id === siteId && m.type === 'gelir').forEach(m => { const dt = new Date(m.date); if (dt.getFullYear() === year) inc[dt.getMonth()] += Number(m.amount); });
  (db.partialPayments || []).filter(pp => pp.site_id === siteId).forEach(pp => { const dt = new Date(pp.paid_at); if (dt.getFullYear() === year) inc[dt.getMonth()] += Number(pp.amount); });
  (db.expenses || []).filter(e => e.site_id === siteId).forEach(e => { const dt = new Date(e.paid_at || e.created_at); if (dt.getFullYear() === year) exp[dt.getMonth()] += Number(e.amount); });
  (db.cashMovements || []).filter(m => m.site_id === siteId && m.type === 'gider').forEach(m => { const dt = new Date(m.date); if (dt.getFullYear() === year) exp[dt.getMonth()] += Number(m.amount); });
  return { income: inc, expense: exp };
}
function renderBudget(user) {
  const db = getDB();
  const ro = user.role === 'inspector';
  const sid = currentSiteId();
  const year = parseInt(sessionStorage.getItem('budgetYear')) || new Date().getFullYear();
  const budget = getBudget(sid, year);
  const actuals = getActuals(sid, year);
  const budIncTotal = budget.income.reduce((s,v) => s + Number(v), 0);
  const budExpTotal = budget.expense.reduce((s,v) => s + Number(v), 0);
  const actIncTotal = actuals.income.reduce((s,v) => s + Number(v), 0);
  const actExpTotal = actuals.expense.reduce((s,v) => s + Number(v), 0);
  const incVariance = actIncTotal - budIncTotal;
  const expVariance = actExpTotal - budExpTotal;
  const budNet = budIncTotal - budExpTotal;
  const actNet = actIncTotal - actExpTotal;
  const allYears = new Set([new Date().getFullYear(), year]);
  (db.budgets || []).filter(b => b.site_id === sid).forEach(b => allYears.add(b.year));
  setTimeout(() => drawBudgetChart({ labels: MONTHS.map(m => m.substring(0,3)), budIncome: budget.income, budExpense: budget.expense, actIncome: actuals.income, actExpense: actuals.expense }), 50);
  const rows = MONTHS.map((m, i) => {
    const bi = Number(budget.income[i]) || 0;
    const be = Number(budget.expense[i]) || 0;
    const ai = actuals.income[i];
    const ae = actuals.expense[i];
    const incDiff = ai - bi;
    const expDiff = ae - be;

      <td class="text-end text-success fw-bold">${money(ai)}${incPct !== null ? `<div class="small text-muted">${incPct.toFixed(0)}%</div>` : ''}</td>
      <td class="text-end">${incDiff === 0 ? '<span class="text-muted">-</span>' : incDiff > 0 ? `<span class="text-success">+${money(incDiff)}</span>` : `<span class="text-danger">${money(incDiff)}</span>`}</td>

    </tr>`;
  }).join('');
  return `

      ${!ro ? `<div class="col-md-3"><button class="btn btn-outline-primary w-100" onclick="copyBudgetFromPreviousYear()">📋 Önceki Yıldan</button></div>
      <div class="col-md-3"><button class="btn btn-outline-success w-100" onclick="copyBudgetFromActuals()">📊 Geçen Yıl Gerçekleşen</button></div>
      <div class="col-md-3"><button class="btn btn-outline-dark w-100" onclick="downloadBudgetPDF()">🖨️ PDF</button></div>` : ''}

    </div>

    </table></div>`;
}
function updateBudget(monthIdx, field, value) {
  const db = getDB();
  const sid = currentSiteId();
  const year = parseInt(sessionStorage.getItem('budgetYear')) || new Date().getFullYear();
  let b = db.budgets.find(x => x.site_id === sid && x.year === year);
  if (!b) { b = { site_id: sid, year, income: Array(12).fill(0), expense: Array(12).fill(0), notes: Array(12).fill('') }; db.budgets.push(b); }
  if (field === 'income' || field === 'expense') b[field][monthIdx] = parseFloat(value) || 0;
  else if (field === 'notes') b.notes[monthIdx] = String(value || '');
  setDB(db);
  const actuals = getActuals(sid, year);
  drawBudgetChart({ labels: MONTHS.map(m => m.substring(0,3)), budIncome: b.income, budExpense: b.expense, actIncome: actuals.income, actExpense: actuals.expense });
}
let budgetChartInstance = null;
function drawBudgetChart(data) {
  const el = document.getElementById('budgetChart');
  if (!el || typeof Chart === 'undefined') return;
  if (budgetChartInstance) { budgetChartInstance.destroy(); budgetChartInstance = null; }
  budgetChartInstance = new Chart(el, {
    type: 'line',
    data: { labels: data.labels, datasets: [
      { label: 'Gelir Plan', data: data.budIncome, borderColor: '#198754', borderDash: [5,5], tension: .3, pointRadius: 2, borderWidth: 2 },
      { label: 'Gelir Gerçek', data: data.actIncome, borderColor: '#198754', tension: .3, pointRadius: 3, borderWidth: 2 },
      { label: 'Gider Plan', data: data.budExpense, borderColor: '#dc3545', borderDash: [5,5], tension: .3, pointRadius: 2, borderWidth: 2 },
      { label: 'Gider Gerçek', data: data.actExpense, borderColor: '#dc3545', tension: .3, pointRadius: 3, borderWidth: 2 }
    ]},
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'top', labels: { boxWidth: 12, font: { size: 10 } } }, tooltip: { callbacks: { label: ctx => `${ctx.dataset.label}: ${money(ctx.raw)}` } } },
      scales: { y: { beginAtZero: true } } }
  });
}
function copyBudgetFromPreviousYear() {
  const db = getDB();
  const sid = currentSiteId();
  const year = parseInt(sessionStorage.getItem('budgetYear')) || new Date().getFullYear();
  const prev = db.budgets.find(x => x.site_id === sid && x.year === year - 1);
  if (!prev) { alert(`${year-1} bütçesi yok.`); return; }
  if (!confirm('Kopyalanacak.')) return;
  let b = db.budgets.find(x => x.site_id === sid && x.year === year);
  if (!b) { b = { site_id: sid, year, income: Array(12).fill(0), expense: Array(12).fill(0), notes: Array(12).fill('') }; db.budgets.push(b); }
  b.income = [...prev.income]; b.expense = [...prev.expense]; b.notes = [...prev.notes];
  setDB(db); alert('Kopyalandı.'); render();
}
function copyBudgetFromActuals() {
  const db = getDB();
  const sid = currentSiteId();
  const year = parseInt(sessionStorage.getItem('budgetYear')) || new Date().getFullYear();
  const actuals = getActuals(sid, year - 1);
  if (!actuals.income.some(v => v > 0) && !actuals.expense.some(v => v > 0)) { alert(`${year-1} veri yok.`); return; }
  if (!confirm('Kopyalanacak.')) return;
  let b = db.budgets.find(x => x.site_id === sid && x.year === year);
  if (!b) { b = { site_id: sid, year, income: Array(12).fill(0), expense: Array(12).fill(0), notes: Array(12).fill('') }; db.budgets.push(b); }
  b.income = [...actuals.income]; b.expense = [...actuals.expense];
  setDB(db); alert('Kopyalandı.'); render();
}
function downloadBudgetPDF() {
  const db = getDB();
  const sid = currentSiteId();
  const year = parseInt(sessionStorage.getItem('budgetYear')) || new Date().getFullYear();
  const budget = getBudget(sid, year);
  const actuals = getActuals(sid, year);
  const site = activeSite() || { name: 'Site', address: '' };
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'landscape' });
  const pageW = 297, margin = 12;
  let y = 18;
  doc.setFont('helvetica', 'bold'); doc.setFontSize(14);
  doc.text(`${site.name || 'Site'} — ${year} Bütçe`, pageW/2, y, { align: 'center' }); y += 6;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8);
  doc.text(`Rapor: ${new Date().toLocaleString('tr-TR')}`, pageW/2, y, { align: 'center' }); y += 10;
  const budInc = budget.income.reduce((s,v)=>s+Number(v),0);
  const budExp = budget.expense.reduce((s,v)=>s+Number(v),0);
  const actInc = actuals.income.reduce((s,v)=>s+v,0);
  const actExp = actuals.expense.reduce((s,v)=>s+v,0);
  const boxW = (pageW - 2*margin - 15) / 4;
  [['Plan Gelir', money(budInc), [25,135,84]], ['Gerçek Gelir', money(actInc), [13,110,253]], ['Plan Gider', money(budExp), [220,53,69]], ['Gerçek Gider', money(actExp), [253,126,20]]].forEach((b, i) => {
    const x = margin + i * (boxW + 3);
    doc.setFillColor(...b[2]); doc.roundedRect(x, y, boxW, 14, 2, 2, 'F');
    doc.setTextColor(255); doc.setFont('helvetica', 'normal'); doc.setFontSize(7);
    doc.text(b[0], x + boxW/2, y + 5, { align: 'center' });
    doc.setFont('helvetica', 'bold'); doc.setFontSize(10);
    doc.text(b[1], x + boxW/2, y + 11, { align: 'center' });
  });
  doc.setTextColor(0); y += 20;
  const cols = [['Ay', margin, 22, 'left'], ['Plan Gelir', margin+22, 33, 'right'], ['Gerçek Gelir', margin+55, 33, 'right'], ['Sapma', margin+88, 33, 'right'], ['Plan Gider', margin+121, 33, 'right'], ['Gerçek Gider', margin+154, 33, 'right'], ['Sapma', margin+187, 33, 'right'], ['Not', margin+220, pageW-margin-(margin+220), 'left']];
  doc.setFillColor(240,240,240); doc.rect(margin, y - 4, pageW - 2*margin, 6, 'F');
  doc.setFont('helvetica', 'bold'); doc.setFontSize(7);
  cols.forEach(c => { const tx = c[3] === 'right' ? c[1] + c[2] - 1 : c[1] + 1; doc.text(c[0], tx, y, { align: c[3] }); });
  y += 4;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(7);
  MONTHS.forEach((m, i) => {
    if (y > 195) { doc.addPage('a4', 'landscape'); y = 15; }
    if (i % 2 === 0) { doc.setFillColor(250,250,250); doc.rect(margin, y - 3, pageW - 2*margin, 4.2, 'F'); }
    const bi = Number(budget.income[i]) || 0, be = Number(budget.expense[i]) || 0;
    const ai = actuals.income[i], ae = actuals.expense[i];
    const vals = [m, money(bi), money(ai), (ai - bi >= 0 ? '+' : '') + money(ai - bi), money(be), money(ae), (ae - be >= 0 ? '+' : '') + money(ae - be), budget.notes[i] || ''];
    vals.forEach((v, idx) => { const c = cols[idx]; const tx = c[3] === 'right' ? c[1] + c[2] - 1 : c[1] + 1; doc.text(String(v), tx, y, { align: c[3] }); });
    y += 4.2;
  });
  doc.save(`butce-${year}.pdf`);
}

function uploadSiteLogo(siteId, file) {
  if (!file) return;
  if (file.size > 500 * 1024) { alert('Logo 500 KB\'dan küçük olmalı.'); return; }
  const reader = new FileReader();
  reader.onload = ev => {
    const db = getDB();
    db.siteLogos = db.siteLogos || {};
    db.siteLogos[siteId] = ev.target.result;
    try { setDB(db); } catch (err) { alert('Depolama doldu.'); return; }
    render();
  };
  reader.readAsDataURL(file);
}
function removeSiteLogo(siteId) {
  if (!confirm('Logo silinsin mi?')) return;
  const db = getDB();
  if (db.siteLogos) delete db.siteLogos[siteId];
  setDB(db); render();
}
function deleteSite(id) {
  if (id === 1) { alert('Varsayılan silinemez.'); return; }
  if (!confirm('Site ve tüm verileri silinecek.')) return;

function renderAnnouncements(user) {
  const db = getDB();
  const isAdmin = user.role === 'admin';
  const isInspector = user.role === 'inspector';
  const isResident = user.role === 'resident' || user.role === 'tenant';
  const sid = currentSiteId();
  const now = new Date();
  const allAnns = siteFilter(db.announcements || []);
  const visibleAnns = allAnns.filter(a => {
    if (isResident) {
      if (a.publish_at && new Date(a.publish_at) > now) return false;
    }
    return !a.expires_at || new Date(a.expires_at) > now || isAdmin || isInspector;
  });
  const activeAnns = visibleAnns.filter(a => !(a.expires_at && new Date(a.expires_at) <= now));
  const scheduledAnns = allAnns.filter(a => a.publish_at && new Date(a.publish_at) > now && !(a.expires_at && new Date(a.expires_at) <= now));
  const archivedAnns = allAnns.filter(a => a.expires_at && new Date(a.expires_at) <= now);
  const activeCatFilter = sessionStorage.getItem('annCategoryFilter') || '';
  const filteredActiveAnns = activeCatFilter ? activeAnns.filter(a => a.category === activeCatFilter) : activeAnns;
  if (isResident) {
    const db2 = getDB();
    let changed = false;
    filteredActiveAnns.forEach(a => {
      const existing = (db2.announcementReads || []).find(r => r.announcement_id === a.id && r.user_id === user.id);
      if (!existing) {
        const newId = db2.nextId.announcementRead = (db2.nextId.announcementRead || 1);
        db2.nextId.announcementRead = newId + 1;
        db2.announcementReads.push({ id: newId, site_id: sid, announcement_id: a.id, user_id: user.id, read_at: new Date().toISOString() });
        changed = true;
      }
    });
    if (changed) setDB(db2);
  }
  const catInfo = key => ANNOUNCEMENT_CATEGORIES.find(c => c.key === key) || ANNOUNCEMENT_CATEGORIES[0];
  const sortedActive = [...filteredActiveAnns].sort((a,b) => {

function toggleAnnLike(annId) {
  const db = getDB();
  const user = currentUser();
  if (!user) return;
  const existing = (db.announcementLikes || []).find(l => l.announcement_id === annId && l.user_id === user.id);
  if (existing) db.announcementLikes = db.announcementLikes.filter(l => l.id !== existing.id);
  else {
    const newId = db.nextId.announcementLike = (db.nextId.announcementLike || 1);
    db.nextId.announcementLike = newId + 1;
    db.announcementLikes.push({ id: newId, site_id: currentSiteId(), announcement_id: annId, user_id: user.id, user_name: user.full_name || user.username, created_at: new Date().toISOString() });
  }
  setDB(db);
  render();
}
function addAnnComment(annId, form) {
  const fd = new FormData(form);
  const message = (fd.get('message') || '').trim();
  if (!message) return;
  const user = currentUser();
  if (!user) return;
  const db = getDB();
  const newId = db.nextId.announcementComment = (db.nextId.announcementComment || 1);
  db.nextId.announcementComment = newId + 1;
  db.announcementComments.push({ id: newId, site_id: currentSiteId(), announcement_id: annId, user_id: user.id, user_name: user.full_name || user.username, message, parent_id: null, created_at: new Date().toISOString() });
  const ann = (db.announcements || []).find(a => a.id === annId);
  if (ann && ann.created_by && ann.created_by !== user.username) {
    const owner = (db.users || []).find(u => u.username === ann.created_by);
    if (owner) {
      const notifId = db.nextId.notification = (db.nextId.notification || 1);
      db.nextId.notification = notifId + 1;
      db.notifications.push({ id: notifId, site_id: currentSiteId(), apartment_id: null, type: 'comment_reply', announcement_id: annId, target_user_id: owner.id, message: `💬 ${user.full_name || user.username}, "${ann.title || ann.message.substring(0, 40)}" duyurusuna yorum yaptı: "${message.substring(0, 80)}"`, channel: 'app', resident_name: owner.full_name || owner.username, resident_email: owner.email || '', resident_phone: owner.phone || '', is_read: false, created_at: new Date().toISOString() });
    }
  }
  const mentionRegex = /@([a-zA-Z0-9_.]+)/g;
  let match;
  const mentioned = new Set();
  while ((match = mentionRegex.exec(message)) !== null) mentioned.add(match[1].toLowerCase());
  mentioned.forEach(uname => {
    const target = (db.users || []).find(u => u.username.toLowerCase() === uname && u.id !== user.id);
    if (!target) return;
    if (!isNotificationEnabled(target.id, 'mention')) return;
    const notifId = db.nextId.notification = (db.nextId.notification || 1);
    db.nextId.notification = notifId + 1;
    db.notifications.push({ id: notifId, site_id: currentSiteId(), apartment_id: null, type: 'mention', announcement_id: annId, target_user_id: target.id, message: `🔔 ${user.full_name || user.username} sizi bir yorumda etiketledi: "${message.substring(0, 100)}"`, channel: 'app', resident_name: target.full_name || target.username, resident_email: target.email || '', resident_phone: target.phone || '', is_read: false, created_at: new Date().toISOString() });
  });
  setDB(db);
  render();
  setTimeout(() => { const el = document.getElementById('comments_' + annId); if (el) el.style.display = 'block'; }, 50);
}
function deleteAnnComment(commentId) {
  if (!confirm('Yorum silinsin mi?')) return;
  const db = getDB();
  const c = (db.announcementComments || []).find(x => x.id === commentId);
  if (!c) return;
  const annId = c.announcement_id;
  const toDelete = new Set([commentId]);
  let changed = true;
  while (changed) {
    changed = false;
    (db.announcementComments || []).forEach(c2 => { if (c2.parent_id && toDelete.has(c2.parent_id) && !toDelete.has(c2.id)) { toDelete.add(c2.id); changed = true; } });
  }
  db.announcementComments = db.announcementComments.filter(c2 => !toDelete.has(c2.id));
  setDB(db);
  render();
  setTimeout(() => { const el = document.getElementById('comments_' + annId); if (el) el.style.display = 'block'; }, 50);
}

function openAnnCalendar() {
  const db = getDB();
  const sid = currentSiteId();
  const anns = (db.announcements || []).filter(a => a.site_id === sid);
  const now = new Date();
  const existing = document.getElementById('annCalendarModal');
  if (existing) existing.remove();
  const modal = document.createElement('div');
  modal.id = 'annCalendarModal';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
  modal.onclick = e => { if (e.target === modal) modal.remove(); };
  modal.innerHTML = `<div style="background:white;border-radius:8px;max-width:1000px;width:100%;max-height:90vh;overflow:auto;padding:20px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="mb-0">📅 Duyuru Takvimi</h5>
      <button class="btn btn-sm btn-outline-secondary" onclick="document.getElementById('annCalendarModal').remove()">Kapat</button>
    </div>
    <div id="annCalendarBody"></div>
  </div>`;
  document.body.appendChild(modal);
  window._annCalendarState = {
    viewYear: now.getFullYear(),
    viewMonth: now.getMonth(),
    anns,
    renderCalendar: function() {
      const viewYear = window._annCalendarState.viewYear;
      const viewMonth = window._annCalendarState.viewMonth;
      const firstDay = new Date(viewYear, viewMonth, 1);
      const lastDay = new Date(viewYear, viewMonth + 1, 0);
      const startWeekday = firstDay.getDay() === 0 ? 7 : firstDay.getDay();
      const daysInMonth = lastDay.getDate();
      const eventsByDay = {};
      anns.forEach(a => {
        const pubDate = a.publish_at ? new Date(a.publish_at) : new Date(a.created_at);
        if (pubDate.getFullYear() === viewYear && pubDate.getMonth() === viewMonth) {
          const day = pubDate.getDate();
          if (!eventsByDay[day]) eventsByDay[day] = [];
          eventsByDay[day].push({ ...a, _isScheduled: a.publish_at && new Date(a.publish_at) > now });
        }
      });
      const cells = [];
      for (let i = 1; i < startWeekday; i++) cells.push(`<div class="border p-1" style="min-height:80px;background:#f8f9fa;"></div>`);
      for (let day = 1; day <= daysInMonth; day++) {
        const isToday = now.getFullYear() === viewYear && now.getMonth() === viewMonth && now.getDate() === day;
        const dayEvents = eventsByDay[day] || [];
        cells.push(`<div class="border p-1" style="min-height:80px;${isToday ? 'background:#fff3cd;' : ''}">
          <div class="small fw-bold mb-1">${day}</div>
          ${dayEvents.map(e => {
            const cat = ANNOUNCEMENT_CATEGORIES.find(c => c.key === e.category) || ANNOUNCEMENT_CATEGORIES[0];
            return `<div class="small" style="cursor:pointer;padding:1px 3px;margin-bottom:2px;border-radius:3px;background:var(--bs-${cat.color});color:white;" title="${esc(e.title || e.message.substring(0, 80))}" onclick="event.stopPropagation(); editAnnouncement(${e.id});">${e._isScheduled ? '⏰' : cat.icon} ${esc((e.title || e.message).substring(0, 18))}</div>`;
          }).join('')}
        </div>`);
      }
      const monthNames = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
      const prevMonth = viewMonth === 0 ? 11 : viewMonth - 1;
      const prevYear = viewMonth === 0 ? viewYear - 1 : viewYear;
      const nextMonth = viewMonth === 11 ? 0 : viewMonth + 1;
      const nextYear = viewMonth === 11 ? viewYear + 1 : viewYear;
      document.getElementById('annCalendarBody').innerHTML = `
        <div class="d-flex justify-content-between align-items-center mb-2">
          <button class="btn btn-sm btn-outline-secondary" onclick="annCalendarNav(${prevYear}, ${prevMonth})">◀ ${monthNames[prevMonth]}</button>
          <h6 class="mb-0">${monthNames[viewMonth]} ${viewYear}</h6>
          <button class="btn btn-sm btn-outline-secondary" onclick="annCalendarNav(${nextYear}, ${nextMonth})">${monthNames[nextMonth]} ▶</button>
        </div>
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;">
          ${['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'].map(d => `<div class="text-center small fw-bold p-1 bg-secondary text-white">${d}</div>`).join('')}
          ${cells.join('')}
        </div>`;
    }
  };
  window._annCalendarState.renderCalendar();
}
function annCalendarNav(year, month) {
  if (!window._annCalendarState) return;
  window._annCalendarState.viewYear = year;
  window._annCalendarState.viewMonth = month;
  window._annCalendarState.renderCalendar();
}

function purgeAnnouncementArchive() {
  const now = new Date();
  const db = getDB();
  const sid = currentSiteId();
  const toDelete = (db.announcements || []).filter(a => a.site_id === sid && a.expires_at && new Date(a.expires_at) <= now);
  if (!toDelete.length) { alert('Arşiv yok.'); return; }
  if (!confirm(`${toDelete.length} süresi dolmuş duyuru kalıcı silinecek.`)) return;
  const ids = toDelete.map(a => a.id);
  db.announcements = db.announcements.filter(a => !ids.includes(a.id));
  db.announcementReads = (db.announcementReads || []).filter(r => !ids.includes(r.announcement_id));
  setDB(db); alert(`${ids.length} duyuru silindi.`); render();
}

        const invalid = files.filter(f => f.size > maxSize);
        const info = document.getElementById('annFilesInfo');
        if (info) info.innerHTML = valid.length ? `${valid.length} dosya${invalid.length ? `, <span class="text-danger">${invalid.length} çok büyük</span>` : ''}` : '';
      });
    }
    annf.addEventListener('submit', e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const category = fd.get('category');
      const title = (fd.get('title') || '').trim();
      const message = (fd.get('message') || '').trim();
      const expiresAt = fd.get('expires_at');
      const publishAt = fd.get('publish_at');
      const isPinned = fd.get('is_pinned') === 'on';
      if (!message) { alert('Mesaj zorunlu.'); return; }
      const filesInput = document.getElementById('annFiles');
      const files = filesInput ? Array.from(filesInput.files) : [];
      const maxSize = getMaxFileSize();
      const validFiles = files.filter(f => f.size <= maxSize);
      if (files.length && validFiles.length < files.length) {
        if (!confirm(`${files.length - validFiles.length} dosya çok büyük ve atlanacak.`)) return;
      }
      const readFiles = (cb) => {
        if (!validFiles.length) { cb([]); return; }
        const results = []; let i = 0;
        const next = () => { if (i >= validFiles.length) { cb(results); return; } const file = validFiles[i]; const reader = new FileReader(); reader.onload = ev => { results.push({ name: file.name, type: file.type, data: ev.target.result, size: file.size }); i++; next(); }; reader.readAsDataURL(file); };
        next();
      };
      readFiles(attachments => {
        const db = getDB();
        const sid = currentSiteId();
        const newId = db.nextId.announcement = (db.nextId.announcement || 1);
        db.nextId.announcement = newId + 1;
        const isScheduled = publishAt && new Date(publishAt) > new Date();
        db.announcements.push({ id: newId, site_id: sid, category, title, message, is_pinned: isPinned, publish_at: publishAt ? new Date(publishAt).toISOString() : null, expires_at: expiresAt ? new Date(expiresAt).toISOString() : null, created_at: new Date().toISOString(), created_by: currentUser()?.username || '', attachments });
        if (!isScheduled) {
          const catInfo = ANNOUNCEMENT_CATEGORIES.find(c => c.key === category) || { label: 'Duyuru', icon: '📢' };
          const recipients = (db.users || []).filter(u => u.site_id === sid && (u.role === 'resident' || u.role === 'tenant'));
          recipients.forEach(u => {
            if (!isNotificationEnabled(u.id, 'announcement')) return;
            const notifId = db.nextId.notification = (db.nextId.notification || 1);
            db.nextId.notification = notifId + 1;
            db.notifications.push({ id: notifId, site_id: sid, apartment_id: u.apartment_id || null, type: 'announcement', announcement_id: newId, message: `${catInfo.icon} ${catInfo.label}: ${title || message.substring(0, 80)}`, channel: 'app', resident_name: u.full_name || u.username, resident_email: u.email || '', resident_phone: u.phone || '', is_read: false, created_at: new Date().toISOString() });
          });
        }
        try { setDB(db); } catch (err) { alert('Depolama doldu.'); return; }
        alert(isScheduled ? 'Duyuru zamanlandı.' : 'Yayınlandı.');
        render();
      });
    });
  }
  const pf = document.getElementById('projectForm');
  if (pf) pf.addEventListener('submit', e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const name = (fd.get('name') || '').trim();
    const description = (fd.get('description') || '').trim();
    const totalAmount = parseFloat(fd.get('totalAmount'));
    const shareType = fd.get('shareType');
    const installmentCount = parseInt(fd.get('installmentCount'));
    const startMonth = parseInt(fd.get('startMonth'));
    const startYear = parseInt(fd.get('startYear'));
    if (!name || !totalAmount || totalAmount <= 0) { alert('Ad ve tutar zorunlu.'); return; }
    if (installmentCount < 1 || installmentCount > 60) { alert('Taksit 1-60.'); return; }
    const db = getDB();
    const sid = currentSiteId();
    const apts = siteFilter(db.apartments);
    if (!apts.length) { alert('Daire yok.'); return; }
    if (shareType === 'area') {
      const noArea = apts.filter(a => !a.area || a.area <= 0);
      if (noArea.length > 0 && !confirm(`${noArea.length} dairede m² yok. Devam?`)) return;
    }
    const projId = db.nextId.project = (db.nextId.project || 1);
    db.nextId.project = projId + 1;
    db.projects.push({ id: projId, site_id: sid, name, description, totalAmount, shareType, installmentCount, startMonth, startYear, createdAt: new Date().toISOString(), createdBy: currentUser()?.username || '' });
    let shares = [];
    if (shareType === 'equal') { const perApt = totalAmount / apts.length; shares = apts.map(a => ({ apt: a, share: perApt })); }
    else { const totalArea = apts.reduce((s, a) => s + (Number(a.area) || 0), 0); if (totalArea <= 0) { alert('Toplam m² sıfır.'); return; } shares = apts.map(a => ({ apt: a, share: (Number(a.area) || 0) / totalArea * totalAmount })); }
    const sumShares = shares.reduce((s, x) => s + x.share, 0);
    const diff = totalAmount - sumShares;
    if (Math.abs(diff) > 0.005 && shares.length) { const biggest = shares.reduce((a,b) => a.share > b.share ? a : b); biggest.share += diff; }
    let created = 0;
    shares.forEach(({ apt, share }) => {
      const perAptInstallment = share / installmentCount;
      for (let i = 0; i < installmentCount; i++) {
        let m = startMonth + i; let y = startYear;
        while (m > 12) { m -= 12; y++; }
        const exists = db.dues.find(d => d.project_id === projId && d.apartment_id === apt.id && d.month === m && d.year === y);
        if (exists) continue;
        db.dues.push({ id: db.nextId.due++, site_id: sid, apartment_id: apt.id, month: m, year: y, amount: Number(perAptInstallment.toFixed(2)), is_paid: false, paid_at: null, category: 'proje', project_id: projId, description: `${name}${installmentCount > 1 ? ' (Taksit ' + (i+1) + '/' + installmentCount + ')' : ''}` });
        created++;
      }
    });
    apts.forEach(apt => {
      const resident = db.users.find(u => u.role === 'resident' && u.apartment_id === apt.id);
      if (resident && !isNotificationEnabled(resident.id, 'project_announce')) return;
      const notifId = db.nextId.notification = (db.nextId.notification || 1);
      db.nextId.notification = notifId + 1;
      db.notifications.push({ id: notifId, site_id: sid, apartment_id: apt.id, type: 'project_announce', project_id: projId, message: `📋 Yeni proje: ${name} — ${money(totalAmount)}, ${installmentCount} taksit.`, channel: 'app', resident_name: resident ? (resident.full_name || resident.username) : '', resident_email: resident ? (resident.email || '') : '', resident_phone: resident ? (resident.phone || '') : '', is_read: false, created_at: new Date().toISOString() });
    });
    setDB(db);
    alert(`Proje oluşturuldu. ${created} borç eklendi.`);
    render();
  });
}

/* ============================================================
   BAŞLAT
============================================================ */
render();
</script>
