function applyFavicon() {
  const db = getDB();
  const sid = currentSiteId();
  const logoData = sid ? (db.siteLogos || {})[sid] : null;
  if (!logoData) {
    const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🏢</text></svg>`;
    setFaviconLink('data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgIcon))), 'image/svg+xml');
    return;
  }
  const img = new Image();
  img.onload = () => {
    try {
      const canvas = document.createElement('canvas');
      canvas.width = 64; canvas.height = 64;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, 64, 64);
      ctx.drawImage(img, 0, 0, 64, 64);
      setFaviconLink(canvas.toDataURL('image/png'), 'image/png');
    } catch (err) { setFaviconLink(logoData, 'image/png'); }
  };
  img.onerror = () => {
    const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🏢</text></svg>`;
    setFaviconLink('data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgIcon))), 'image/svg+xml');
  };
  img.src = logoData;
}

function setFaviconLink(href, type) {
  document.querySelectorAll('link[rel="icon"], link[rel="shortcut icon"], link[rel="apple-touch-icon"]').forEach(el => el.remove());
  const link = document.createElement('link');
  link.rel = 'icon'; link.type = type || 'image/png'; link.href = href;
  document.head.appendChild(link);
  const appleLink = document.createElement('link');
  appleLink.rel = 'apple-touch-icon'; appleLink.href = href;
  document.head.appendChild(appleLink);
}

/* ============================================================
   MANIFEST (PWA)
============================================================ */
function applyManifest() {
  const db = getDB();
  const sid = currentSiteId();
  const site = sid ? db.sites.find(s => s.id === sid) : null;
  const siteName = site?.name || 'Site Yönetim';
  const logo = sid ? (db.siteLogos || {})[sid] : null;
  const theme = COLOR_THEMES[currentColorTheme()] || COLOR_THEMES.blue;
  const manifest = {
    name: siteName,
    short_name: siteName.length > 12 ? siteName.substring(0, 12) : siteName,
    description: 'Site yönetim uygulaması',
    start_url: window.location.href.split('?')[0],
    display: 'standalone', orientation: 'portrait',
    background_color: isDark() ? '#0f1115' : '#eef2f7',
    theme_color: theme.primary,
    lang: 'tr',
    categories: ['productivity', 'utilities'],
    icons: []
  };
  const defaultIcon = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" fill="${theme.primary}"/><text x="256" y="340" font-size="280" text-anchor="middle" fill="white">🏢</text></svg>`)));
  if (logo) {
    const sizes = [192, 512];
    let done = 0;
    sizes.forEach(size => {
      const img = new Image();
      img.onload = () => {
        try {
          const canvas = document.createElement('canvas');
          canvas.width = size; canvas.height = size;
          const ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, size, size);
          ctx.drawImage(img, 0, 0, size, size);
          manifest.icons.push({ src: canvas.toDataURL('image/png'), sizes: `${size}x${size}`, type: 'image/png', purpose: size === 512 ? 'any maskable' : 'any' });
          if (++done === sizes.length) applyManifestLink(manifest);
        } catch (err) { if (++done === sizes.length) applyManifestLink(manifest); }
      };
      img.onerror = () => { if (++done === sizes.length && !manifest.icons.length) { manifest.icons.push({ src: defaultIcon, sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable' }); applyManifestLink(manifest); } };
      img.src = logo;
    });
  } else {
    manifest.icons.push({ src: defaultIcon, sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable' });
    applyManifestLink(manifest);
  }
}

function applyManifestLink(manifest) {
  document.querySelectorAll('link[rel="manifest"]').forEach(el => el.remove());
  const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
  const manifestUrl = URL.createObjectURL(blob);
  const link = document.createElement('link');
  link.rel = 'manifest'; link.href = manifestUrl;
  document.head.appendChild(link);
  document.querySelectorAll('meta[name="theme-color"]').forEach(el => el.remove());
  const themeMeta = document.createElement('meta');
  themeMeta.name = 'theme-color'; themeMeta.content = manifest.theme_color;
  document.head.appendChild(themeMeta);
}

  const incomeDue = dues.reduce((s,d) => s + Number(d.amount), 0);
  const expenseTotal = expenses.reduce((s,e) => s + Number(e.amount), 0);
  const manuelIn = cm.filter(m => m.type === 'gelir').reduce((s,m) => s + Number(m.amount), 0);
  const manuelOut = cm.filter(m => m.type === 'gider').reduce((s,m) => s + Number(m.amount), 0);
  const extraIn = extra.reduce((s,x) => s + Number(x.amount), 0);
  const partialIn = partials.reduce((s,pp) => s + Number(pp.amount), 0);
  const income = incomeDue + manuelIn + extraIn + partialIn;
  const expense = expenseTotal + manuelOut;
  return { income, expense, balance: income - expense };
}

/* ============================================================
   İŞ MANTIĞI — FAİZ HESABI
============================================================ */
function calcDueInterest(due, dailyRate, refDate) {
  if (due.is_paid) return null;
  const dueDate = new Date(due.year, due.month, 0);
  const today = refDate || new Date();
  if (today <= dueDate) return null;
  const days = Math.floor((today - dueDate) / (1000*60*60*24));
  if (days <= 0) return null;
  return { days, dueDate, interest: Number(due.amount) * dailyRate * days };
}

  /* ============================================================
   CSV İNDİRME
============================================================ */
function downloadCSV(filename, rows) {
  const csv = rows.map(row =>
    row.map(cell => {
      const s = String(cell ?? '');
      return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }).join(';')
  ).join('\r\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ============================================================
   CSV PARSE
============================================================ */
function parseCSV(text) {
  text = text.replace(/^\uFEFF/, '');
  const firstLine = text.split(/\r?\n/)[0] || '';
  const counts = {
    ';': (firstLine.match(/;/g)||[]).length,
    ',': (firstLine.match(/,/g)||[]).length,
    '\t': (firstLine.match(/\t/g)||[]).length
  };
  const sep = Object.keys(counts).reduce((a,b) => counts[a] >= counts[b] ? a : b);
  const rows = [];
  let cur = [];
  let field = '';
  let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQuotes) {
      if (ch === '"') {
        if (text[i+1] === '"') { field += '"'; i++; }
        else { inQuotes = false; }
      } else { field += ch; }
    } else {
      if (ch === '"') inQuotes = true;
      else if (ch === sep) { cur.push(field); field = ''; }
      else if (ch === '\r') {}
      else if (ch === '\n') { cur.push(field); rows.push(cur); cur = []; field = ''; }
      else field += ch;
    }
  }
  if (field.length || cur.length) { cur.push(field); rows.push(cur); }
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}

/* ============================================================
   EXCEL PARSE
============================================================ */
function parseExcel(file, callback) {
  if (typeof XLSX === 'undefined') {
    alert('Excel kütüphanesi yüklenemedi.');
    callback(null);
    return;
  }
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = new Uint8Array(ev.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1, raw: false, defval: '' });
      callback(rows.filter(r => r.some(c => String(c).trim() !== '')));
    } catch (err) {
      alert('Excel okunamadı: ' + err.message);
      callback(null);
    }
  };
  reader.readAsArrayBuffer(file);
}

function readSpreadsheet(file, callback) {
  if (!file) { callback(null); return; }
  const name = file.name.toLowerCase();
  if (name.endsWith('.xlsx') || name.endsWith('.xls')) {
    parseExcel(file, callback);
  } else {
    const reader = new FileReader();
    reader.onload = ev => callback(parseCSV(ev.target.result));
    reader.readAsText(file, 'UTF-8');
  }
}

  });

/* ============================================================
   YENİ DAİRE → GEÇMİŞ AİDAT DÖNEMLERİNİ KOPYALA
============================================================ */
function syncNewApartmentDues(newApt) {
  if (!newApt || !newApt.id) return 0;
  const db = getDB();
  const sid = currentSiteId();
  const now = new Date();
  const cutoff = new Date(now.getFullYear(), now.getMonth() - 11, 1);
  const periods = new Map();
  siteFilter(db.dues).forEach(d => {
    if (d.apartment_id === newApt.id) return;
    if (d.category && d.category !== 'aidat') return;
    const dDate = new Date(d.year, d.month - 1, 1);
    if (dDate < cutoff) return;
    const key = `${d.year}-${d.month}`;
    if (!periods.has(key)) periods.set(key, { year: d.year, month: d.month, amounts: [] });
    periods.get(key).amounts.push(Number(d.amount));
  });
  if (!periods.size) return 0;
  let added = 0;
  const addedPeriods = [];
  periods.forEach(({ year, month, amounts }) => {
    const exists = db.dues.find(d => d.apartment_id === newApt.id && d.year === year && d.month === month && (!d.category || d.category === 'aidat'));
    if (exists) return;
    const counts = {};
    amounts.forEach(a => { counts[a] = (counts[a] || 0) + 1; });
    const mode = Object.entries(counts).sort((a,b) => b[1] - a[1])[0];
    const amount = parseFloat(mode[0]);
    if (!isFinite(amount) || amount <= 0) return;
    db.dues.push({ id: db.nextId.due++, site_id: sid, apartment_id: newApt.id, month, year, amount, is_paid: false, paid_at: null });
    added++;
    addedPeriods.push(`${MONTHS[month-1]} ${year} — ${money(amount)}`);
  });
  if (added > 0) {
    setDB(db);
    setTimeout(() => {
      alert(`ℹ️ ${aptLabel(newApt)} dairesi için ${added} dönemde aidat borcu otomatik oluşturuldu:\n\n${addedPeriods.join('\n')}`);
    }, 100);
  }
  return added;
}

      </form>
      <hr>
      <small class="text-muted d-block">

      </small>

    </div></div>
  </div></div></div>`;
}

function handleLogin(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const username = fd.get('username').trim();
  const password = fd.get('password');
  const db = getDB();
  const u = db.users.find(x => x.username === username && x.password === password);
  if (!u) {
    document.getElementById('loginError').textContent = 'Kullanıcı adı veya şifre hatalı.';
    return;
  }
  setSession(u);
  sessionStorage.setItem('activeSiteId', u.site_id || 1);
  currentPage = u.role === 'tenant' ? 'tenant-dashboard' : 'dashboard';
  render();
}

function logout() {
  setSession(null);
  sessionStorage.clear();
  render();
}

/* ============================================================
   SAYFA YÖNLENDİRME (ROUTING)
============================================================ */
function renderPage(user) {
  // Yetki kontrolleri
  if (currentPage === 'admin-actions' && user.role !== 'admin') {
    currentPage = 'dashboard';
  }
  if (user.role === 'resident' && ['apartments','residents','dues','expenses','notifications','cash','heat-billing','budget','apartment-history','tenant-dashboard','tenant-payment-history','projects','reports','monthly-summary','admin-actions'].includes(currentPage)) {
    currentPage = 'dashboard';
  }
  if (user.role === 'tenant' && !['tenant-dashboard','tenant-payment-history','change-password','announcements','announcement-detail'].includes(currentPage)) {
    currentPage = 'tenant-dashboard';
  }
  if (user.role === 'inspector' && (currentPage === 'admin-actions' || currentPage === 'settings')) {
    currentPage = 'dashboard';
  }
  
  switch (currentPage) {
    case 'dashboard': return renderDashboard(user);
    case 'apartments': return renderApartments(user);
    case 'residents': return renderResidents(user);
    case 'dues': return renderDues(user);
    case 'expenses': return renderExpenses(user);
    case 'notifications': return renderNotifications(user);
    case 'cash': return renderCash(user);
    case 'my-notifications': return renderMyNotifications(user);
    case 'payment-history': return renderPaymentHistory(user);
    case 'stats': return renderStats(user);
    case 'settings': return renderSettings(user);
    case 'admin-actions': return renderAdminActions(user);
    case 'change-password': return renderChangePassword(user);
    case 'tenant-dashboard': return renderTenantDashboard(user);
    case 'tenant-payment-history': return renderTenantPaymentHistory(user);
    case 'heat-billing': return renderHeatBilling(user);
    case 'apartment-history': return renderApartmentHistory(user);
    case 'budget': return renderBudget(user);
    case 'projects': return renderProjects(user);
    case 'announcements': return renderAnnouncements(user);
    case 'announcement-detail': return renderAnnouncementDetail(user);
    case 'monthly-summary': return renderMonthlySummary(user);
    case 'reports': return renderReports(user);
    default: return renderDashboard(user);
  }
}

/* ============================================================
   KPI TREND GRAFİĞİ (Dashboard için)
============================================================ */
let kpiTrendChartInstance = null;
function drawKpiTrendChart() {
  const el = document.getElementById('kpiTrendChart');
  if (!el || typeof Chart === 'undefined') return;
  if (kpiTrendChartInstance) { kpiTrendChartInstance.destroy(); kpiTrendChartInstance = null; }
  
  const data = last6MonthsKPI();
  const totalIn = data.reduce((s,d) => s + d.income, 0);
  const totalOut = data.reduce((s,d) => s + d.expense, 0);
  const totalNet = totalIn - totalOut;
  const t = getChartTheme();
  
  kpiTrendChartInstance = new Chart(el, {
    type: 'line',
    data: {
      labels: data.map(d => d.label),
      datasets: [
        { label: 'Gelir', data: data.map(d => d.income), borderColor: '#198754', tension: .3, borderWidth: 2, pointRadius: 4 },
        { label: 'Gider', data: data.map(d => d.expense), borderColor: '#dc3545', tension: .3, borderWidth: 2, pointRadius: 4 },
        { label: 'Net', data: data.map(d => d.net), borderColor: t.primary, borderDash: [5,5], tension: .3, borderWidth: 2, pointRadius: 4 }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: 'top', labels: { color: t.text } },
        tooltip: {
          backgroundColor: t.tooltipBg, titleColor: t.tooltipText, bodyColor: t.tooltipText,
          callbacks: { label: ctx => `${ctx.dataset.label}: ${money(ctx.raw)}` }
        }
      },
      scales: {
        x: { grid: { color: t.grid }, ticks: { color: t.text } },
        y: { beginAtZero: true, grid: { color: t.grid }, ticks: { color: t.text } }
      }
    }
  });
  
  const summaryEl = document.getElementById('kpiTrendSummary');
  if (summaryEl) {
    summaryEl.innerHTML = `6 aylık: <b class="text-success">+${money(totalIn)}</b> gelir · <b class="text-danger">−${money(totalOut)}</b> gider · <b class="${totalNet >= 0 ? 'text-success' : 'text-danger'}">${money(totalNet)}</b> net`;
  }
}

/* ============================================================
   TEMA / RENK DEĞİŞİKLİĞİNDE GRAFİKLERİ YENİDEN ÇİZ

function redrawActiveCharts() {
  if (document.getElementById('kpiTrendChart')) {
    if (kpiTrendChartInstance) { kpiTrendChartInstance.destroy(); kpiTrendChartInstance = null; }
    drawKpiTrendChart();
  }
}

/* ============================================================
   RESIDENT DASHBOARD (Sakin Paneli)
============================================================ */
function renderResidentDashboard(user) {
  const {income, expense, balance} = cashSummary();
  const db = getDB();
  const apt = db.apartments.find(a => a.id === user.apartment_id);
  const myDues = apt ? siteFilter(db.dues).filter(d => d.apartment_id === apt.id) : [];
  const paid = myDues.filter(d => d.is_paid).reduce((s,d)=>s+Number(d.amount),0);
  const unpaidAmt = myDues.filter(d => !d.is_paid).reduce((s,d)=>s+Number(d.amount),0);
  const pending = (db.paymentRequests||[]).filter(p => p.apartment_id === user.apartment_id && p.status === 'pending');
  const heatDues = apt ? siteFilter(db.dues).filter(d => d.apartment_id === apt.id && d.category === 'ısı' && !d.is_paid) : [];
  const heatTotal = heatDues.reduce((s,d) => s + Number(d.amount), 0);
  const projDues = apt ? siteFilter(db.dues).filter(d => d.apartment_id === apt.id && d.category === 'proje' && !d.is_paid) : [];
  const projTotal = projDues.reduce((s,d) => s + Number(d.amount), 0);
  
  const meterNotifs = (db.notifications || []).filter(n => n.apartment_id === user.apartment_id && n.type === 'meter_change' && !n.is_read);
  const anomalyNotifs = (db.notifications || []).filter(n => n.apartment_id === user.apartment_id && n.type === 'heat_anomaly' && !n.is_read);

function deleteApartment(id) {
  if (currentUser()?.role !== 'admin') { alert('Yetkiniz yok.'); return; }
  if (!confirm('Silinsin mi?')) return;
  const db = getDB();
  db.apartments = db.apartments.filter(a => a.id !== id);
  db.dues = db.dues.filter(d => d.apartment_id !== id);
  db.notifications = db.notifications.filter(n => n.apartment_id !== id);
  db.users.forEach(u => { if (u.apartment_id === id) u.apartment_id = null; });
  setDB(db);
  render();
}

}

      </div>

        <input class="form-check-input" type="checkbox" id="editIsRented" name="is_rented" ${apt.is_rented ? 'checked' : ''}

        <label class="form-check-label" for="editIsRented"><b>Kirada</b></label>
      </div>
      <div class="row g-2 mb-3 p-2 bg-light rounded" id="editTenantFields" style="display:${apt.is_rented ? 'block' : 'none'};">
        <div class="col-md-4"><label class="form-label small">Kiracı</label><input name="tenant_name" class="form-control" value="${esc(apt.tenant_name || '')}"></div>
        <div class="col-md-4"><label class="form-label small">Tel</label><input name="tenant_phone" class="form-control" value="${esc(apt.tenant_phone || '')}"></div>

      </div>
    </form>
  </div>`;
  document.body.appendChild(modal);
  document.getElementById('editAptForm').addEventListener('submit', e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const db2 = getDB();
    const target = db2.apartments.find(a => a.id === aptId);
    if (!target) return;
    const oldData = { is_rented: target.is_rented, tenant_name: target.tenant_name || '', tenant_phone: target.tenant_phone || '', tenant_email: target.tenant_email || '' };
    target.block = fd.get('block');
    target.number = fd.get('number');
    target.floor = parseInt(fd.get('floor')) || 0;
    target.area = parseFloat(fd.get('area')) || 0;
    const oldMeter = target.meter_no || '';

    setDB(db2);
    modal.remove();
    alert('Güncellendi.');
    render();
  });

function logTenantChange(apartmentId, oldData, newData) {
  const db = getDB();
  const newId = db.nextId.tenantHistory = (db.nextId.tenantHistory || 1);
  db.nextId.tenantHistory = newId + 1;
  db.tenantHistory.push({
    id: newId, site_id: currentSiteId(), apartment_id: apartmentId,
    old_is_rented: oldData.is_rented, old_tenant_name: oldData.tenant_name || '', old_tenant_phone: oldData.tenant_phone || '', old_tenant_email: oldData.tenant_email || '',
    new_is_rented: newData.is_rented, new_tenant_name: newData.tenant_name || '', new_tenant_phone: newData.tenant_phone || '', new_tenant_email: newData.tenant_email || '',
    changed_by: currentUser()?.username || '', changed_at: new Date().toISOString()
  });
  setDB(db);
}

function exportApartmentsCSV() {
  const db = getDB();
  const aps = siteFilter(db.apartments).sort((a,b) => (a.block||'').localeCompare(b.block||'') || a.number.localeCompare(b.number));
  const rows = [[`${activeSite()?.name || 'Site'} — Daireler`], [],
    ['Blok','No','Kat','m²','Sayaç','Sahip','Sahip Tel','Sahip E-posta','Kirada','Kiracı','Kiracı Tel','Kiracı E-posta']];
  aps.forEach(a => rows.push([
    a.block || '', a.number, a.floor || '', a.area || '', a.meter_no || '',
    a.owner_name || '', a.owner_phone || '', a.owner_email || '',
    a.is_rented ? 'Evet' : 'Hayır',
    a.is_rented ? (a.tenant_name || '') : '',
    a.is_rented ? (a.tenant_phone || '') : '',
    a.is_rented ? (a.tenant_email || '') : ''
  ]));
  downloadCSV(`daireler-${new Date().toISOString().slice(0,10)}.csv`, rows);
}

function openBulkAreaModal() {
  if (currentUser()?.role !== 'admin') { alert('Yetkiniz yok.'); return; }
  pendingAreaUpdate = null;
  const existing = document.getElementById('bulkAreaModal');
  if (existing) existing.remove();
  const modal = document.createElement('div');
  modal.id = 'bulkAreaModal';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
  modal.onclick = e => { if (e.target === modal) modal.remove(); };
  modal.innerHTML = `<div style="background:var(--modal-bg);border-radius:8px;max-width:800px;width:100%;max-height:90vh;overflow:auto;padding:20px;">
    <h5 class="mb-3">📥 Toplu m² / Sayaç No Yükle</h5>
    <div class="alert alert-light border small">CSV/Excel'de <b>Daire</b>, <b>m²</b>, <b>Sayaç No</b> sütunları olmalı.</div>
    <input type="file" id="bulkAreaFile" accept=".csv,.xlsx,.xls" class="form-control">
    <div id="bulkAreaPreview" class="mt-3"></div>
  </div>`;
  document.body.appendChild(modal);
  document.getElementById('bulkAreaFile').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) { alert('Dosya 5 MB\'dan büyük.'); return; }
    readSpreadsheet(file, rows => {
      if (!rows || rows.length < 2) { alert('Dosya boş.'); return; }
      const headers = rows[0];
      let colApt = -1, colArea = -1, colMeter = -1;
      headers.forEach((h, i) => {
        const u = String(h).toUpperCase().replace(/\s/g,'');
        if (colApt < 0 && (u.includes('DAİRE') || u.includes('DAIRE'))) colApt = i;
        if (colArea < 0 && (u === 'M²' || u === 'M2' || u.includes('METREKARE'))) colArea = i;
        if (colMeter < 0 && (u.includes('SAYAÇ') || u.includes('SAYAC') || u.includes('METER'))) colMeter = i;
      });
      if (colApt < 0) { alert('"Daire" sütunu yok.'); return; }
      const db = getDB();
      const apts = siteFilter(db.apartments);
      const updates = [];
      const errors = [];
      rows.slice(1).forEach((r, idx) => {
        const daireRaw = String(r[colApt] || '').trim();
        if (!daireRaw) return;
        const norm = daireRaw.toUpperCase().replace(/\s/g, '');
        let apt = apts.find(a => aptLabel(a).toUpperCase() === norm);
        if (!apt) apt = apts.find(a => String(a.number) === norm);
        if (!apt) {
          const m = norm.match(/^([A-Z])[-/]?(\d+)$/);
          if (m) apt = apts.find(a => (a.block||'').toUpperCase() === m[1] && String(a.number) === m[2]);
        }
        if (!apt) { errors.push(`Satır ${idx+2}: Daire yok (${daireRaw})`); return; }
        const areaRaw = colArea >= 0 ? String(r[colArea] || '').trim().replace(',', '.') : '';
        const area = areaRaw ? parseFloat(areaRaw) : null;
        if (areaRaw && (!isFinite(area) || area < 0)) { errors.push(`Satır ${idx+2}: m² geçersiz`); return; }
        const meter = colMeter >= 0 ? String(r[colMeter] || '').trim() : '';
        updates.push({ apt, area, meter });
      });
      pendingAreaUpdate = { updates, errors };
      const rows2 = updates.map(u => `<tr><td><b>${aptLabel(u.apt)}</b></td><td class="small">${u.area !== null ? u.area : (u.apt.area || '-')}</td><td class="small">${u.meter || (u.apt.meter_no || '-')}</td></tr>`).join('');
      const errBlock = errors.length ? `<div class="alert alert-warning small">⚠ ${errors.length} hata</div>` : '';
      document.getElementById('bulkAreaPreview').innerHTML = `${errBlock}<div class="alert alert-info">${updates.length} daire güncellenecek</div><table class="table table-sm"><thead><tr><th>Daire</th><th>m²</th><th>Sayaç</th></tr></thead><tbody>${rows2}</tbody></table><button class="btn btn-success w-100 mt-2" onclick="commitBulkArea()" ${!updates.length ? 'disabled' : ''}>✅ ${updates.length} Daireyi Güncelle</button>`;
    });
  });
}

function commitBulkArea() {
  if (currentUser()?.role !== 'admin') { alert('Yetkiniz yok.'); return; }
  const p = pendingAreaUpdate;
  if (!p || !p.updates.length) return;
  const db = getDB();
  let updated = 0;
  p.updates.forEach(u => {
    const apt = db.apartments.find(a => a.id === u.apt.id);
    if (!apt) return;
    if (u.area !== null) apt.area = u.area;
    if (u.meter && u.meter !== apt.meter_no) {
      const oldMeter = apt.meter_no || '';
      apt.meter_no = u.meter;
      const newId = db.nextId.meterHistory = (db.nextId.meterHistory || 1);
      db.nextId.meterHistory = newId + 1;
      db.meterHistory.push({ id: newId, site_id: currentSiteId(), apartment_id: apt.id, old_meter: oldMeter, new_meter: u.meter, source: 'toplu', changed_by: currentUser()?.username || '', changed_at: new Date().toISOString() });
    }
    updated++;
  });
  setDB(db);
  document.getElementById('bulkAreaModal')?.remove();
  pendingAreaUpdate = null;
  alert(`${updated} daire güncellendi.`);
  render();
}

function toggleDue(id) {
  const db = getDB();
  const d = db.dues.find(x => x.id === id);
  if (!d) return;
  if (!d.is_paid) {
    const answer = prompt('Ödeme tarihi (YYYY-AA-GG). Boş = bugün:', new Date().toISOString().slice(0,10));
    if (answer === null) return;
    d.is_paid = true;
    d.paid_at = answer ? new Date(answer).toISOString() : new Date().toISOString();
  } else {
    d.is_paid = false;
    d.paid_at = null;
  }
  setDB(db);
  render();
}

function bulkPayAll() {
  const fMonth = sessionStorage.getItem('duesFilterMonth') || '';
  const fYear = sessionStorage.getItem('duesFilterYear') || '';
  const fStatus = sessionStorage.getItem('duesFilterStatus') || '';
  const fApartment = sessionStorage.getItem('duesFilterApartment') || '';
  const db = getDB();
  let targets = siteFilter(db.dues).filter(d => !d.is_paid);
  if (fMonth) targets = targets.filter(d => d.month === parseInt(fMonth));
  if (fYear) targets = targets.filter(d => d.year === parseInt(fYear));
  if (fApartment) targets = targets.filter(d => d.apartment_id === parseInt(fApartment));
  if (fStatus === 'paid') return;
  if (!targets.length) { alert('Filtreye uyan ödenmemiş kayıt yok.'); return; }
  if (!confirm(`${targets.length} aidat "ödendi" işaretlenecek.`)) return;
  const now = new Date().toISOString();
  targets.forEach(d => { d.is_paid = true; d.paid_at = now; });
  setDB(db);
  render();
}

function bulkUnpayAll() {
  const fMonth = sessionStorage.getItem('duesFilterMonth') || '';
  const fYear = sessionStorage.getItem('duesFilterYear') || '';
  const fStatus = sessionStorage.getItem('duesFilterStatus') || '';
  const fApartment = sessionStorage.getItem('duesFilterApartment') || '';
  const db = getDB();
  let targets = siteFilter(db.dues).filter(d => d.is_paid);
  if (fMonth) targets = targets.filter(d => d.month === parseInt(fMonth));
  if (fYear) targets = targets.filter(d => d.year === parseInt(fYear));
  if (fApartment) targets = targets.filter(d => d.apartment_id === parseInt(fApartment));
  if (fStatus === 'unpaid') return;
  if (!targets.length) { alert('Filtreye uyan ödenmiş kayıt yok.'); return; }
  if (!confirm(`${targets.length} aidat "ödenmedi" işaretlenecek.`)) return;
  targets.forEach(d => { d.is_paid = false; d.paid_at = null; });
  setDB(db);
  render();
}

/* ============================================================
   DEKONT İŞLEMLERİ
============================================================ */
function uploadReceipt(dueId, file) {
  if (!file) return;
  if (file.size > getMaxFileSize()) { alert('Dosya çok büyük.'); return; }
  const reader = new FileReader();
  reader.onload = ev => {
    const db = getDB();
    const d = db.dues.find(x => x.id === dueId);
    if (!d) return;
    d.receipt = { name: file.name, type: file.type, data: ev.target.result, uploaded_at: new Date().toISOString() };
    try { setDB(db); } catch (err) { alert('Depolama doldu.'); return; }
    render();
  };
  reader.readAsDataURL(file);
}

function viewReceipt(dueId) {
  const db = getDB();
  const d = db.dues.find(x => x.id === dueId);
  if (!d || !d.receipt) return;
  if (d.receipt.type === 'application/pdf') {
    const w = window.open();
    w.document.write(`<iframe src="${d.receipt.data}" style="border:0;width:100%;height:100vh"></iframe>`);
    return;
  }
  const m = document.createElement('div');
  m.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
  m.onclick = e => { if (e.target === m) m.remove(); };
  m.innerHTML = `<div style="background:white;padding:12px;border-radius:8px;"><button class="btn btn-sm btn-outline-secondary mb-2" onclick="this.parentElement.parentElement.remove()">Kapat</button><img src="${d.receipt.data}" style="max-width:85vw;max-height:80vh;display:block;"></div>`;
  document.body.appendChild(m);
}

function removeReceipt(dueId) {
  if (!confirm('Dekont silinsin mi?')) return;
  const db = getDB();
  const d = db.dues.find(x => x.id === dueId);
  if (!d) return;
  delete d.receipt;
  setDB(db);
  render();
}

/* ============================================================
   MAKBUZ PDF
============================================================ */
function downloadReceipt(dueId) {
  const db = getDB();
  const d = db.dues.find(x => x.id === dueId);
  if (!d) return;
  
  // Sakin sadece kendi makbuzunu görebilir
  const user = currentUser();
  if (user && user.role === 'resident' && user.apartment_id !== d.apartment_id) {
    alert('Bu makbuzu görüntüleme yetkiniz yok.');
    return;
  }
  
  const apt = db.apartments.find(a => a.id === d.apartment_id);
  const resident = db.users.find(u => u.role === 'resident' && u.apartment_id === d.apartment_id);

function exportDuesCSV() {
  const db = getDB();
  const rows = [
    [`${activeSite()?.name || 'Site'} — Aidatlar`],
    [`Dışa aktarma: ${new Date().toLocaleString('tr-TR')}`],
    [],
    ['Daire','Blok','No','Dönem','Ay','Yıl','Tutar (TL)','Kısmi','Kalan','Durum','Ödeme','Dekont']
  ];
  siteFilter(db.dues).sort((a,b) => a.apartment_id - b.apartment_id || a.year - b.year || a.month - b.month).forEach(d => {
    const apt = db.apartments.find(a => a.id === d.apartment_id);
    const partials = (db.partialPayments || []).filter(pp => pp.due_id === d.id);
    const partialTotal = partials.reduce((s,pp) => s + Number(pp.amount), 0);
    const remaining = Number(d.amount) - partialTotal;
    rows.push([
      apt ? aptLabel(apt) : '-', apt ? (apt.block||'') : '', apt ? apt.number : '',
      `${MONTHS[d.month-1]} ${d.year}`, MONTHS[d.month-1], d.year,
      Number(d.amount).toFixed(2),
      partialTotal > 0 ? partialTotal.toFixed(2) : '',
      partialTotal > 0 && !d.is_paid ? remaining.toFixed(2) : '',
      d.is_paid ? 'Ödendi' : (partialTotal > 0 ? 'Kısmi' : 'Ödenmedi'),
      d.paid_at ? new Date(d.paid_at).toLocaleDateString('tr-TR') : '',
      d.receipt ? 'Var' : 'Yok'
    ]);
  });
  downloadCSV(`aidatlar-${new Date().toISOString().slice(0,10)}.csv`, rows);
}

function deleteExpense(id) {
  if (!confirm('Silinsin mi?')) return;
  const db = getDB();
  db.expenses = db.expenses.filter(e => e.id !== id);
  setDB(db);
  render();
}

function toggleExpensePaid(id) {
  const db = getDB();
  const e = db.expenses.find(x => x.id === id);
  if (!e) return;
  if (e.paid_at) {
    e.paid_at = null;
  } else {
    const answer = prompt('Ödeme tarihi (YYYY-AA-GG). Boş = bugün:', new Date().toISOString().slice(0,10));
    if (answer === null) return;
    e.paid_at = answer ? new Date(answer).toISOString() : new Date().toISOString();
  }
  setDB(db);
  render();
}

function renderCash(user) {
  const db = getDB();
  const ro = user.role === 'inspector';
  const startStr = sessionStorage.getItem('cashStart') || '';
  const endStr = sessionStorage.getItem('cashEnd') || '';
  const startDate = startStr ? new Date(startStr + 'T00:00:00') : null;
  const endDate = endStr ? new Date(endStr + 'T23:59:59') : null;
  const sid = currentSiteId();
  
  const movements = [];
  siteFilter(db.dues).filter(d => d.is_paid).forEach(d => {
    const apt = db.apartments.find(a => a.id === d.apartment_id);
    const catLabel = d.category === 'ısı' ? '🔥 Isı' : d.category === 'proje' ? '📋 Proje' : 'Aidat';
    movements.push({
      source: 'aidat', date: d.paid_at || d.created_at,
      label: `${catLabel} — ${apt ? aptLabel(apt) : '-'} (${MONTHS[d.month-1]} ${d.year})`,
      type: 'gelir', amount: Number(d.amount)
    });
  });
  siteFilter(db.expenses).forEach(e => movements.push({
    source: 'gider', date: e.paid_at || e.created_at,
    label: `Gider — ${e.category}${e.description ? ' / '+e.description : ''}`,
    type: 'gider', amount: Number(e.amount)
  }));
  siteFilter(db.cashMovements).forEach(m => movements.push({
    source: 'manuel', id: m.id, date: m.date,
    label: `${m.type === 'gelir' ? 'Gelir' : 'Gider'} — ${m.description}`,
    type: m.type, amount: Number(m.amount)
  }));
  siteFilter(db.extraIncomes).forEach(x => movements.push({
    source: 'ekstra', id: x.id, date: x.date || new Date(x.year, x.month - 1, 1).toISOString(),
    label: `Ekstra — ${x.category}${x.tenant_name ? ' ('+x.tenant_name+')' : ''} (${MONTHS[x.month-1]} ${x.year})`,
    type: 'gelir', amount: Number(x.amount)
  }));
  (db.partialPayments || []).filter(pp => pp.site_id === sid).forEach(pp => {
    const due = db.dues.find(d => d.id === pp.due_id);
    const apt = due ? db.apartments.find(a => a.id === due.apartment_id) : null;
    const project = due ? (db.projects || []).find(p => p.id === due.project_id) : null;
    movements.push({
      source: 'kısmi', date: pp.paid_at,
      label: `💸 Kısmi — ${project ? project.name : 'Proje'} · ${apt ? aptLabel(apt) : '-'}${pp.note ? ' (' + pp.note + ')' : ''}`,
      type: 'gelir', amount: Number(pp.amount)
    });
  });
  movements.sort((a,b) => new Date(b.date) - new Date(a.date));
  
  const inRange = (iso) => {
    const t = new Date(iso).getTime();
    if (startDate && t < startDate.getTime()) return false;
    if (endDate && t > endDate.getTime()) return false;
    return true;
  };
  const preRange = startDate ? movements.filter(m => new Date(m.date).getTime() < startDate.getTime()) : [];
  const filteredMovements = movements.filter(m => inRange(m.date));
  const openingBalance = preRange.reduce((s,m) => s + (m.type === 'gelir' ? m.amount : -m.amount), 0);
  const totalIn = filteredMovements.filter(m => m.type === 'gelir').reduce((s,m) => s + m.amount, 0);
  const totalOut = filteredMovements.filter(m => m.type === 'gider').reduce((s,m) => s + m.amount, 0);
  
  const rows = filteredMovements.map(m => `<tr>
    <td>${new Date(m.date).toLocaleDateString('tr-TR')}</td>
    <td>${esc(m.label)}</td>
    <td><span class="badge bg-${m.source === 'aidat' ? 'success' : m.source === 'gider' ? 'danger' : m.source === 'ekstra' ? 'info' : m.source === 'kısmi' ? 'warning' : 'secondary'}">${m.source}</span></td>
    <td class="${m.type === 'gelir' ? 'text-success' : 'text-danger'}">${m.type === 'gelir' ? '+' : '-'}${money(m.amount)}</td>
    ${!ro ? `<td class="text-end">
      ${(m.source === 'manuel' || m.source === 'ekstra')
        ? `<button class="btn btn-sm btn-outline-danger" onclick="${m.source === 'ekstra' ? 'deleteExtraIncome' : 'deleteMovement'}(${m.id})">🗑️</button>`
        : '<span class="text-muted small">-</span>'}
    </td>` : ''}
  </tr>`).join('');
  
  const soon = expiringContracts(60);
  
  return `<div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
    <h3 class="mb-0">Kasa ${ro ? '<span class="badge bg-info">İzleyici</span>' : ''} <small class="text-muted">— ${esc(activeSite()?.name || '')}</small></h3>
    <div class="d-flex gap-2 flex-wrap">
      <button class="btn btn-outline-info btn-sm" onclick="openExtraIncomeCalendar()">📅 Ekstra Gelir Takvimi</button>
      ${!ro ? `<div class="dropdown">
        <button class="btn btn-outline-primary btn-sm dropdown-toggle" data-bs-toggle="dropdown">⚙️ İşlemler</button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><h6 class="dropdown-header">Yeni</h6></li>
          <li><button class="dropdown-item" onclick="openAddExtraIncomeModal()">💵 Ekstra Gelir</button></li>
          <li><button class="dropdown-item" onclick="openAddMovementModal('gelir')">➕ Manuel Gelir</button></li>
          <li><button class="dropdown-item" onclick="openAddMovementModal('gider')">➖ Manuel Gider</button></li>
          <li><hr class="dropdown-divider"></li>
          <li><h6 class="dropdown-header">Rapor</h6></li>
          <li><button class="dropdown-item" onclick="exportCashReport()">📥 CSV</button></li>
          <li><button class="dropdown-item" onclick="exportPartialPaymentsCSV()">💸 Kısmi Ödemeler CSV</button></li>
          <li><button class="dropdown-item" onclick="downloadCashPDF()">🖨️ Kasa PDF</button></li>
        </ul>
      </div>` : `<button class="btn btn-sm btn-outline-dark" onclick="exportCashReport()">📥 CSV</button>`}
    </div>
  </div>
  
  ${soon.length ? `<div class="alert alert-info py-2 small">⏰ <b>${soon.length}</b> kira sözleşmesi 60 gün içinde sona eriyor. <button class="btn btn-sm btn-outline-dark ms-2 py-0" onclick="sendRentReminders()">📨 Hatırlatma</button></div>` : ''}
  
  <div class="card mb-3"><div class="card-body py-2">
    <div class="row g-2 align-items-center">
      <div class="col-auto"><span class="small text-muted">📅 Dönem:</span></div>
      <div class="col-md-2"><input type="date" class="form-control form-control-sm" value="${startStr}" onchange="sessionStorage.setItem('cashStart',this.value);render()"></div>
      <div class="col-auto"><span class="small">→</span></div>
      <div class="col-md-2"><input type="date" class="form-control form-control-sm" value="${endStr}" onchange="sessionStorage.setItem('cashEnd',this.value);render()"></div>
      <div class="col-auto"><button class="btn btn-sm btn-outline-secondary" onclick="sessionStorage.removeItem('cashStart');sessionStorage.removeItem('cashEnd');render()">Sıfırla</button></div>
    </div>
    <div class="row g-2 mt-2">
      <div class="col-md-3"><div class="card text-bg-secondary mb-0"><div class="card-body py-2">
        <div class="small">Açılış</div><div class="fs-5">${money(openingBalance)}</div></div></div></div>
      <div class="col-md-3"><div class="card text-bg-success mb-0"><div class="card-body py-2">
        <div class="small">Gelir</div><div class="fs-5">+${money(totalIn)}</div></div></div></div>
      <div class="col-md-3"><div class="card text-bg-danger mb-0"><div class="card-body py-2">
        <div class="small">Gider</div><div class="fs-5">−${money(totalOut)}</div></div></div></div>
      <div class="col-md-3"><div class="card text-bg-primary mb-0"><div class="card-body py-2">
        <div class="small">Kapanış</div><div class="fs-5">${money(openingBalance + totalIn - totalOut)}</div></div></div></div>
    </div>
  </div></div>
  
  <h6 class="mt-3">📋 Hareketler (${filteredMovements.length})</h6>
  <div class="table-responsive-wrap">
    <table class="table table-striped table-hover bg-white align-middle">
      <thead><tr><th>Tarih</th><th>Açıklama</th><th>Kaynak</th><th>Tutar</th>${!ro?'<th></th>':''}</tr></thead>
      <tbody>${rows || `<tr><td colspan="${ro?4:5}" class="text-muted text-center py-4">Hareket yok</td></tr>`}</tbody>
    </table>
  </div>`;
}

function exportCashReport() {

  const endStr = sessionStorage.getItem('cashEnd') || '';
  const startDate = startStr ? new Date(startStr + 'T00:00:00') : null;
  const endDate = endStr ? new Date(endStr + 'T23:59:59') : null;
  const all = [];
  
  siteFilter(db.dues).filter(d => d.is_paid).forEach(d => {
    const apt = db.apartments.find(a => a.id === d.apartment_id);
    all.push({ date: d.paid_at || d.created_at, source: 'aidat', label: `Aidat — ${apt ? aptLabel(apt) : '-'}`, type: 'gelir', amount: Number(d.amount) });
  });
  siteFilter(db.expenses).forEach(e => all.push({ date: e.paid_at || e.created_at, source: 'gider', label: `Gider — ${e.category}`, type: 'gider', amount: Number(e.amount) }));
  siteFilter(db.cashMovements).forEach(m => all.push({ date: m.date, source: 'manuel', label: m.description, type: m.type, amount: Number(m.amount) }));
  siteFilter(db.extraIncomes).forEach(x => all.push({ date: x.date || new Date(x.year, x.month-1, 1).toISOString(), source: 'ekstra', label: `${x.category}${x.tenant_name?' ('+x.tenant_name+')':''}`, type: 'gelir', amount: Number(x.amount) }));
  (db.partialPayments || []).filter(pp => pp.site_id === sid).forEach(pp => {
    const due = db.dues.find(d => d.id === pp.due_id);
    const apt = due ? db.apartments.find(a => a.id === due.apartment_id) : null;
    all.push({ date: pp.paid_at, source: 'kısmi', label: `Kısmi — ${apt ? aptLabel(apt) : '-'}`, type: 'gelir', amount: Number(pp.amount) });
  });
  
  const inRange = iso => {
    const t = new Date(iso).getTime();
    if (startDate && t < startDate.getTime()) return false;
    if (endDate && t > endDate.getTime()) return false;
    return true;
  };
  const filtered = all.filter(m => inRange(m.date)).sort((a,b) => new Date(a.date) - new Date(b.date));
  const opening = all.filter(m => startDate && new Date(m.date).getTime() < startDate.getTime()).reduce((s,m) => s + (m.type === 'gelir' ? m.amount : -m.amount), 0);
  const rows = [
    [`${activeSite()?.name || 'Site'} — Kasa`],
    [`Dönem: ${startStr || 'ilk'} → ${endStr || 'bugün'}`],
    [`Açılış: ${opening.toFixed(2)} TL`],
    [],
    ['Tarih','Kaynak','Açıklama','Tür','Tutar (TL)'],
    ...filtered.map(m => [new Date(m.date).toLocaleDateString('tr-TR'), m.source, m.label, m.type, (m.type === 'gelir' ? '+' : '-') + m.amount.toFixed(2)]),
    [],
    ['Gelir', filtered.filter(m => m.type === 'gelir').reduce((s,m) => s + m.amount, 0).toFixed(2)],
    ['Gider', filtered.filter(m => m.type === 'gider').reduce((s,m) => s + m.amount, 0).toFixed(2)]
  ];
  downloadCSV(`kasa-${startStr||'ilk'}_${endStr||'bugun'}.csv`, rows);
}

function downloadCashPDF() {
  const db = getDB();
  const site = activeSite() || { name: 'Site' };
  const startStr = sessionStorage.getItem('cashStart') || '';
  const endStr = sessionStorage.getItem('cashEnd') || '';
  const sid = currentSiteId();
  const startDate = startStr ? new Date(startStr + 'T00:00:00') : null;
  const endDate = endStr ? new Date(endStr + 'T23:59:59') : null;
  const all = [];
  
  siteFilter(db.dues).filter(d => d.is_paid).forEach(d => {
    const apt = db.apartments.find(a => a.id === d.apartment_id);
    all.push({ date: d.paid_at || d.created_at, source: 'Aidat', label: `${apt ? aptLabel(apt) : '-'} (${MONTHS[d.month-1]} ${d.year})`, type: 'gelir', amount: Number(d.amount) });
  });
  siteFilter(db.expenses).forEach(e => all.push({ date: e.paid_at || e.created_at, source: 'Gider', label: e.category, type: 'gider', amount: Number(e.amount) }));
  siteFilter(db.cashMovements).forEach(m => all.push({ date: m.date, source: m.type === 'gelir' ? 'Manuel G.' : 'Manuel Gid.', label: m.description, type: m.type, amount: Number(m.amount) }));
  siteFilter(db.extraIncomes).forEach(x => all.push({ date: x.date || new Date(x.year, x.month-1, 1).toISOString(), source: 'Ekstra', label: x.category, type: 'gelir', amount: Number(x.amount) }));
  (db.partialPayments || []).filter(pp => pp.site_id === sid).forEach(pp => {
    all.push({ date: pp.paid_at, source: 'Kısmi', label: 'Kısmi ödeme', type: 'gelir', amount: Number(pp.amount) });
  });
  
  const inRange = iso => {
    const t = new Date(iso).getTime();
    if (startDate && t < startDate.getTime()) return false;
    if (endDate && t > endDate.getTime()) return false;
    return true;
  };
  const filtered = all.filter(m => inRange(m.date)).sort((a,b) => new Date(a.date) - new Date(b.date));
  const opening = all.filter(m => startDate && new Date(m.date).getTime() < startDate.getTime()).reduce((s,m) => s + (m.type === 'gelir' ? m.amount : -m.amount), 0);
  const totalIn = filtered.filter(m => m.type === 'gelir').reduce((s,m) => s + m.amount, 0);
  const totalOut = filtered.filter(m => m.type === 'gider').reduce((s,m) => s + m.amount, 0);
  
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const pageW = 210, margin = 15;
  let y = 20;
  doc.setFont('helvetica', 'bold'); doc.setFontSize(15);
  doc.text(site.name || 'Site', pageW/2, y, { align: 'center' });
  y += 6;
  doc.setFontSize(12);
  doc.text('KASA RAPORU', pageW/2, y, { align: 'center' });
  y += 6;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
  doc.text(`Dönem: ${startStr || 'ilk'} → ${endStr || 'bugün'}`, pageW/2, y, { align: 'center' });
  y += 10;
  doc.setFont('helvetica', 'bold');
  doc.text(`Açılış: ${money(opening)}   Gelir: ${money(totalIn)}   Gider: ${money(totalOut)}   Kapanış: ${money(opening+totalIn-totalOut)}`, pageW/2, y, { align: 'center' });
  y += 10;
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(8);
  filtered.forEach(m => {
    if (y > 275) { doc.addPage(); y = 20; }
    doc.text(new Date(m.date).toLocaleDateString('tr-TR'), margin, y);
    doc.text((m.label || '').substring(0, 60), margin + 25, y);
    if (m.type === 'gelir') doc.setTextColor(25,135,84);
    else doc.setTextColor(220,53,69);
    doc.text((m.type === 'gelir' ? '+' : '-') + money(m.amount), pageW - margin, y, { align: 'right' });
    doc.setTextColor(0);
    y += 4.5;
  });
  doc.save(`kasa-${startStr||'ilk'}_${endStr||'bugun'}.pdf`);
}

function renderExtraIncomeCalendar() {
  const state = window._extraIncomeCalendar;
  if (!state) return;
  const incomes = state.incomes;
  const year = parseInt(document.getElementById('extraCalYear').value);
  const view = document.getElementById('extraCalView').value;
  const body = document.getElementById('extraCalBody');
  if (!body) return;
  const yearIncomes = incomes.filter(x => x.year === year);
  
  if (view === 'list') {
    const sorted = [...yearIncomes].sort((a, b) => b.month - a.month);
    body.innerHTML = `<table class="table table-sm table-striped">
      <thead><tr><th>Dönem</th><th>Kategori</th><th>Açıklama</th><th>Kiracı</th><th class="text-end">Tutar</th></tr></thead>
      <tbody>${sorted.length ? sorted.map(x => `<tr>
        <td><b>${MONTHS[x.month-1]} ${x.year}</b></td>
        <td>${esc(x.category)}</td>
        <td>${esc(x.description || '-')}</td>
        <td>${esc(x.tenant_name || '-')}</td>
        <td class="text-end text-success fw-bold">+${money(x.amount)}</td>
      </tr>`).join('') : '<tr><td colspan="5" class="text-muted text-center py-4">Kayıt yok</td></tr>'}</tbody>
      ${sorted.length ? `<tfoot><tr class="table-secondary"><th colspan="4" class="text-end">TOPLAM</th><th class="text-end text-success">+${money(sorted.reduce((s,x) => s + Number(x.amount), 0))}</th></tr></tfoot>` : ''}
    </table>`;
    return;
  }
  
  const categories = [...new Set(yearIncomes.map(x => x.category))].sort();
  if (!categories.length) { body.innerHTML = '<div class="alert alert-info text-center">Bu yıl için kayıt yok.</div>'; return; }
  const matrix = {};
  categories.forEach(cat => matrix[cat] = Array(12).fill(0));
  yearIncomes.forEach(x => {
    if (!matrix[x.category]) matrix[x.category] = Array(12).fill(0);
    matrix[x.category][x.month - 1] += Number(x.amount);
  });
  const colTotals = Array(12).fill(0);
  categories.forEach(cat => { matrix[cat].forEach((v, i) => colTotals[i] += v); });
  const grandTotal = colTotals.reduce((s,v) => s + v, 0);
  body.innerHTML = `<div class="table-responsive-wrap">
    <table class="table table-sm table-bordered text-center align-middle">
      <thead class="table-light">
        <tr><th class="text-start" style="min-width:150px;">Kategori</th>${MONTHS.map(m => `<th style="min-width:60px;">${m.substring(0,3)}</th>`).join('')}<th class="text-end">Toplam</th></tr>
      </thead>
      <tbody>
        ${categories.map(cat => {
          const rowTotal = matrix[cat].reduce((s,v) => s + v, 0);
          return `<tr>
            <td class="text-start fw-bold">${esc(cat)}</td>
            ${matrix[cat].map(v => `<td class="${v > 0 ? 'text-success' : 'text-muted'}">${v > 0 ? v.toFixed(0) : '-'}</td>`).join('')}
            <td class="text-end fw-bold text-success">${money(rowTotal)}</td>
          </tr>`;
        }).join('')}
        <tr class="table-secondary">
          <td class="text-start fw-bold">AYLIK TOPLAM</td>
          ${colTotals.map(v => `<td class="fw-bold">${v > 0 ? v.toFixed(0) : '-'}</td>`).join('')}
          <td class="text-end fw-bold text-success">${money(grandTotal)}</td>
        </tr>
      </tbody>
    </table>
  </div>`;
}

function markAllNotificationsRead() {
  const db = getDB();
  const sid = currentSiteId();
  let count = 0;
  (db.notifications || []).forEach(n => {
    if (n.site_id === sid && !n.is_read) { n.is_read = true; count++; }
  });
  if (!count) { alert('Okunmamış yok.'); return; }
  setDB(db);
  alert(`${count} bildirim işaretlendi.`);
  render();
}

function deleteReadNotifications() {
  if (!confirm('Okunmuş bildirimler silinecek?')) return;
  const db = getDB();
  const sid = currentSiteId();
  const before = (db.notifications || []).length;
  db.notifications = (db.notifications || []).filter(n => !(n.site_id === sid && n.is_read));
  const after = db.notifications.length;
  setDB(db);
  alert(`${before - after} silindi.`);
  render();
}

function openNotificationPrefs() {
  const db = getDB();
  const user = currentUser();
  if (!user) return;
  const prefs = getNotificationPrefs(user.id);
  const disabled = prefs.disabled || [];
  
  const groups = [
    { title: '📢 Duyurular ve Yorumlar', desc: 'Duyurular, yorumlar, etiketler', keys: ['announcement', 'comment_reply', 'mention'] },
    { title: '💰 Aidat ve Isı', desc: 'Isı, anormal tüketim, sahip', keys: ['heat_bill', 'heat_anomaly', 'owner_reminder'] },
    { title: '🏠 Kira ve Sayaç', desc: 'Kira, sayaç', keys: ['rent_reminder', 'meter_change'] },
    { title: '📋 Projeler', desc: 'Yeni proje', keys: ['project_announce'] }
  ];
  
  const existing = document.getElementById('notifPrefsModal');
  if (existing) existing.remove();
  const modal = document.createElement('div');
  modal.id = 'notifPrefsModal';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
  modal.onclick = e => { if (e.target === modal) modal.remove(); };
  
  const groupHtml = groups.map((g, gi) => {
    const allOn = g.keys.every(k => !disabled.includes(k));
    const anyOn = g.keys.some(k => !disabled.includes(k));
    const groupChecked = allOn ? 'checked' : '';
    const rows = g.keys.map(k => {
      const t = NOTIFICATION_TYPES.find(x => x.key === k);
      if (!t) return '';
      const isOn = !disabled.includes(k);
      return `<div class="form-check form-switch py-1 ps-4">
        <input class="form-check-input notif-pref-toggle" type="checkbox" data-key="${k}" id="pref_${k}" ${isOn ? 'checked' : ''}>
        <label class="form-check-label small" for="pref_${k}">${t.icon} <b>${t.label}</b> <span class="text-muted">— ${t.desc}</span></label>
      </div>`;
    }).join('');
    return `<div class="mb-2 border rounded p-2">
      <div class="d-flex align-items-center justify-content-between mb-1">
        <div><h6 class="mb-0">${g.title}</h6><small class="text-muted">${g.desc}</small></div>
        <div class="form-check form-switch"><input class="form-check-input group-toggle" type="checkbox" data-group="${gi}" ${groupChecked}></div>
      </div>
      <div>${rows}</div>
    </div>`;
  }).join('');
  
  modal.innerHTML = `<div style="background:var(--modal-bg);border-radius:8px;max-width:600px;width:100%;max-height:90vh;overflow:auto;padding:20px;">
    <div class="d-flex justify-content-between mb-3">
      <h5 class="mb-0">🔔 Bildirim Tercihleri</h5>
      <button class="btn btn-sm btn-outline-secondary" onclick="document.getElementById('notifPrefsModal').remove()">Kapat</button>
    </div>
    <div class="d-flex gap-2 mb-3">
      <button class="btn btn-sm btn-outline-success" onclick="toggleAllNotifPrefs(true)">✅ Tümünü Aç</button>
      <button class="btn btn-sm btn-outline-danger" onclick="toggleAllNotifPrefs(false)">🔕 Tümünü Kapat</button>
    </div>
    <div>${groupHtml}</div>
    <div class="d-flex gap-2 mt-3">
      <button class="btn btn-success flex-grow-1" onclick="saveNotificationPrefs()">💾 Kaydet</button>
      <button class="btn btn-outline-secondary" onclick="document.getElementById('notifPrefsModal').remove()">Vazgeç</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
  
  modal.querySelectorAll('.group-toggle').forEach(gt => {
    gt.addEventListener('change', () => {
      const gi = parseInt(gt.dataset.group);
      groups[gi].keys.forEach(k => {
        const cb = document.getElementById('pref_' + k);
        if (cb) cb.checked = gt.checked;
      });
    });
  });
  
  groups.forEach((g, gi) => {
    const allOn = g.keys.every(k => !disabled.includes(k));
    const anyOn = g.keys.some(k => !disabled.includes(k));
    if (!allOn && anyOn) {
      const gcb = modal.querySelector(`.group-toggle[data-group="${gi}"]`);
      if (gcb) gcb.indeterminate = true;
    }
  });
}

function toggleAllNotifPrefs(on) {
  document.querySelectorAll('.notif-pref-toggle').forEach(cb => cb.checked = on);
  document.querySelectorAll('.group-toggle').forEach(cb => { cb.checked = on; cb.indeterminate = false; });
}

function saveNotificationPrefs() {
  const user = currentUser();
  if (!user) return;
  const toggles = document.querySelectorAll('.notif-pref-toggle');
  const disabled = [];
  toggles.forEach(t => { if (!t.checked) disabled.push(t.dataset.key); });
  const db = getDB();
  let prefs = (db.notificationPrefs || []).find(p => p.user_id === user.id);
  if (!prefs) {
    const newId = db.nextId.notificationPref = (db.nextId.notificationPref || 1);
    db.nextId.notificationPref = newId + 1;
    prefs = { id: newId, user_id: user.id, disabled: [] };
    db.notificationPrefs.push(prefs);
  }
  prefs.disabled = disabled;
  prefs.updated_at = new Date().toISOString();
  setDB(db);
  document.getElementById('notifPrefsModal')?.remove();
  alert('Kaydedildi.');
  render();
}

function approvePayment(reqId) {
  const db = getDB();
  const req = db.paymentRequests.find(p => p.id === reqId);
  if (!req || req.status !== 'pending') return;
  
  if (req.kind === 'partial') {
    if (!confirm(`${money(req.amount)} kısmi ödeme onaylanacak.`)) return;
    const newId = db.nextId.partialPayment = (db.nextId.partialPayment || 1);
    db.nextId.partialPayment = newId + 1;
    db.partialPayments.push({
      id: newId, site_id: req.site_id, due_id: req.due_id, apartment_id: req.apartment_id,
      amount: Number(req.amount), paid_at: new Date().toISOString(), note: req.note || '',
      recorded_by: currentUser()?.username || '', from_request_id: req.id,
      created_at: new Date().toISOString()
    });
    const due = db.dues.find(d => d.id === req.due_id);
    if (due) {
      const allParts = db.partialPayments.filter(pp => pp.due_id === due.id);
      const totalParts = allParts.reduce((s,pp) => s + Number(pp.amount), 0);
      if (totalParts >= Number(due.amount) - 0.01) {
        due.is_paid = true;
        due.paid_at = new Date().toISOString();
        if (req.receipt) due.receipt = req.receipt;
      }
    }
    req.status = 'approved';
    req.resolved_at = new Date().toISOString();
    setDB(db);
    render();
    return;
  }
  
  if (!confirm('Ödeme onaylanacak.')) return;
  const due = db.dues.find(d => d.id === req.due_id);
  if (due) {
    due.is_paid = true;
    due.paid_at = new Date().toISOString();
    if (req.receipt) due.receipt = req.receipt;
  }
  req.status = 'approved';
  req.resolved_at = new Date().toISOString();
  setDB(db);
  render();
}

function rejectPayment(reqId) {
  const reason = prompt('Red nedeni:', '');
  if (reason === null) return;
  const db = getDB();
  const req = db.paymentRequests.find(p => p.id === reqId);
  if (!req) return;
  req.status = 'rejected';
  req.reject_reason = reason;
  req.resolved_at = new Date().toISOString();
  setDB(db);
  render();
}

function calculateInterestPreview() {
  const db = getDB();
  const rate = Number(db.settings.dailyInterestRate) || 0;
  if (rate <= 0) { alert('Faiz oranı girin.'); return; }
  const items = [];
  siteFilter(db.dues).forEach(d => {
    const r = calcDueInterest(d, rate);
    if (r) {
      const apt = db.apartments.find(a => a.id === d.apartment_id);
      items.push({ id: d.id, label: `${apt ? aptLabel(apt) : '-'} — ${MONTHS[d.month-1]} ${d.year}`, amount: Number(d.amount), days: r.days, interest: r.interest, dueDate: r.dueDate });
    }
  });
  if (!items.length) { alert('Gecikmiş yok.'); return; }
  const existing = document.getElementById('interestModal');
  if (existing) existing.remove();
  const modal = document.createElement('div');
  modal.id = 'interestModal';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
  const totalInt = items.reduce((s,i) => s+i.interest, 0);
  modal.innerHTML = `<div style="background:var(--modal-bg);border-radius:8px;max-width:90vw;max-height:90vh;overflow:auto;padding:16px;min-width:600px;">
    <h5 class="mb-2">Gecikme Faizi</h5>
    <p class="small text-muted">Günlük: ${(rate*100).toFixed(3)}%</p>
    <table class="table table-sm table-striped">
      <thead><tr><th>Daire</th><th class="text-end">Anapara</th><th class="text-end">Gün</th><th class="text-end">Faiz</th><th class="text-end">Toplam</th></tr></thead>
      <tbody>${items.map(i => `<tr>
        <td>${esc(i.label)}</td>
        <td class="text-end">${money(i.amount)}</td>
        <td class="text-end">${i.days}</td>
        <td class="text-end text-warning">${money(i.interest)}</td>
        <td class="text-end"><b>${money(i.amount + i.interest)}</b></td>
      </tr>`).join('')}</tbody>
      <tfoot><tr><th colspan="3" class="text-end">TOPLAM</th><th class="text-end text-warning">${money(totalInt)}</th><th></th></tr></tfoot>
    </table>
    <div class="d-flex gap-2 mt-2">
      <button class="btn btn-success" onclick="applyInterest()">✅ Uygula</button>
      <button class="btn btn-outline-secondary" onclick="document.getElementById('interestModal').remove()">Vazgeç</button>
    </div>
  </div>`;
  modal.onclick = e => { if (e.target === modal) modal.remove(); };
  document.body.appendChild(modal);
}

function applyInterest() {
  if (!confirm('Faizler eklenecek.')) return;
  const db = getDB();
  const rate = Number(db.settings.dailyInterestRate) || 0;
  let count = 0;
  siteFilter(db.dues).forEach(d => {
    const r = calcDueInterest(d, rate);
    if (r) {
      d.interest = (Number(d.interest) || 0) + r.interest;
      d.amount = Number(d.amount) + r.interest;
      count++;
    }
  });
  setDB(db);
  document.getElementById('interestModal')?.remove();
  alert(`${count} aidata uygulandı.`);
  render();
}

/* ============================================================
   İSTATİSTİK
============================================================ */
function renderStats() {
  const db = getDB();
  const allYears = new Set();
  siteFilter(db.dues).forEach(d => allYears.add(d.year));
  siteFilter(db.expenses).forEach(e => allYears.add(e.year));
  siteFilter(db.extraIncomes || []).forEach(x => allYears.add(x.year));
  if (!allYears.size) allYears.add(new Date().getFullYear());
  const stored = parseInt(sessionStorage.getItem('statsYear'));
  const year = allYears.has(stored) ? stored : [...allYears].sort((a,b)=>b-a)[0];
  
  const incMap = {}, expMap = {};
  MONTHS.forEach((_,i) => { incMap[i+1]=0; expMap[i+1]=0; });
  siteFilter(db.dues).filter(d => d.year===year && d.is_paid).forEach(d => incMap[d.month] += Number(d.amount));
  siteFilter(db.partialPayments || []).forEach(pp => {
    const dt = new Date(pp.paid_at);
    if (dt.getFullYear() === year) incMap[dt.getMonth() + 1] += Number(pp.amount);
  });

function drawAptCompareChart() {
  const selected = Array.from(document.querySelectorAll('.apt-compare-cb:checked')).map(cb => parseInt(cb.value));
  if (!selected.length) { alert('En az 1 seç.'); return; }
  if (selected.length > 4) { alert('En fazla 4.'); return; }
  const type = document.getElementById('cmpAptType')?.value || 'dues';
  const year = parseInt(sessionStorage.getItem('statsYear')) || new Date().getFullYear();
  const db = getDB();
  const el = document.getElementById('aptCompareChart');
  if (!el || typeof Chart === 'undefined') return;
  if (aptCompareChartInstance) { aptCompareChartInstance.destroy(); aptCompareChartInstance = null; }
  const colors = [getChartTheme().primary, '#dc3545', '#198754', '#ffc107'];
  const datasets = selected.map((aptId, idx) => {
    const apt = db.apartments.find(a => a.id === aptId);
    if (!apt) return null;
    let data;
    if (type === 'dues') {
      data = MONTHS.map((_, i) => {
        const m = i + 1;
        return siteFilter(db.dues).filter(d => d.apartment_id === aptId && d.month === m && d.year === year && d.category !== 'ısı').reduce((s,d) => s + Number(d.amount), 0);
      });
    } else {
      data = MONTHS.map((_, i) => {
        const m = i + 1;
        const bill = siteFilter(db.heatBills).find(b => b.month === m && b.year === year);
        if (!bill) return 0;
        const item = bill.distribution.find(d => d.apartment_id === aptId);
        return item ? Number(item.amount) : 0;
      });
    }
    return { label: aptLabel(apt), data, borderColor: colors[idx % colors.length], tension: .3, borderWidth: 2, pointRadius: 4 };
  }).filter(Boolean);
  const t = getChartTheme();
  aptCompareChartInstance = new Chart(el, {
    type: 'line',
    data: { labels: MONTHS, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'top', labels: { color: t.text } }, tooltip: { backgroundColor: t.tooltipBg, titleColor: t.tooltipText, bodyColor: t.tooltipText, callbacks: { label: ctx => `${ctx.dataset.label}: ${money(ctx.raw)}` } } },
      scales: { x: { grid: { color: t.grid }, ticks: { color: t.text } }, y: { beginAtZero: true, grid: { color: t.grid }, ticks: { color: t.text } } }
    }
  });
}

function drawSiteHeatCompareChart() {
  const year = parseInt(document.getElementById('siteHeatCmpYear')?.value);
  const type = document.getElementById('siteHeatCmpType')?.value || 'pay';
  if (!year) return;
  const db = getDB();
  const el = document.getElementById('siteHeatCompareChart');
  if (!el || typeof Chart === 'undefined') return;
  if (siteHeatCmpChartInstance) { siteHeatCmpChartInstance.destroy(); siteHeatCmpChartInstance = null; }
  const datasets = [];
  const palette = [getChartTheme().primary, '#dc3545', '#198754', '#ffc107'];
  const siteStats = [];
  db.sites.forEach((site, idx) => {
    const bills = (db.heatBills || []).filter(b => b.site_id === site.id && b.year === year);
    if (!bills.length) return;
    const monthly = MONTHS.map((_, i) => {
      const bill = bills.find(b => b.month === i + 1);
      if (!bill) return 0;
      if (type === 'pay') return bill.distribution.reduce((s,d) => s + Number(d.pay), 0);
      return Number(bill.totalBill);
    });
    const total = monthly.reduce((s,v) => s + v, 0);
    if (total === 0) return;
    siteStats.push({ name: site.name, total, count: bills.length });
    datasets.push({ label: site.name, data: monthly, borderColor: palette[idx % palette.length], tension: .3, fill: false, borderWidth: 2, pointRadius: 3 });
  });
  if (!datasets.length) { el.parentElement.innerHTML = '<div class="text-muted text-center py-5">Veri yok.</div>'; return; }
  const t = getChartTheme();
  siteHeatCmpChartInstance = new Chart(el, {
    type: 'line',
    data: { labels: MONTHS.map(m => m.substring(0,3)), datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'top', labels: { color: t.text } }, tooltip: { backgroundColor: t.tooltipBg, titleColor: t.tooltipText, bodyColor: t.tooltipText } },
      scales: { x: { grid: { color: t.grid }, ticks: { color: t.text } }, y: { beginAtZero: true, grid: { color: t.grid }, ticks: { color: t.text } } }
    }
  });
  const info = document.getElementById('siteHeatCmpInfo');
  if (info) info.innerHTML = siteStats.sort((a,b) => b.total - a.total).map(s => `<b>${esc(s.name)}</b>: ${money(s.total)} (${s.count} ay)`).join(' · ');
}

function renderMonthlySummary(user) {
  const db = getDB();
  const sid = currentSiteId();
  const allYears = new Set([new Date().getFullYear()]);
  siteFilter(db.dues).forEach(d => allYears.add(d.year));
  siteFilter(db.expenses).forEach(e => allYears.add(e.year));
  siteFilter(db.extraIncomes).forEach(x => allYears.add(x.year));
  const stored = parseInt(sessionStorage.getItem('monthlySummaryYear'));
  const year = allYears.has(stored) ? stored : [...allYears].sort((a,b)=>b-a)[0];
  
  const monthlyData = MONTHS.map((m, i) => {
    const monthNum = i + 1;
    const duesIn = siteFilter(db.dues).filter(d => d.is_paid && d.paid_at &&
      new Date(d.paid_at).getFullYear() === year &&
      new Date(d.paid_at).getMonth() + 1 === monthNum
    ).reduce((s,d) => s + Number(d.amount), 0);
    const partialsIn = (db.partialPayments || []).filter(pp => pp.site_id === sid &&
      new Date(pp.paid_at).getFullYear() === year &&
      new Date(pp.paid_at).getMonth() + 1 === monthNum
    ).reduce((s,pp) => s + Number(pp.amount), 0);
    const extraIn = siteFilter(db.extraIncomes).filter(x => x.year === year && x.month === monthNum).reduce((s,x) => s + Number(x.amount), 0);
    const manualIn = siteFilter(db.cashMovements).filter(m => m.type === 'gelir' &&
      new Date(m.date).getFullYear() === year &&
      new Date(m.date).getMonth() + 1 === monthNum
    ).reduce((s,m) => s + Number(m.amount), 0);
    const income = duesIn + partialsIn + extraIn + manualIn;
    const expTotal = siteFilter(db.expenses).filter(e => e.year === year && e.month === monthNum).reduce((s,e) => s + Number(e.amount), 0);
    const manualOut = siteFilter(db.cashMovements).filter(m => m.type === 'gider' &&
      new Date(m.date).getFullYear() === year &&
      new Date(m.date).getMonth() + 1 === monthNum
    ).reduce((s,m) => s + Number(m.amount), 0);
    const expense = expTotal + manualOut;
    return { month: monthNum, income, expense, net: income - expense };
  });
  
  const totalIn = monthlyData.reduce((s,d) => s + d.income, 0);
  const totalOut = monthlyData.reduce((s,d) => s + d.expense, 0);
  const totalNet = totalIn - totalOut;
  const bestMonth = monthlyData.reduce((a,b) => a.net > b.net ? a : b);
  const worstMonth = monthlyData.reduce((a,b) => a.net < b.net ? a : b);
  
  const catData = {};
  siteFilter(db.expenses).filter(e => e.year === year).forEach(e => {
    const k = e.category || 'Diğer';
    if (!catData[k]) catData[k] = 0;
    catData[k] += Number(e.amount);
  });
  const extraCatData = {};
  siteFilter(db.extraIncomes).filter(x => x.year === year).forEach(x => {
    const k = x.category || 'Diğer';
    if (!extraCatData[k]) extraCatData[k] = 0;
    extraCatData[k] += Number(x.amount);
  });
  
  setTimeout(() => { drawMonthlySummaryChart(year); }, 100);
  
  const rows = MONTHS.map((m, i) => {
    const d = monthlyData[i];
    const netColor = d.net >= 0 ? 'text-success' : 'text-danger';
    return `<tr>
      <td class="fw-bold">${m}</td>
      <td class="text-success text-end">+${money(d.income)}</td>
      <td class="text-danger text-end">−${money(d.expense)}</td>
      <td class="${netColor} text-end fw-bold">${money(d.net)}</td>
    </tr>`;
  }).join('');
  
  return `<div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">

    <div class="d-flex gap-2">
      <select class="form-select form-select-sm" style="width:auto;" onchange="sessionStorage.setItem('monthlySummaryYear',this.value);render()">
        ${[...allYears].sort((a,b)=>b-a).map(y => `<option value="${y}" ${y===year?'selected':''}>${y}</option>`).join('')}
      </select>
      <button class="btn btn-sm btn-outline-dark" onclick="exportMonthlySummaryCSV(${year})">📥 CSV</button>
    </div>

let monthlySummaryChartInstance = null;
function drawMonthlySummaryChart(year) {
  const el = document.getElementById('monthlySummaryChart');
  if (!el || typeof Chart === 'undefined') return;
  if (monthlySummaryChartInstance) { monthlySummaryChartInstance.destroy(); monthlySummaryChartInstance = null; }
  const db = getDB();
  const sid = currentSiteId();
  
  const monthlyData = MONTHS.map((m, i) => {
    const monthNum = i + 1;
    const duesIn = siteFilter(db.dues).filter(d => d.is_paid && d.paid_at &&
      new Date(d.paid_at).getFullYear() === year &&
      new Date(d.paid_at).getMonth() + 1 === monthNum
    ).reduce((s,d) => s + Number(d.amount), 0);
    const partialsIn = (db.partialPayments || []).filter(pp => pp.site_id === sid &&
      new Date(pp.paid_at).getFullYear() === year &&
      new Date(pp.paid_at).getMonth() + 1 === monthNum
    ).reduce((s,pp) => s + Number(pp.amount), 0);
    const extraIn = siteFilter(db.extraIncomes).filter(x => x.year === year && x.month === monthNum).reduce((s,x) => s + Number(x.amount), 0);
    const manualIn = siteFilter(db.cashMovements).filter(m => m.type === 'gelir' &&
      new Date(m.date).getFullYear() === year &&
      new Date(m.date).getMonth() + 1 === monthNum
    ).reduce((s,m) => s + Number(m.amount), 0);
    const income = duesIn + partialsIn + extraIn + manualIn;
    const expTotal = siteFilter(db.expenses).filter(e => e.year === year && e.month === monthNum).reduce((s,e) => s + Number(e.amount), 0);
    const manualOut = siteFilter(db.cashMovements).filter(m => m.type === 'gider' &&
      new Date(m.date).getFullYear() === year &&
      new Date(m.date).getMonth() + 1 === monthNum
    ).reduce((s,m) => s + Number(m.amount), 0);
    const expense = expTotal + manualOut;
    return { month: monthNum, income, expense, net: income - expense };
  });
  
  const t = getChartTheme();
  monthlySummaryChartInstance = new Chart(el, {
    type: 'bar',
    data: {
      labels: MONTHS.map(m => m.substring(0,3)),
      datasets: [
        { label: 'Gelir', data: monthlyData.map(d => d.income), backgroundColor: '#198754' },
        { label: 'Gider', data: monthlyData.map(d => d.expense), backgroundColor: '#dc3545' },
        { label: 'Net', data: monthlyData.map(d => d.net), type: 'line', borderColor: t.primary, borderWidth: 2, tension: .3, pointRadius: 4, fill: false }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: 'top', labels: { color: t.text } },
        tooltip: { backgroundColor: t.tooltipBg, titleColor: t.tooltipText, bodyColor: t.tooltipText, callbacks: { label: ctx => `${ctx.dataset.label}: ${money(ctx.raw)}` } }
      },
      scales: { x: { grid: { color: t.grid }, ticks: { color: t.text } }, y: { beginAtZero: true, grid: { color: t.grid }, ticks: { color: t.text } } }
    }
  });
}

    ).reduce((s,pp) => s + Number(pp.amount), 0);
