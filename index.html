h4,.h4{font-size:calc(1.5rem * var(--app-font-size-scale)) !important;}

.row{--bs-gutter-x:var(--app-density-gap);--bs-gutter-y:var(--app-density-gap);}

h5.mt-4,h5.mt-3,h6.mt-4,h6.mt-3,.mt-4,.mt-3{margin-top:var(--app-density-section-margin) !important;}

.alert{padding:calc(var(--app-density-card-padding) * 0.9) !important;}

[data-density="compact"] h4{font-size:calc(1.25rem * var(--app-font-size-scale)) !important;}
[data-density="compact"] h5{font-size:calc(1.1rem * var(--app-font-size-scale)) !important;}
[data-density="compact"] h6{font-size:calc(0.95rem * var(--app-font-size-scale)) !important;}
[data-density="compact"] .fs-3{font-size:calc(1.4rem * var(--app-font-size-scale)) !important;}
[data-density="compact"] .fs-4{font-size:calc(1.2rem * var(--app-font-size-scale)) !important;}
[data-density="compact"] .fs-5{font-size:calc(1.05rem * var(--app-font-size-scale)) !important;}
[data-density="spacious"] .card{box-shadow:var(--app-card-shadow),0 0 0 1px rgba(0,0,0,.03) !important;}
[data-density="spacious"] h3{font-size:calc(1.85rem * var(--app-font-size-scale)) !important;}

.site-logo-nav{height:36px;width:36px;object-fit:contain;border-radius:8px;background:#fff;padding:4px;box-shadow:0 2px 4px rgba(0,0,0,.1);transition:transform 0.15s ease, box-shadow 0.15s ease;}

.site-logo-settings{height:calc(48px * var(--app-font-size-scale)) !important;width:calc(48px * var(--app-font-size-scale)) !important;}
@keyframes fadeInUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.container.my-4{animation:fadeInUp 0.25s ease-out;}
.card[onclick]:hover,.card[role="button"]:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.1);}
.table-hover tbody tr{transition:background-color 0.1s ease;}
@keyframes modalFadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes modalScaleIn{from{transform:scale(0.95);opacity:0;}to{transform:scale(1);opacity:1;}}
div[id$="Modal"]:not([style*="display: none"]),div[id*="Modal"]{animation:modalFadeIn 0.15s ease-out;}
div[id$="Modal"] > div:first-child{animation:modalScaleIn 0.2s ease-out;}
.dropdown-menu{animation:fadeInUp 0.15s ease-out;}
.alert{animation:fadeInUp 0.2s ease-out;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.6;}}
.badge.bg-warning:not(.text-dark),.badge.bg-danger{animation:pulse 2s ease-in-out infinite;}
.progress-bar{transition:width 0.4s ease;}
.list-group-item{transition:background-color 0.1s ease;}
canvas{animation:fadeInUp 0.3s ease-out;}
@keyframes staggerIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
.row > [class*="col-"]{animation:staggerIn 0.25s ease-out;}
.row > [class*="col-"]:nth-child(1){animation-delay:0s;}
.row > [class*="col-"]:nth-child(2){animation-delay:0.03s;}
.row > [class*="col-"]:nth-child(3){animation-delay:0.06s;}
.row > [class*="col-"]:nth-child(4){animation-delay:0.09s;}
@media (prefers-reduced-motion: reduce),.reduce-motion *{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important;}
.table-responsive-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.chart-wrap{position:relative;height:320px;}

</style>

function cashSummary() {
  const db = getDB();
  const sid = currentSiteId();
  const dues = (db.dues||[]).filter(d => d.site_id === sid && d.is_paid);
  const expenses = (db.expenses||[]).filter(e => e.site_id === sid);
  const cm = (db.cashMovements||[]).filter(m => m.site_id === sid);
  const extra = (db.extraIncomes||[]).filter(x => x.site_id === sid);
  const partials = (db.partialPayments||[]).filter(pp => pp.site_id === sid);
  const incomeDue = dues.reduce((s,d) => s + Number(d.amount), 0);
  const expenseTotal = expenses.reduce((s,e) => s + Number(e.amount), 0);
  const manuelIn = cm.filter(m => m.type === 'gelir').reduce((s,m) => s + Number(m.amount), 0);
  const manuelOut = cm.filter(m => m.type === 'gider').reduce((s,m) => s + Number(m.amount), 0);
  const extraIn = extra.reduce((s,x) => s + Number(x.amount), 0);
  const partialIn = partials.reduce((s,pp) => s + Number(pp.amount), 0);
  return { income: incomeDue + manuelIn + extraIn + partialIn, expense: expenseTotal + manuelOut, balance: incomeDue + manuelIn + extraIn + partialIn - expenseTotal - manuelOut };
}
function currentMonthStats() {
  const db = getDB(); const sid = currentSiteId(); const now = new Date();
  const month = now.getMonth() + 1; const year = now.getFullYear();
  const duesThisMonth = (db.dues || []).filter(d => d.site_id === sid && d.month === month && d.year === year);
  const duesPaid = duesThisMonth.filter(d => d.is_paid);
  const duesUnpaid = duesThisMonth.filter(d => !d.is_paid);
  const expensesThisMonth = (db.expenses || []).filter(e => e.site_id === sid && e.month === month && e.year === year);
  const extraThisMonth = (db.extraIncomes || []).filter(x => x.site_id === sid && x.month === month && x.year === year);
  return { month, year,
    duesTotal: duesThisMonth.reduce((s,d) => s + Number(d.amount), 0),
    duesPaidTotal: duesPaid.reduce((s,d) => s + Number(d.amount), 0),
    duesUnpaidTotal: duesUnpaid.reduce((s,d) => s + Number(d.amount), 0),
    duesPaidCount: duesPaid.length, duesUnpaidCount: duesUnpaid.length,

/* ============================================================
   CSV / EXCEL
============================================================ */
function downloadCSV(filename, rows) {
  const csv = rows.map(row => row.map(cell => { const s = String(cell ?? ''); return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(';')).join('\r\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}
function parseCSV(text) {
  text = text.replace(/^\uFEFF/, '');
  const firstLine = text.split(/\r?\n/)[0] || '';
  const counts = { ';': (firstLine.match(/;/g)||[]).length, ',': (firstLine.match(/,/g)||[]).length, '\t': (firstLine.match(/\t/g)||[]).length };
  const sep = Object.keys(counts).reduce((a,b) => counts[a] >= counts[b] ? a : b);
  const rows = []; let cur = []; let field = ''; let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQuotes) { if (ch === '"') { if (text[i+1] === '"') { field += '"'; i++; } else { inQuotes = false; } } else { field += ch; } }
    else { if (ch === '"') inQuotes = true; else if (ch === sep) { cur.push(field); field = ''; } else if (ch === '\r') {} else if (ch === '\n') { cur.push(field); rows.push(cur); cur = []; field = ''; } else field += ch; }
  }
  if (field.length || cur.length) { cur.push(field); rows.push(cur); }
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}
function parseExcel(file, callback) {
  if (typeof XLSX === 'undefined') { alert('Excel kütüphanesi yüklenemedi.'); callback(null); return; }
  const reader = new FileReader();
  reader.onload = ev => {
    try { const data = new Uint8Array(ev.target.result); const workbook = XLSX.read(data, { type: 'array' }); const firstSheet = workbook.Sheets[workbook.SheetNames[0]]; const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1, raw: false, defval: '' }); callback(rows.filter(r => r.some(c => String(c).trim() !== ''))); }
    catch (err) { alert('Excel dosyası okunamadı: ' + err.message); callback(null); }
  };
  reader.readAsArrayBuffer(file);
}
function readSpreadsheet(file, callback) {
  if (!file) { callback(null); return; }
  const name = file.name.toLowerCase();
  if (name.endsWith('.xlsx') || name.endsWith('.xls')) parseExcel(file, callback);
  else { const reader = new FileReader(); reader.onload = ev => callback(parseCSV(ev.target.result)); reader.readAsText(file, 'UTF-8'); }
}

  const year = today.getFullYear(); const month = today.getMonth() + 1;

    });

function calcDueInterest(due, dailyRate, refDate) {
  if (due.is_paid) return null;
  const dueDate = new Date(due.year, due.month, 0); const today = refDate || new Date();
  if (today <= dueDate) return null;
  const days = Math.floor((today - dueDate) / (1000*60*60*24));
  if (days <= 0) return null;
  return { days, dueDate, interest: Number(due.amount) * dailyRate * days };
}

    case 'my-notifications': return renderMyNotifications(user);
    case 'payment-history': return renderPaymentHistory(user);
    case 'stats': return renderStats(user);
    case 'settings': return renderSettings(user);

    case 'tenant-dashboard': return renderTenantDashboard(user);
    case 'tenant-payment-history': return renderTenantPaymentHistory(user);

    case 'apartment-history': return renderApartmentHistory(user);

    case 'projects': return renderProjects(user);
    case 'announcements': return renderAnnouncements(user);
    case 'announcement-detail': return renderAnnouncementDetail(user);
    case 'monthly-summary': return renderMonthlySummary(user);
    case 'reports': return renderReports(user);
    default: return renderDashboard(user);
  }
}

function renderExtraIncomeCalendar() {

}

  const monthlySummary = {}; filtered.forEach(m => { const dt = new Date(m.date); const key = dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2,'0'); if (!monthlySummary[key]) monthlySummary[key] = { gelir: 0, gider: 0 }; if (m.type === 'gelir') monthlySummary[key].gelir += m.amount; else monthlySummary[key].gider += m.amount; });

  ${activeTab === 'kategori' ? `<div class="card"><div class="card-body"><h6>🏷️ Kategori</h6><table class="table table-sm table-hover mb-0"><thead><tr><th>Tür</th><th>Kategori</th><th class="text-end">Adet</th><th class="text-end">Toplam</th></tr></thead><tbody>${Object.keys(catSummary).length ? Object.values(catSummary).sort((a,b) => b.total - a.total).map(c => `<tr><td><span class="badge bg-${c.type === 'gelir' ? 'success' : 'danger'}">${c.type === 'gelir' ? 'Gelir' : 'Gider'}</span></td><td>${esc(c.category)}</td><td class="text-end">${c.count}</td><td class="text-end fw-bold ${c.type === 'gelir' ? 'text-success' : 'text-danger'}">${c.type === 'gelir' ? '+' : '−'}${money(c.total)}</td></tr>`).join('') : '<tr><td colspan="4" class="text-muted text-center py-4">Kayıt yok</td></tr>'}</tbody></table></div></div>` : ''}`;

function exportReportsCSV() { const db = getDB(); const sid = currentSiteId(); const startStr = sessionStorage.getItem('repStart') || ''; const endStr = sessionStorage.getItem('repEnd') || ''; const repType = sessionStorage.getItem('repType') || 'all'; const startDate = startStr ? new Date(startStr + 'T00:00:00') : null; const endDate = endStr ? new Date(endStr + 'T23:59:59') : null; const all = []; siteFilter(db.dues).filter(d => d.is_paid && d.paid_at).forEach(d => { const apt = db.apartments.find(a => a.id === d.apartment_id); const cat = d.category === 'ısı' ? 'Isı' : d.category === 'proje' ? 'Proje' : 'Aidat'; all.push({ date: d.paid_at, type: 'gelir', category: cat, description: `${cat} — ${apt ? aptLabel(apt) : '-'}`, amount: Number(d.amount), ref: `AID-${d.id}` }); }); siteFilter(db.expenses).forEach(e => all.push({ date: e.paid_at || e.created_at, type: 'gider', category: e.category, description: `Gider — ${e.category}`, amount: Number(e.amount), ref: `GDR-${e.id}` })); siteFilter(db.cashMovements).forEach(m => all.push({ date: m.date, type: m.type, category: m.type === 'gelir' ? 'Manuel G.' : 'Manuel Gid.', description: m.description, amount: Number(m.amount), ref: `MAN-${m.id}` })); siteFilter(db.extraIncomes).forEach(x => all.push({ date: x.date || new Date(x.year, x.month-1, 1).toISOString(), type: 'gelir', category: x.category, description: `Ekstra`, amount: Number(x.amount), ref: `EKS-${x.id}` })); let filtered = all.filter(m => { const t = new Date(m.date).getTime(); if (startDate && t < startDate.getTime()) return false; if (endDate && t > endDate.getTime()) return false; if (repType === 'gelir' && m.type !== 'gelir') return false; if (repType === 'gider' && m.type !== 'gider') return false; return true; }); filtered.sort((a,b) => new Date(a.date) - new Date(b.date)); const preRange = all.filter(m => startDate && new Date(m.date).getTime() < startDate.getTime()); let running = preRange.reduce((s,m) => s + (m.type === 'gelir' ? m.amount : -m.amount), 0); const opening = running; const rows = [[`${activeSite()?.name || 'Site'} — Kasa Defteri`], [`Dönem: ${startStr || 'ilk'} → ${endStr || 'bugün'}`], [`Açılış: ${opening.toFixed(2)}`], [], ['Tarih', 'Ref', 'Açıklama', 'Kategori', 'Gelir', 'Gider', 'Bakiye']]; filtered.forEach(m => { if (m.type === 'gelir') running += m.amount; else running -= m.amount; rows.push([new Date(m.date).toLocaleDateString('tr-TR'), m.ref, m.description, m.category, m.type === 'gelir' ? m.amount.toFixed(2) : '', m.type === 'gider' ? m.amount.toFixed(2) : '', running.toFixed(2)]); }); rows.push([]); rows.push(['', '', 'KAPANIŞ', '', '', '', running.toFixed(2)]); downloadCSV(`kasa-defteri-${startStr||'ilk'}_${endStr||'bugun'}.csv`, rows); }

leInfo"></div><div class="mt-2"><button class="btn btn-sm btn-outline-secondary" onclick="openVendorTemplateModal()">⚙️ Özel Şablonlar</button></div></div></div>` : ''}

    <div class="card mb-3"><div class="card-body"><h6>📊 Daire Bazlı Isı Geçmişi</h6><div class="row g-2 mb-2"><div class="col-md-3"><select id="heatHistApt" class="form-select form-select-sm">${siteFilter(db.apartments).sort((a,b)=>(a.block||'').localeCompare(b.block||'')||a.number.localeCompare(b.number)).map(a => `<option value="${a.id}">${aptLabel(a)}</option>`).join('')}</select></div><div class="col-md-3"><select id="heatHistYear" class="form-select form-select-sm">${(() => { const yrs = new Set([new Date().getFullYear()]); siteFilter(db.heatBills).forEach(b => yrs.add(b.year)); return [...yrs].sort((a,b)=>b-a).map(y => `<option value="${y}">${y}</option>`).join(''); })()}</select></div><div class="col-md-3"><select id="heatHistType" class="form-select form-select-sm"><option value="pay">Pay</option><option value="amount">Fatura (₺)</option></select></div><div class="col-md-3 d-flex align-items-end"><button class="btn btn-sm btn-primary w-100" onclick="drawHeatHistoryChart()">Göster</button></div></div><div class="chart-wrap"><canvas id="heatHistoryChart"></canvas></div><div id="heatHistoryInfo" class="small text-muted mt-2"></div></div></div>

function getHeatVendorConfig(vendor) { if (vendor && vendor.startsWith('custom-')) { const tmplId = parseInt(vendor.replace('custom-','')); const db = getDB(); const tmpl = (db.heatVendorTemplates || []).find(t => t.id === tmplId && t.site_id === currentSiteId()); if (tmpl) return { colAptPatterns: tmpl.aptPatterns, colPayPatterns: tmpl.payPatterns, label: tmpl.name }; } return { genel: { colAptPatterns: ['DAİRE','DAIRE','APT','NO'], colPayPatterns: ['PAY','ÖLÇER','OLCER','TÜKETİM','TUKETIM','DEĞER','VALUE'], label: 'Genel' }, kamstrup: { colAptPatterns: ['DAİRE','DAIRE','LOKASYON','APT'], colPayPatterns: ['TÜKETİM','CONSUMPTION','ENERJİ','VALUE'], label: 'Kamstrup' }, techem: { colAptPatterns: ['DAİRE','DAIRE','NUTZEINHEIT','APT'], colPayPatterns: ['VERBRAUCH','CONSUMPTION','TÜKETİM','WERT'], label: 'Techem' }, ista: { colAptPatterns: ['DAİRE','DAIRE','OBJEKT','APT'], colPayPatterns: ['VERBRAUCH','TÜKETİM','EINHEIT','WERT'], label: 'Ista' }, meter: { colAptPatterns: ['SAYAÇ','SAYAC','METER','SERIAL'], colPayPatterns: ['PAY','ÖLÇER','OLCER','TÜKETİM','DEĞER'], label: 'Sayaç' } }[vendor] || {}; }

function openProjectAnnounceModal(projId) { const db = getDB(); const proj = (db.projects || []).find(p => p.id === projId); if (!proj) return; const apts = siteFilter(db.apartments); const targets = apts.map(apt => { const resident = db.users.find(u => u.role === 'resident' && u.apartment_id === apt.id); return { apt, owner: { name: apt.owner_name, phone: apt.owner_phone, email: apt.owner_email }, tenant: apt.is_rented ? { name: apt.tenant_name, phone: apt.tenant_phone, email: apt.tenant_email } : (resident ? { name: resident.full_name, phone: resident.phone, email: resident.email } : null) }; }); const defaultMsg = `Sayın site sakini, "${proj.name}" projesi başlatılmıştır. Toplam: ${money(proj.totalAmount)}, ${proj.installmentCount} taksit.`; const existing = document.getElementById('projAnnounceModal'); if (existing) existing.remove(); const modal = document.createElement('div'); modal.id = 'projAnnounceModal'; modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;'; modal.onclick = e => { if (e.target === modal) modal.remove(); }; modal.innerHTML = `<div style="background:var(--modal-bg);border-radius:8px;max-width:1000px;width:100%;max-height:90vh;overflow:auto;padding:20px;"><div class="d-flex justify-content-between mb-3"><h5 class="mb-0">📢 Duyuru — ${esc(proj.name)}</h5><button class="btn btn-sm btn-outline-secondary" onclick="document.getElementById('projAnnounceModal').remove()">Kapat</button></div><div class="mb-3"><label class="form-label"><b>Mesaj</b></label><textarea id="projAnnounceMsg" class="form-control" rows="3">${esc(defaultMsg)}</textarea></div><div class="row g-2 mb-3"><div class="col-md-4"><select id="projAnnounceTarget" class="form-select form-select-sm" onchange="renderProjectAnnounceTargets()"><option value="owner">Sahipler</option><option value="tenant">Kiracılar</option><option value="both">İkisi</option></select></div><div class="col-md-4"> function renderProjectAnnounceTargets() { const modal = document.getElementById('projAnnounceModal'); if (!modal) return; const targets = modal._targets || []; const target = document.getElementById('projAnnounceTarget')?.value || 'owner'; const channel = document.getElementById('projAnnounceChannel')?.value || 'whatsapp'; const msg = document.getElementById('projAnnounceMsg')?.value || ''; const rows = []; const emails = []; const phones = []; targets.forEach(t => { const people = []; if (target === 'owner' || target === 'both') { if (t.owner.name || t.owner.phone || t.owner.email) people.push({ role: 'Sahip', ...t.owner }); } if (target === 'tenant' || target === 'both') { if (t.tenant && (t.tenant.name || t.tenant.phone || t.tenant.email)) people.push({ role: 'Kiracı', ...t.tenant }); } people.forEach(p => { const contact = channel === 'whatsapp' ? p.phone : p.email; if (contact) { if (channel === 'email') emails.push(p.email); if (channel === 'whatsapp') phones.push(p.phone.replace(/\D/g,'')); } if (!contact) { rows.push(`<tr class="table-warning"><td>${t.apt ? aptLabel(t.apt) : '—'}</td><td>${p.role}</td><td>${esc(p.name || '-')}</td><td class="text-muted small">Eksik</td><td>-</td></tr>`); return; } let link = ''; if (channel === 'whatsapp') { const ph = contact.replace(/\D/g,''); const wa = ph.startsWith('90') ? ph : '90' + ph.replace(/^0/,''); link = `https://wa.me/${wa}?text=${encodeURIComponent(msg)}`; } else { link = `mailto:${contact}?subject=${encodeURIComponent(modal._proj.name)}&body=${encodeURIComponent(msg)}`; } rows.push(`<tr><td>${t.apt ? aptLabel(t.apt) : '—'}</td><td><span class="badge bg-${p.role === 'Sahip' ? 'primary' : 'info'}">${p.role}</span></td><td>${esc(p.name || '-')}</td><td class="small">${esc(contact)}</td><td class="text-end"><a href="${link}" target="_blank" class="btn btn-sm btn-${channel === 'whatsapp' ? 'success' : 'primary'}">${channel === 'whatsapp' ? '💬 WA' : '✉ Mail'}</a></td></tr>`); }); }); const uniqueEmails = [...new Set(emails)]; const uniquePhones = [...new Set(phones)]; let bulkBtn = ''; if (channel === 'email' && uniqueEmails.length > 1) { const bccLink = `mailto:?bcc=${uniqueEmails.join(',')}&subject=${encodeURIComponent(modal._proj.name)}&body=${encodeURIComponent(msg)}`; bulkBtn = `<a href="${bccLink}" class="btn btn-sm btn-primary" onclick="return confirm('${uniqueEmails.length} alıcıya BCC ile mail açılacak.');">✉ Tümünü BCC'ye Ekle (${uniqueEmails.length})</a>`; } if (channel === 'whatsapp' && uniquePhones.length > 1) { bulkBtn = `<button class="btn btn-sm btn-outline-success" onclick="openAllWhatsAppLinks('${uniquePhones.join(',')}', '${msg.replace(/'/g, "\\'")}')">💬 Tümünü Sırayla Aç (${uniquePhones.length})</button>`; } const listEl = document.getElementById('projAnnounceList'); if (listEl) { listEl.innerHTML = `<div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2"><b>${rows.length} alıcı</b>${bulkBtn}</div><div class="table-responsive-wrap" style="max-height:40vh;"><table class="table table-sm table-striped"><thead><tr><th>Daire</th><th>Rol</th><th>Ad</th><th>İletişim</th><th></th></tr></thead><tbody>${rows.join('') || '<tr><td colspan="5" class="text-muted">Alıcı yok.</td></tr>'}</tbody></table></div>`; } }
function openAllWhatsAppLinks(phonesCsv, message) { const phones = phonesCsv.split(',').map(p => p.trim()).filter(Boolean); if (!phones.length) return; if (!confirm(`${phones.length} WhatsApp penceresi sırayla açılacak.`)) return; let idx = 0; const openNext = () => { if (idx >= phones.length) { alert('Tamamlandı.'); return; } const ph = phones[idx]; const wa = ph.startsWith('90') ? ph : '90' + ph.replace(/^0/,''); window.open(`https://wa.me/${wa}?text=${encodeURIComponent(message)}`, '_blank'); idx++; if (idx < phones.length) { if (confirm(`${idx} / ${phones.length} açıldı. Devam?`)) setTimeout(openNext, 1500); } else alert('Tamamlandı.'); }; openNext(); }

function getActuals(siteId, year) { const db = getDB(); const inc = Array(12).fill(0); const exp = Array(12).fill(0); (db.dues || []).filter(d => d.site_id === siteId && d.is_paid && d.paid_at).forEach(d => { const dt = new Date(d.paid_at); if (dt.getFullYear() === year) inc[dt.getMonth()] += Number(d.amount); }); (db.extraIncomes || []).filter(x => x.site_id === siteId).forEach(x => { if (x.year === year && x.month >= 1 && x.month <= 12) inc[x.month - 1] += Number(x.amount); }); (db.partialPayments || []).filter(pp => pp.site_id === siteId).forEach(pp => { const dt = new Date(pp.paid_at); if (dt.getFullYear() === year) inc[dt.getMonth()] += Number(pp.amount); }); (db.expenses || []).filter(e => e.site_id === siteId).forEach(e => { const dt = new Date(e.paid_at || e.created_at); if (dt.getFullYear() === year) exp[dt.getMonth()] += Number(e.amount); }); return { income: inc, expense: exp }; }

  const incVariance = actIncTotal - budIncTotal; const expVariance = actExpTotal - budExpTotal; const budNet = budIncTotal - budExpTotal; const actNet = actIncTotal - actExpTotal;
  const allYears = new Set([new Date().getFullYear(), year]); (db.budgets || []).filter(b => b.site_id === sid).forEach(b => allYears.add(b.year));

function renderChangePassword(user) { return `<h3>Şifre Değiştir</h3><div class="row"><div class="col-md-5"><div class="card"><div class="card-body"><form id="changePwForm"><div class="mb-3"><label class="form-label">Mevcut</label><input name="old" type="password" class="form-control" required></div><div class="mb-3"><label class="form-label">Yeni</label><input name="new1" type="password" class="form-control" required minlength="4"></div><div class="mb-3"><label class="form-label">Yeni (tekrar)</label><input name="new2" type="password" class="form-control" required minlength="4"></div><div id="pwError" class="text-danger small mb-2"></div><button class="btn btn-primary w-100">Güncelle</button></form></div></div></div></div>`; }
function renderSettings(user) {
  const db = getDB(); const s = db.settings;
  return `<h3>Ayarlar <small class="text-muted">— ${esc(activeSite()?.name || '')}</small></h3>
    <div class="row">
      <div class="col-md-6"><div class="card"><div class="card-body"><h6>Otomatik Aidat</h6><p class="small text-muted">Son: <b>${s.lastAutoRun || 'hiç'}</b></p><form id="settingsForm"><div class="mb-3"><label class="form-label">Aylık Aidat (₺)</label><input name="amount" type="number" step="0.01" min="0" class="form-control" value="${s.monthlyDuesAmount}" required></div><div class="mb-3"><label class="form-label">Ayın Kaçında?</label><input name="day" type="number" min="1" max="28" class="form-control" value="${s.autoGenerateDay}" required></div><button class="btn btn-primary">Kaydet</button><button type="button" class="btn btn-outline-warning ms-2" onclick="runAutoNow()">Şimdi</button></form></div></div></div>
      <div class="col-md-6"><div class="card"><div class="card-body"><h6>Banka Hesabı</h6><form id="bankForm"><div class="mb-3"><label class="form-label">Banka Adı</label><input name="bank_name" class="form-control" value="${esc(db.bank.bank_name||'')}"></div><div class="mb-3"><label class="form-label">Hesap Sahibi</label><input name="holder" class="form-control" value="${esc(db.bank.holder||'')}"></div><div class="mb-3"><label class="form-label">IBAN</label><input name="iban" class="form-control" value="${esc(db.bank.iban||'')}" maxlength="34"></div><button class="btn btn-primary">Kaydet</button></form></div></div></div>
      <div class="col-md-6 mt-3"><div class="card"><div class="card-body"><h6>Gecikme Faizi</h6><form id="interestForm"><div class="mb-3"><label class="form-label">Günlük Faiz (ondalık)</label><input name="rate" type="number" step="0.0001" min="0" class="form-control" value="${s.dailyInterestRate}" required><div class="form-text">%0.1 için 0.001</div></div><button class="btn btn-primary">Kaydet</button></form></div></div></div>
      <div class="col-md-6 mt-3"><div class="card"><div class="card-body"><h6>Aktif Site Bilgileri</h6><form id="activeSiteForm"><div class="mb-3"><label class="form-label">Site Adı *</label><input name="name" class="form-control" value="${esc(activeSite()?.name || '')}" required></div><div class="mb-3"><label class="form-label">Adres</label><textarea name="address" class="form-control" rows="2">${esc(activeSite()?.address || '')}</textarea></div><button class="btn btn-primary">Kaydet</button></form></div></div></div>
      <div class="col-md-6 mt-3"><div class="card"><div class="card-body"><h6>Site Yönetimi & Bloklar</h6><form id="siteForm" class="row g-2 mb-2"><div class="col-md-8"><input name="name" class="form-control" placeholder="Site adı *" required></div><div class="col-md-4"><button class="btn btn-primary w-100">+ Site Ekle</button></div></form><table class="table table-sm mb-3"><thead><tr><th style="width:60px;">Logo</th><th>Ad</th><th class="text-end">Sil</th></tr></thead><tbody>${db.sites.map(s2 => `<tr><td class="text-center">${(() => { const logo = getSiteLogo(s2.id); return `${logo ? `<img src="${logo}" class="site-logo-settings mb-1"><br>` : ''}<label class="btn btn-sm btn-outline-primary py-0 px-1 mb-0">📷<input type="file" accept="image/png,image/jpeg,image/svg+xml,image/webp" style="display:none" onchange="uploadSiteLogo(${s2.id}, this.files[0]); this.value='';"></label>${logo ? `<button class="btn btn-sm btn-outline-danger py-0 px-1 ms-1" onclick="removeSiteLogo(${s2.id})">×</button>` : ''}`; })()}</td><td>${esc(s2.name)}</td><td class="text-end">${s2.id === 1 ? '<span class="text-muted small">varsayılan</span>' : `<button class="btn btn-sm btn-outline-danger" onclick="deleteSite(${s2.id})">Sil</button>`}</td></tr>`).join('')}</tbody></table><hr class="my-2"><h6>Bloklar</h6><form id="blockForm" class="row g-2 mb-2"><div class="col-md-8"><input name="block_name" class="form-control" placeholder="Blok adı *" required maxlength="10"></div><div class="col-md-4"><button class="btn btn-primary w-100">+ Blok Ekle</button></div></form><table class="table table-sm mb-0"><thead><tr><th>Blok</th><th class="text-end">Daire</th><th class="text-end">İşlem</th></tr></thead><tbody>${(() => { const blocks = siteFilter(db.blocks); if (!blocks.length) return '<tr><td colspan="3" class="text-muted">Henüz yok.</td></tr>'; return blocks.sort((a,b) => a.name.localeCompare(b.name)).map(b => { const aptCount = siteFilter(db.apartments).filter(a => (a.block||'').toUpperCase() === b.name.toUpperCase()).length; return `<tr><td><b>${esc(b.name)}</b></td><td class="text-end">${aptCount}</td><td class="text-end"><button class="btn btn-sm btn-outline-danger" onclick="deleteBlock(${b.id})" ${aptCount > 0 ? 'disabled' : ''}>Sil</button></td></tr>`; }).join(''); })()}</tbody></table></div></div></div>
      <div class="col-md-6 mt-3"><div class="card"><div class="card-body"><h6>🎨 Görünüm</h6>
        <div class="mb-3"><label class="form-label small fw-bold">Tema</label><div><button class="btn btn-sm ${!isDark() ? 'btn-primary' : 'btn-outline-primary'}" onclick="if(isDark()) toggleTheme();">☀️ Aydınlık</button><button class="btn btn-sm ${isDark() ? 'btn-primary' : 'btn-outline-primary'} ms-1" onclick="if(!isDark()) toggleTheme();">🌙 Karanlık</button></div></div>
        <div class="mb-2"><label class="form-label small fw-bold">Ana Renk</label><div class="d-flex gap-2 flex-wrap">${Object.entries(COLOR_THEMES).map(([key, theme]) => `<button type="button" class="btn ${currentColorTheme() === key ? 'btn-primary' : 'btn-outline-secondary'}" style="width:50px;height:50px;border-radius:50%;padding:0;${currentColorTheme() === key ? `background:${theme.primary} !important;border-color:${theme.primary} !important;` : `border:3px solid ${theme.primary};`}" onclick="changeColorTheme('${key}')" title="${theme.name}"><span style="font-size:1.2rem;">${theme.icon}</span></button>`).join('')}</div></div>
        <div class="mb-2 mt-3"><label class="form-label small fw-bold">Kart Stili</label><div class="d-flex gap-2 flex-wrap">${Object.entries(CARD_STYLES).map(([key, style]) => `<button type="button" class="btn ${currentCardStyle() === key ? 'btn-primary' : 'btn-outline-secondary'}" style="padding:6px 10px;" onclick="changeCardStyle('${key}')"><div class="d-flex align-items-center gap-2"><div style="width:24px;height:24px;border-radius:${style.radius};background:var(--app-primary);box-shadow:${style.shadow};"></div><span class="small">${style.name}</span></div></button>`).join('')}</div></div>
        <div class="mb-2 mt-3"><label class="form-label small fw-bold">Yazı Tipi</label><div class="d-flex gap-2 flex-wrap">${Object.entries(FONT_FAMILIES).map(([key, font]) => `<button type="button" class="btn ${currentFontFamily() === key ? 'btn-primary' : 'btn-outline-secondary'} btn-sm" style="padding:6px 10px;font-family:${font.family};" onclick="changeFontFamily('${key}')">${font.name}</button>`).join('')}</div></div>
        <div class="mb-2 mt-3"><label class="form-label small fw-bold">Yazı Boyutu</label><div class="d-flex gap-2 flex-wrap">${Object.entries(FONT_SIZES).map(([key, size]) => `<button type="button" class="btn ${currentFontSize() === key ? 'btn-primary' : 'btn-outline-secondary'} btn-sm" style="padding:6px 10px;" onclick="changeFontSize('${key}')">${size.icon} ${size.name}</button>`).join('')}</div></div>
        <div class="mb-2 mt-3"><label class="form-label small fw-bold">Yoğunluk</label><div class="d-flex gap-2 flex-wrap">${Object.entries(DENSITY_MODES).map(([key, mode]) => `<button type="button" class="btn ${currentDensity() === key ? 'btn-primary' : 'btn-outline-secondary'} btn-sm" style="padding:6px 10px;" onclick="changeDensity('${key}')">${mode.icon} ${mode.name}</button>`).join('')}</div></div>
      </div></div></div>
    </div>`;
}
function uploadSiteLogo(siteId, file) { if (!file) return; if (file.size > 500 * 1024) { alert('Logo 500 KB\'dan küçük olmalı.'); return; } if (!file.type.startsWith('image/')) { alert('Sadece resim.'); return; } const reader = new FileReader(); reader.onload = ev => { const img = new Image(); img.onload = () => { const canvas = document.createElement('canvas'); const MAX = 256; let { width, height } = img; if (width > MAX || height > MAX) { if (width > height) { height = Math.round(height * MAX / width); width = MAX; } else { width = Math.round(width * MAX / height); height = MAX; } } canvas.width = width; canvas.height = height; const ctx = canvas.getContext('2d'); ctx.clearRect(0, 0, width, height); ctx.drawImage(img, 0, 0, width, height); const resizedDataUrl = canvas.toDataURL('image/png'); const db = getDB(); db.siteLogos = db.siteLogos || {}; db.siteLogos[siteId] = resizedDataUrl; try { setDB(db); alert(`Logo yüklendi (${width}×${height}px).`); applyFavicon(); applyManifest(); render(); } catch (err) { alert('Depolama doldu.'); } }; img.onerror = () => alert('Resim geçersiz.'); img.src = ev.target.result; }; reader.readAsDataURL(file); }
function removeSiteLogo(siteId) { if (!confirm('Logo silinsin mi?')) return; const db = getDB(); if (db.siteLogos) delete db.siteLogos[siteId]; setDB(db); applyFavicon(); applyManifest(); render(); }
function deleteSite(id) { if (id === 1) { alert('Varsayılan silinemez.'); return; } if (!confirm('Site ve tüm verileri silinecek.')) return; const db = getDB(); db.sites = db.sites.filter(s => s.id !== id); ['apartments','users','dues','expenses','notifications','cashMovements','paymentRequests','extraIncomes','heatBills','budgets','importedTransactions','senderAliases','heatVendorTemplates','meterHistory','blocks','tenantHistory','contactHistory','projects','partialPayments','projectFiles','announcements','announcementReads','announcementLikes','announcementComments','announcementTemplates','notificationPrefs'].forEach(t => { db[t] = (db[t]||[]).filter(x => x.site_id !== id); }); if (db.siteLogos) delete db.siteLogos[id]; setDB(db); if (currentSiteId() === id) switchSite(1); else render(); }
function deleteBlock(blockId) { const db = getDB(); const b = (db.blocks || []).find(x => x.id === blockId); if (!b) return; const aptCount = siteFilter(db.apartments).filter(a => (a.block||'').toUpperCase() === b.name.toUpperCase()).length; if (aptCount > 0) { alert(`Bu blokta ${aptCount} daire var.`); return; } if (!confirm(`"${b.name}" silinsin mi?`)) return; db.blocks = db.blocks.filter(x => x.id !== blockId); setDB(db); render(); }
function runAutoNow() { const db = getDB(); db.settings.lastAutoRun = null; setDB(db); runAutoDues(); render(); alert('Çalıştırıldı.'); }
function runRentRemindersNow() { const db = getDB(); db.settings.rentReminderLastRun = null; setDB(db); runAutoRentReminders(); render(); alert('Çalıştırıldı.'); }
function runHeatRemindersNow() { const db = getDB(); db.settings.heatReminderLastRun = null; setDB(db); runAutoHeatReminders(); render(); alert('Çalıştırıldı.'); }
function runOwnerRemindersNow() { const db = getDB(); db.settings.ownerReminderLastRun = null; setDB(db); runAutoOwnerReminders(); render(); alert('Çalıştırıldı.'); }
function changeColorTheme(key) { const db = getDB(); db.settings.colorTheme = key; setDB(db); applyColorTheme(); applyChartDefaults(); redrawActiveCharts(); render(); }
function changeCardStyle(key) { const db = getDB(); db.settings.cardStyle = key; setDB(db); applyCardStyle(); render(); }
function changeFontFamily(key) { const db = getDB(); db.settings.fontFamily = key; setDB(db); applyFontFamily(); render(); }
function changeFontSize(key) { const db = getDB(); db.settings.fontSize = key; setDB(db); applyFontSize(); setTimeout(() => redrawActiveCharts(), 100); render(); }
function changeDensity(key) { const db = getDB(); db.settings.density = key; setDB(db); applyDensity(); setTimeout(() => redrawActiveCharts(), 100); render(); }
function redrawActiveCharts() { if (document.getElementById('kpiTrendChart')) { if (kpiTrendChartInstance) { kpiTrendChartInstance.destroy(); kpiTrendChartInstance = null; } drawKpiTrendChart(); } }
function sendRentReminders() { alert('Kira hatırlatması gönderildi (basitleştirilmiş).'); }

/* ============================================================

function attachHandlers() {
  const a = document.getElementById('addAptForm');
  if (a) a.addEventListener('submit', e => { e.preventDefault(); const fd = new FormData(e.target); const blockVal = (fd.get('block') || '').trim(); if (!blockVal) { alert('Blok seçin.'); return; } const isRented = fd.get('is_rented') === 'on'; const db = getDB(); const newApt = { id: db.nextId.apartment++, site_id: currentSiteId(), block: blockVal, number: fd.get('number'), floor: parseInt(fd.get('floor')) || 0, area: parseFloat(fd.get('area')) || 0, meter_no: (fd.get('meter_no') || '').trim(), owner_name: fd.get('owner_name') || '', owner_phone: (fd.get('owner_phone') || '').trim(), owner_email: (fd.get('owner_email') || '').trim(), is_rented: isRented, tenant_name: isRented ? (fd.get('tenant_name') || '').trim() : '', tenant_phone: isRented ? (fd.get('tenant_phone') || '').trim() : '', tenant_email: isRented ? (fd.get('tenant_email') || '').trim() : '' }; db.apartments.push(newApt); if (isRented) logTenantChange(newApt.id, { is_rented: false, tenant_name: '', tenant_phone: '', tenant_email: '' }, { is_rented: true, tenant_name: newApt.tenant_name, tenant_phone: newApt.tenant_phone, tenant_email: newApt.tenant_email }); setDB(db); render(); });
  const r = document.getElementById('addResForm');
  if (r) r.addEventListener('submit', e => { e.preventDefault(); const fd = new FormData(e.target); const username = fd.get('username').trim(); const role = fd.get('role') || 'resident'; const db = getDB(); if (db.users.find(u => u.username === username)) { alert('Bu kullanıcı adı alınmış.'); return; } db.users.push({ id: db.nextId.user++, site_id: currentSiteId(), username, password: fd.get('password'), role, full_name: fd.get('full_name') || '', email: fd.get('email') || '', phone: fd.get('phone') || '', apartment_id: fd.get('apartment_id') ? parseInt(fd.get('apartment_id')) : null }); setDB(db); render(); });
  const rem = document.getElementById('reminderForm');
  if (rem) rem.addEventListener('submit', e => { e.preventDefault(); const fd = new FormData(e.target); const month = parseInt(fd.get('month')), year = parseInt(fd.get('year')); const channel = fd.get('channel') || 'app'; const db = getDB(); const unpaid = siteFilter(db.dues).filter(d => d.month===month && d.year===year && !d.is_paid); if (!unpaid.length) { alert('Ödenmemiş yok.'); return; } unpaid.forEach(d => { const resident = db.users.find(u => u.role==='resident' && u.apartment_id===d.apartment_id); const msg = `${MONTHS[month-1]} ${year} aidatınız (${Number(d.amount).toFixed(2)} ₺) ödenmemiştir.`; const newId = db.nextId.notification = (db.nextId.notification || 1); db.nextId.notification = newId + 1; db.notifications.push({ id: newId, site_id: currentSiteId(), apartment_id: d.apartment_id, message: msg, channel, resident_name: resident ? (resident.full_name || resident.username) : '', resident_email: resident ? (resident.email || '') : '', resident_phone: resident ? (resident.phone || '') : '', is_read: false, created_at: new Date().toISOString() }); }); setDB(db); alert(`${unpaid.length} bildirim.`); render(); });
  const sf = document.getElementById('settingsForm');
  if (sf) sf.addEventListener('submit', e => { e.preventDefault(); const fd = new FormData(e.target); const db = getDB(); db.settings.monthlyDuesAmount = parseFloat(fd.get('amount')) || 0; db.settings.autoGenerateDay = Math.min(28, Math.max(1, parseInt(fd.get('day')) || 1)); setDB(db); alert('Kaydedildi.'); render(); });
  const bf = document.getElementById('bankForm');
  if (bf) bf.addEventListener('submit', e => { e.preventDefault(); const fd = new FormData(e.target); const db = getDB(); db.bank = { bank_name: (fd.get('bank_name')||'').trim(), holder: (fd.get('holder')||'').trim(), iban: (fd.get('iban')||'').replace(/\s+/g,'').toUpperCase() }; setDB(db); alert('Kaydedildi.'); render(); });
  const inf = document.getElementById('interestForm');
  if (inf) inf.addEventListener('submit', e => { e.preventDefault(); const fd = new FormData(e.target); const db = getDB(); db.settings.dailyInterestRate = parseFloat(fd.get('rate')) || 0; setDB(db); alert('Kaydedildi.'); render(); });
  const stf = document.getElementById('siteForm');
  if (stf) stf.addEventListener('submit', e => { e.preventDefault(); const fd = new FormData(e.target); const name = (fd.get('name')||'').trim(); if (!name) return; const db = getDB(); const id = db.nextId.site = (db.nextId.site || 1); db.nextId.site = id + 1; db.sites.push({ id, name, address: '' }); setDB(db); render(); });
  const asf = document.getElementById('activeSiteForm');
  if (asf) asf.addEventListener('submit', e => { e.preventDefault(); const fd = new FormData(e.target); const db = getDB(); const sid = currentSiteId(); const site = db.sites.find(s => s.id === sid); if (!site) return; site.name = (fd.get('name') || '').trim(); site.address = (fd.get('address') || '').trim(); setDB(db); alert('Kaydedildi.'); render(); });
  const blkf = document.getElementById('blockForm');
  if (blkf) blkf.addEventListener('submit', e => { e.preventDefault(); const fd = new FormData(e.target); const name = (fd.get('block_name') || '').trim().toUpperCase(); if (!name) return; const db = getDB(); const sid = currentSiteId(); if ((db.blocks || []).find(b => b.site_id === sid && b.name.toUpperCase() === name)) { alert('Bu blok zaten var.'); return; } const newId = db.nextId.block = (db.nextId.block || 1); db.nextId.block = newId + 1; db.blocks.push({ id: newId, site_id: sid, name, created_at: new Date().toISOString() }); setDB(db); alert('Blok eklendi.'); render(); });
  const cpw = document.getElementById('changePwForm');
  if (cpw) cpw.addEventListener('submit', e => { e.preventDefault(); const fd = new FormData(e.target); const errEl = document.getElementById('pwError'); errEl.textContent = ''; const db = getDB(); const me = db.users.find(u => u.id === currentUser().id); if (!me) return; if (me.password !== fd.get('old')) { errEl.textContent = 'Mevcut şifre hatalı.'; return; } if (fd.get('new1') !== fd.get('new2')) { errEl.textContent = 'Eşleşmiyor.'; return; } if (fd.get('new1').length < 4) { errEl.textContent = 'Çok kısa.'; return; } me.password = fd.get('new1'); setDB(db); alert('Güncellendi.'); e.target.reset(); });
  const pf = document.getElementById('projectForm');
  if (pf) pf.addEventListener('submit', e => { e.preventDefault(); const fd = new FormData(e.target); const name = (fd.get('name') || '').trim(); const totalAmount = parseFloat(fd.get('totalAmount')); const shareType = fd.get('shareType'); const installmentCount = parseInt(fd.get('installmentCount')); const startMonth = parseInt(fd.get('startMonth')); const startYear = parseInt(fd.get('startYear')); if (!name || !totalAmount || totalAmount <= 0) { alert('Ad ve tutar zorunlu.'); return; } const db = getDB(); const sid = currentSiteId(); const apts = siteFilter(db.apartments); if (!apts.length) { alert('Daire yok.'); return; } const projId = db.nextId.project = (db.nextId.project || 1); db.nextId.project = projId + 1; db.projects.push({ id: projId, site_id: sid, name, description: (fd.get('description') || '').trim(), totalAmount, shareType, installmentCount, startMonth, startYear, createdAt: new Date().toISOString(), createdBy: currentUser()?.username || '' }); let shares = []; if (shareType === 'equal') { const perApt = totalAmount / apts.length; shares = apts.map(a => ({ apt: a, share: perApt })); } else { const totalArea = apts.reduce((s, a) => s + (Number(a.area) || 0), 0); if (totalArea <= 0) { alert('m² sıfır.'); return; } shares = apts.map(a => ({ apt: a, share: (Number(a.area) || 0) / totalArea * totalAmount })); } let created = 0; shares.forEach(({ apt, share }) => { const perAptInstallment = share / installmentCount; for (let i = 0; i < installmentCount; i++) { let m = startMonth + i; let y = startYear; while (m > 12) { m -= 12; y++; } const exists = db.dues.find(d => d.project_id === projId && d.apartment_id === apt.id && d.month === m && d.year === y); if (exists) continue; db.dues.push({ id: db.nextId.due++, site_id: sid, apartment_id: apt.id, month: m, year: y, amount: Number(perAptInstallment.toFixed(2)), is_paid: false, paid_at: null, category: 'proje', project_id: projId, description: `${name}${installmentCount > 1 ? ' (' + (i+1) + '/' + installmentCount + ')' : ''}` }); created++; } }); setDB(db); alert(`Proje oluşturuldu. ${created} borç.`); render(); });
  const annf = document.getElementById('announcementForm');
  if (annf) annf.addEventListener('submit', e => { e.preventDefault(); const fd = new FormData(e.target); const category = fd.get('category'); const title = (fd.get('title') || '').trim(); const message = (fd.get('message') || '').trim(); const expiresAt = fd.get('expires_at'); const publishAt = fd.get('publish_at'); const isPinned = fd.get('is_pinned') === 'on'; if (!message) { alert('Mesaj zorunlu.'); return; } const db = getDB(); const sid = currentSiteId(); const newId = db.nextId.announcement = (db.nextId.announcement || 1); db.nextId.announcement = newId + 1; const isScheduled = publishAt && new Date(publishAt) > new Date(); db.announcements.push({ id: newId, site_id: sid, category, title, message, is_pinned: isPinned, publish_at: publishAt ? new Date(publishAt).toISOString() : null, expires_at: expiresAt ? new Date(expiresAt).toISOString() : null, created_at: new Date().toISOString(), created_by: currentUser()?.username || '', attachments: [] }); if (!isScheduled) { const catInfo = ANNOUNCEMENT_CATEGORIES.find(c => c.key === category) || { label: 'Duyuru', icon: '📢' }; const recipients = (db.users || []).filter(u => u.site_id === sid && (u.role === 'resident' || u.role === 'tenant')); recipients.forEach(u => { if (!isNotificationEnabled(u.id, 'announcement')) return; const notifId = db.nextId.notification = (db.nextId.notification || 1); db.nextId.notification = notifId + 1; db.notifications.push({ id: notifId, site_id: sid, apartment_id: u.apartment_id || null, type: 'announcement', announcement_id: newId, message: `${catInfo.icon} ${catInfo.label}: ${title || message.substring(0, 80)}`, channel: 'app', resident_name: u.full_name || u.username, resident_email: u.email || '', resident_phone: u.phone || '', is_read: false, created_at: new Date().toISOString() }); }); } setDB(db); alert(isScheduled ? 'Zamanlandı.' : 'Yayınlandı.'); render(); });
}
