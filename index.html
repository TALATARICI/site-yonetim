function initDB() {

function getDB() {
  let raw = localStorage.getItem(DB_KEY);
  if (!raw) { const db = initDB(); localStorage.setItem(DB_KEY, JSON.stringify(db)); return db; }
  const db = JSON.parse(raw);
  if (!db.sites) { db.sites = [{ id: 1, name: 'Ana Site', address: '' }]; db.nextId = db.nextId || {}; db.nextId.site = 2; }
  ['cashMovements','paymentRequests','extraIncomes','importedTransactions','senderAliases','heatBills','budgets','heatVendorTemplates','meterHistory','tenantHistory','contactHistory','projects','partialPayments','projectFiles','announcements','announcementReads','announcementLikes','announcementComments','announcementTemplates','notificationPrefs','blocks'].forEach(t => {
    if (!db[t]) db[t] = [];
  });
  if (!db.siteLogos) db.siteLogos = {};
  if (!db.bank) db.bank = { iban: '', holder: '', bank_name: '' };
  if (!db.settings) db.settings = {};
  const s = db.settings;
  if (s.monthlyDuesAmount === undefined) s.monthlyDuesAmount = 500;
  if (s.autoGenerateDay === undefined) s.autoGenerateDay = 1;
  if (s.lastAutoRun === undefined) s.lastAutoRun = null;
  if (s.dailyInterestRate === undefined) s.dailyInterestRate = 0.001;
  if (s.tufeRate === undefined) s.tufeRate = 0;
  if (s.ufeRate === undefined) s.ufeRate = 0;
  if (s.rentReminderDay === undefined) s.rentReminderDay = 5;
  if (s.rentReminderLastRun === undefined) s.rentReminderLastRun = null;
  if (s.heatReminderDay === undefined) s.heatReminderDay = 10;
  if (s.heatReminderLastRun === undefined) s.heatReminderLastRun = null;
  if (s.ownerReminderDay === undefined) s.ownerReminderDay = 15;
  if (s.ownerReminderLastRun === undefined) s.ownerReminderLastRun = null;
  if (s.maxFileSizeMB === undefined) s.maxFileSizeMB = 3;

  (db.extraIncomes || []).forEach(x => {
    if (x.tenant_name === undefined) x.tenant_name = '';
    if (x.contract_start === undefined) x.contract_start = null;
    if (x.contract_end === undefined) x.contract_end = null;
    if (x.tenant_user_id === undefined) x.tenant_user_id = null;
  });
  (db.apartments || []).forEach(a => {
    if (a.meter_no === undefined) a.meter_no = '';
    if (a.owner_phone === undefined) a.owner_phone = '';
    if (a.owner_email === undefined) a.owner_email = '';
    if (a.is_rented === undefined) a.is_rented = false;
    if (a.tenant_name === undefined) a.tenant_name = '';
    if (a.tenant_phone === undefined) a.tenant_phone = '';
    if (a.tenant_email === undefined) a.tenant_email = '';
  });

  ['apartments','users','dues','expenses','notifications','cashMovements','paymentRequests','extraIncomes','heatBills','budgets','importedTransactions','senderAliases','heatVendorTemplates','meterHistory','blocks','tenantHistory','contactHistory','projects','partialPayments','projectFiles','announcements','announcementReads','announcementLikes','announcementComments','announcementTemplates','notificationPrefs'].forEach(t => {
    (db[t]||[]).forEach(x => { if (x.site_id === undefined) x.site_id = 1; });
  });

  if (!db._templatesSeeded) {
    const existing = (db.announcementTemplates || []).filter(t => t.site_id === 1);
    if (!existing.length) {
      const defaults = [
        { name: 'Su Kesintisi', category: 'kesinti', title: 'Su Kesintisi Bildirimi', message: 'Değerli sakinler,\n\n__TARİH__ tarihinde __SAAT__ saatleri arasında su kesintisi yaşanacaktır.\n\nSaygılarımızla,\nSite Yönetimi' },
        { name: 'Asansör Bakımı', category: 'bakim', title: 'Asansör Periyodik Bakımı', message: 'Değerli sakinler,\n\nAsansörümüzün periyodik bakımı nedeniyle __TARİH__ tarihinde __SAAT__ saatleri arasında asansör hizmet veremeyecektir.\n\nSite Yönetimi' },
        { name: 'Genel Toplantı', category: 'toplanti', title: 'Olağan Genel Kurul', message: 'Değerli kat malikleri,\n\n__TARİH__ saat __SAAT__\'te olağan genel kurul toplantımız yapılacaktır.\n\nSite Yönetimi' },
        { name: 'Acil Uyarı', category: 'acil', title: 'Acil Durum', message: '🚨 ACİL DUYURU\n\n__MESAJ__\n\nLütfen gerekli önlemleri alınız.\n\nSite Yönetimi' },
        { name: 'Bayram Kutlaması', category: 'etkinlik', title: 'Bayram Kutlaması', message: 'Değerli sakinler,\n\nBayramınız kutlu olsun!\n\nSite Yönetimi' }
      ];
      defaults.forEach(d => {

        db.nextId.announcementTemplate = id + 1;
        db.announcementTemplates.push({ id, site_id: 1, ...d, created_at: new Date().toISOString() });
      });
    }
    db._templatesSeeded = true;
    setDB(db);
  }

  return db;
}
function setDB(db) { localStorage.setItem(DB_KEY, JSON.stringify(db)); }
function resetDB() {
  if (!confirm('Tüm veriler sıfırlansın mı?')) return;
  localStorage.removeItem(DB_KEY);
  localStorage.removeItem(SESSION_KEY);
  sessionStorage.clear();
  render();
}

/* ============================================================
   OTURUM / SİTE
============================================================ */
function getSession() { const s = localStorage.getItem(SESSION_KEY); return s ? JSON.parse(s) : null; }
function setSession(u) {
  if (u) localStorage.setItem(SESSION_KEY, JSON.stringify({ id: u.id }));
  else localStorage.removeItem(SESSION_KEY);
}
function currentUser() {
  const s = getSession(); if (!s) return null;
  return getDB().users.find(u => u.id === s.id) || null;
}
function currentSiteId() {
  const u = currentUser(); if (!u) return null;
  if (u.role === 'resident' || u.role === 'tenant') return u.site_id;
  return parseInt(sessionStorage.getItem('activeSiteId')) || u.site_id || null;
}
function activeSite() {
  const id = currentSiteId(); if (!id) return null;
  return getDB().sites.find(s => s.id === id) || null;
}
function switchSite(siteId) { sessionStorage.setItem('activeSiteId', siteId); render(); }
function siteFilter(arr) {
  const sid = currentSiteId();
  return (arr || []).filter(x => x.site_id === sid);
}
function getSiteLogo(siteId) {
  const db = getDB();
  const id = siteId || currentSiteId();
  return (db.siteLogos || {})[id] || null;
}

/* ============================================================
   YARDIMCILAR
============================================================ */
function money(n) { return (Number(n)||0).toFixed(2) + ' ₺'; }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function aptLabel(a) { return a ? ((a.block||'') + '-' + a.number).replace(/^-/,'') : '-'; }
function getMaxFileSize() {
  const db = getDB();
  const mb = (db.settings && db.settings.maxFileSizeMB) || 3;
  return mb * 1024 * 1024;
}

function getNotificationPrefs(userId) {
  const db = getDB();
  const existing = (db.notificationPrefs || []).find(p => p.user_id === userId);
  if (existing) return existing;
  return { user_id: userId, disabled: [] };
}
function isNotificationEnabled(userId, type) {
  const prefs = getNotificationPrefs(userId);
  return !(prefs.disabled || []).includes(type);
}

function cashSummary() {
  const db = getDB();
  const sid = currentSiteId();
  const dues = (db.dues||[]).filter(d => d.site_id === sid && d.is_paid);
  const expenses = (db.expenses||[]).filter(e => e.site_id === sid);
  const cm = (db.cashMovements||[]).filter(m => m.site_id === sid);
  const extra = (db.extraIncomes||[]).filter(x => x.site_id === sid);
  const partials = (db.partialPayments||[]).filter(pp => pp.site_id === sid);
  const incomeDue = dues.reduce((s,d) => s + Number(d.amount), 0);
  const expenseTotal = expenses.reduce((s,e) => s + Number(e.amount), 0);
  const manuelIn = cm.filter(m => m.type === 'gelir').reduce((s,m) => s + Number(m.amount), 0);
  const manuelOut = cm.filter(m => m.type === 'gider').reduce((s,m) => s + Number(m.amount), 0);
  const extraIn = extra.reduce((s,x) => s + Number(x.amount), 0);
  const partialIn = partials.reduce((s,pp) => s + Number(pp.amount), 0);
  const income = incomeDue + manuelIn + extraIn + partialIn;
  const expense = expenseTotal + manuelOut;
  return { income, expense, balance: income - expense };
}

function currentMonthStats() {
  const db = getDB();
  const sid = currentSiteId();
  const now = new Date();
  const month = now.getMonth() + 1;
  const year = now.getFullYear();
  const duesThisMonth = (db.dues || []).filter(d => d.site_id === sid && d.month === month && d.year === year);
  const duesPaid = duesThisMonth.filter(d => d.is_paid);
  const duesUnpaid = duesThisMonth.filter(d => !d.is_paid);
  const expensesThisMonth = (db.expenses || []).filter(e => e.site_id === sid && e.month === month && e.year === year);
  const extraThisMonth = (db.extraIncomes || []).filter(x => {
    if (x.site_id !== sid) return false;
    const d = new Date(x.date);
    return d.getMonth() + 1 === month && d.getFullYear() === year;
  });
  return {
    month, year,
    duesTotal: duesThisMonth.reduce((s,d) => s + Number(d.amount), 0),
    duesPaidTotal: duesPaid.reduce((s,d) => s + Number(d.amount), 0),
    duesUnpaidTotal: duesUnpaid.reduce((s,d) => s + Number(d.amount), 0),
    duesPaidCount: duesPaid.length,
    duesUnpaidCount: duesUnpaid.length,
    expensesTotal: expensesThisMonth.reduce((s,e) => s + Number(e.amount), 0),
    expensesCount: expensesThisMonth.length,
    extraTotal: extraThisMonth.reduce((s,x) => s + Number(x.amount), 0),
    extraCount: extraThisMonth.length
  };
}

function recentActivity(limit = 8) {
  const db = getDB();
  const sid = currentSiteId();
  const items = [];
  (db.dues || []).filter(d => d.site_id === sid && d.is_paid && d.paid_at).forEach(d => {
    const apt = db.apartments.find(a => a.id === d.apartment_id);
    items.push({ date: d.paid_at, type: d.category === 'ısı' ? 'heat' : d.category === 'proje' ? 'project' : 'dues',
      label: `${d.category === 'ısı' ? '🔥 Isı' : d.category === 'proje' ? '📋 Proje' : 'Aidat'} ödemesi — ${apt ? aptLabel(apt) : '-'}`,
      amount: Number(d.amount), kind: 'in' });
  });
  (db.expenses || []).filter(e => e.site_id === sid && e.paid_at).forEach(e => {
    items.push({ date: e.paid_at, type: 'expense', label: `Gider — ${e.category}`,
      amount: Number(e.amount), kind: 'out' });
  });
  (db.extraIncomes || []).filter(x => x.site_id === sid).forEach(x => {
    items.push({ date: x.date, type: 'extra',
      label: `${x.category}${x.tenant_name ? ' (' + x.tenant_name + ')' : ''}`,
      amount: Number(x.amount), kind: 'in' });
  });
  (db.paymentRequests || []).filter(p => p.site_id === sid && p.status === 'pending').forEach(p => {
    const apt = db.apartments.find(a => a.id === p.apartment_id);
    items.push({ date: p.created_at, type: 'pending',
      label: `⏳ Onay bekleyen ödeme — ${apt ? aptLabel(apt) : '-'}`,
      amount: Number(p.amount), kind: 'pending' });
  });
  return items.sort((a,b) => new Date(b.date) - new Date(a.date)).slice(0, limit);
}

function last6MonthsKPI() {
  const db = getDB();
  const sid = currentSiteId();
  const now = new Date();
  const months = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    months.push({ year: d.getFullYear(), month: d.getMonth() + 1 });
  }
  return months.map(({ year, month }) => {
    const incDues = (db.dues || []).filter(d => d.site_id === sid && d.is_paid && d.paid_at &&
      new Date(d.paid_at).getFullYear() === year && new Date(d.paid_at).getMonth() + 1 === month)
      .reduce((s,d) => s + Number(d.amount), 0);
    const incExtra = (db.extraIncomes || []).filter(x => x.site_id === sid &&
      new Date(x.date).getFullYear() === year && new Date(x.date).getMonth() + 1 === month)
      .reduce((s,x) => s + Number(x.amount), 0);
    const incManual = (db.cashMovements || []).filter(m => m.site_id === sid && m.type === 'gelir' &&
      new Date(m.date).getFullYear() === year && new Date(m.date).getMonth() + 1 === month)
      .reduce((s,m) => s + Number(m.amount), 0);
    const incPartial = (db.partialPayments || []).filter(pp => pp.site_id === sid &&
      new Date(pp.paid_at).getFullYear() === year && new Date(pp.paid_at).getMonth() + 1 === month)
      .reduce((s,pp) => s + Number(pp.amount), 0);
    const expTotal = (db.expenses || []).filter(e => e.site_id === sid &&
      new Date(e.paid_at || e.created_at).getFullYear() === year &&
      new Date(e.paid_at || e.created_at).getMonth() + 1 === month)
      .reduce((s,e) => s + Number(e.amount), 0);
    const expManual = (db.cashMovements || []).filter(m => m.site_id === sid && m.type === 'gider' &&
      new Date(m.date).getFullYear() === year && new Date(m.date).getMonth() + 1 === month)
      .reduce((s,m) => s + Number(m.amount), 0);
    const income = incDues + incExtra + incManual + incPartial;
    const expense = expTotal + expManual;
    return { label: MONTHS[month-1].substring(0,3) + ' ' + String(year).slice(2), year, month, income, expense, net: income - expense };
  });
}

function expiringContracts(days = 60) {
  const db = getDB();
  const today = new Date();
  const soon = new Date(today.getTime() + days*24*60*60*1000);
  return siteFilter(db.extraIncomes || []).filter(x => {
    if (!x.contract_end || !x.tenant_name) return false;
    const end = new Date(x.contract_end);
    return end >= today && end <= soon;
  }).sort((a,b) => new Date(a.contract_end) - new Date(b.contract_end));
}
function expiredContracts() {
  const db = getDB();
  const today = new Date();
  return siteFilter(db.extraIncomes || []).filter(x => {
    if (!x.contract_end || !x.tenant_name) return false;
    return new Date(x.contract_end) < today;
  });
}

function downloadCSV(filename, rows) {
  const csv = rows.map(row =>
    row.map(cell => {
      const s = String(cell ?? '');
      return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }).join(';')
  ).join('\r\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function parseCSV(text) {
  text = text.replace(/^\uFEFF/, '');
  const firstLine = text.split(/\r?\n/)[0] || '';
  const counts = { ';': (firstLine.match(/;/g)||[]).length, ',': (firstLine.match(/,/g)||[]).length, '\t': (firstLine.match(/\t/g)||[]).length };
  const sep = Object.keys(counts).reduce((a,b) => counts[a] >= counts[b] ? a : b);
  const rows = []; let cur = []; let field = ''; let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQuotes) {
      if (ch === '"') { if (text[i+1] === '"') { field += '"'; i++; } else { inQuotes = false; } }
      else { field += ch; }
    } else {
      if (ch === '"') inQuotes = true;
      else if (ch === sep) { cur.push(field); field = ''; }
      else if (ch === '\r') {}
      else if (ch === '\n') { cur.push(field); rows.push(cur); cur = []; field = ''; }
      else field += ch;
    }
  }
  if (field.length || cur.length) { cur.push(field); rows.push(cur); }
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}

function parseExcel(file, callback) {
  if (typeof XLSX === 'undefined') { alert('Excel kütüphanesi yüklenemedi.'); callback(null); return; }
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = new Uint8Array(ev.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1, raw: false, defval: '' });
      const cleaned = rows.filter(r => r.some(c => String(c).trim() !== ''));
      callback(cleaned);
    } catch (err) {
      console.error(err);
      alert('Excel dosyası okunamadı: ' + err.message);
      callback(null);
    }
  };
  reader.readAsArrayBuffer(file);
}

function readSpreadsheet(file, callback) {
  if (!file) { callback(null); return; }
  const name = file.name.toLowerCase();
  if (name.endsWith('.xlsx') || name.endsWith('.xls')) {
    parseExcel(file, callback);
  } else {
    const reader = new FileReader();
    reader.onload = ev => { callback(parseCSV(ev.target.result)); };
    reader.readAsText(file, 'UTF-8');
  }
}

function runAutoDues() {
  const db = getDB();
  const sid = currentSiteId();
  const s = db.settings || {};
  const day = parseInt(s.autoGenerateDay) || 1;
  const amount = Number(s.monthlyDuesAmount) || 0;
  if (amount <= 0) return;
  const today = new Date();
  if (today.getDate() < day) return;
  const year = today.getFullYear();
  const month = today.getMonth() + 1;
  const key = sid + '-' + year + '-' + String(month).padStart(2,'0');
  if (s.lastAutoRun === key) return;
  siteFilter(db.apartments).forEach(ap => {
    const exists = db.dues.find(d => d.apartment_id === ap.id && d.month === month && d.year === year);
    if (!exists) {
      db.dues.push({ id: db.nextId.due++, site_id: sid, apartment_id: ap.id, month, year, amount, is_paid: false, paid_at: null });
    }
  });
  s.lastAutoRun = key; db.settings = s; setDB(db);
}

function runAutoRentReminders() {
  const db = getDB();
  const sid = currentSiteId();
  const s = db.settings || {};
  const day = parseInt(s.rentReminderDay) || 5;
  if (day <= 0) return;
  const today = new Date();
  if (today.getDate() < day) return;
  const year = today.getFullYear();
  const month = today.getMonth() + 1;
  const key = sid + '-rent-' + year + '-' + String(month).padStart(2,'0');
  if (s.rentReminderLastRun === key) return;
  const tenants = (db.users || []).filter(u => u.site_id === sid && u.role === 'tenant');
  tenants.forEach(t => {
    if (!isNotificationEnabled(t.id, 'rent_reminder')) return;
    const hasPayment = (db.extraIncomes || []).some(x => x.site_id === sid && x.tenant_user_id === t.id &&
      new Date(x.date).getFullYear() === year && new Date(x.date).getMonth() + 1 === month);
    if (hasPayment) return;
    const existing = (db.notifications || []).some(n => n.tenant_user_id === t.id && n.type === 'rent_reminder' &&
      new Date(n.created_at).getFullYear() === year && new Date(n.created_at).getMonth() + 1 === month);
    if (existing) return;
    const newId = db.nextId.notification = (db.nextId.notification || 1);
    db.nextId.notification = newId + 1;
    db.notifications.push({
      id: newId, site_id: sid, apartment_id: t.apartment_id || null, tenant_user_id: t.id,
      type: 'rent_reminder',
      message: `${MONTHS[month-1]} ${year} kira ödemeniz henüz bildirilmemiştir.`,
      channel: 'app', resident_name: t.full_name || t.username,
      resident_email: t.email || '', resident_phone: t.phone || '',
      is_read: false, created_at: new Date().toISOString()
    });
  });
  s.rentReminderLastRun = key; db.settings = s; setDB(db);
}

function runScheduledAnnouncements() {
  const db = getDB();
  const sid = currentSiteId();
  const now = new Date();
  let published = 0;
  (db.announcements || []).filter(a => a.site_id === sid && a.publish_at &&
    new Date(a.publish_at) <= now && !a.auto_published).forEach(a => {
    const catInfo = ANNOUNCEMENT_CATEGORIES.find(c => c.key === a.category) || { label: 'Duyuru', icon: '📢' };
    const recipients = (db.users || []).filter(u => u.site_id === sid && (u.role === 'resident' || u.role === 'tenant'));
    recipients.forEach(u => {
      if (!isNotificationEnabled(u.id, 'announcement')) return;
      const notifId = db.nextId.notification = (db.nextId.notification || 1);
      db.nextId.notification = notifId + 1;
      db.notifications.push({
        id: notifId, site_id: sid, apartment_id: u.apartment_id || null,
        type: 'announcement', announcement_id: a.id,
        message: `${catInfo.icon} ${catInfo.label}: ${a.title || a.message.substring(0, 80)}`,
        channel: 'app', resident_name: u.full_name || u.username,
        resident_email: u.email || '', resident_phone: u.phone || '',
        is_read: false, created_at: new Date().toISOString()
      });
    });
    a.auto_published = true;
    published++;
  });
  if (published > 0) setDB(db);
}

function calcDueInterest(due, dailyRate, refDate) {
  if (due.is_paid) return null;
  const dueDate = new Date(due.year, due.month, 0);
  const today = refDate || new Date();
  if (today <= dueDate) return null;
  const days = Math.floor((today - dueDate) / (1000*60*60*24));
  if (days <= 0) return null;
  return { days, dueDate, interest: Number(due.amount) * dailyRate * days };
}

let kpiTrendChartInstance = null;
function drawKpiTrendChart() {
  const el = document.getElementById('kpiTrendChart');
  if (!el || typeof Chart === 'undefined') return;
  if (kpiTrendChartInstance) { kpiTrendChartInstance.destroy(); kpiTrendChartInstance = null; }
  const data = last6MonthsKPI();
  const totalIn = data.reduce((s,d) => s + d.income, 0);
  const totalOut = data.reduce((s,d) => s + d.expense, 0);
  const totalNet = totalIn - totalOut;
  kpiTrendChartInstance = new Chart(el, {
    type: 'line',
    data: { labels: data.map(d => d.label), datasets: [
      { label: 'Gelir', data: data.map(d => d.income), borderColor: '#198754', backgroundColor: 'rgba(25,135,84,.1)', tension: .3, fill: false, borderWidth: 2, pointRadius: 4 },
      { label: 'Gider', data: data.map(d => d.expense), borderColor: '#dc3545', backgroundColor: 'rgba(220,53,69,.1)', tension: .3, fill: false, borderWidth: 2, pointRadius: 4 },
      { label: 'Net', data: data.map(d => d.net), borderColor: '#0d6efd', borderDash: [5,5], tension: .3, fill: false, borderWidth: 2, pointRadius: 4 }
    ]},
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'top' }, tooltip: { callbacks: { label: ctx => `${ctx.dataset.label}: ${money(ctx.raw)}` } } },
      scales: { y: { beginAtZero: true } } }
  });
  const summaryEl = document.getElementById('kpiTrendSummary');
  if (summaryEl) summaryEl.innerHTML = `6 aylık toplam: <b class="text-success">+${money(totalIn)}</b> gelir · <b class="text-danger">−${money(totalOut)}</b> gider · <b class="${totalNet >= 0 ? 'text-success' : 'text-danger'}">${money(totalNet)}</b> net`;
}

function copyIban(iban) {
  navigator.clipboard.writeText(iban).then(() => alert('IBAN kopyalandı: ' + iban), () => alert('Kopyalanamadı.'));
}
function copyText(txt) {
  navigator.clipboard.writeText(txt).then(() => alert('Kopyalandı: ' + txt.substring(0, 100)), () => alert('Kopyalanamadı.'));
}

let pendingAreaUpdate = null;
function openBulkAreaModal() {
  pendingAreaUpdate = null;
  const existing = document.getElementById('bulkAreaModal');
  if (existing) existing.remove();
  const modal = document.createElement('div');
  modal.id = 'bulkAreaModal';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
  modal.onclick = e => { if (e.target === modal) modal.remove(); };
  modal.innerHTML = `<div style="background:white;border-radius:8px;max-width:800px;width:100%;max-height:90vh;overflow:auto;padding:20px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="mb-0">📥 Toplu m² / Sayaç No Yükle</h5>
      <button class="btn btn-sm btn-outline-secondary" onclick="document.getElementById('bulkAreaModal').remove()">Kapat</button>
    </div>
    <div class="alert alert-light border small">CSV/Excel'de <b>Daire</b>, <b>m²</b>, <b>Sayaç No</b> sütunları olmalı. Boş hücreler <b>değiştirilmez</b>.</div>
    <input type="file" id="bulkAreaFile" accept=".csv,.xlsx,.xls,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" class="form-control">
    <div id="bulkAreaPreview" class="mt-3"></div>
  </div>`;
  document.body.appendChild(modal);
  document.getElementById('bulkAreaFile').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) { alert('Dosya 5 MB\'dan büyük.'); return; }
    readSpreadsheet(file, rows => {
      if (!rows || rows.length < 2) { alert('Dosya boş.'); return; }
      const headers = rows[0];
      let colApt = -1, colArea = -1, colMeter = -1;
      headers.forEach((h, i) => {
        const u = String(h).toUpperCase().replace(/\s/g,'');
        if (colApt < 0 && (u.includes('DAİRE') || u.includes('DAIRE'))) colApt = i;
        if (colArea < 0 && (u === 'M²' || u === 'M2' || u.includes('METREKARE') || u.includes('AREA'))) colArea = i;
        if (colMeter < 0 && (u.includes('SAYAÇ') || u.includes('SAYAC') || u.includes('METER') || u.includes('SERIAL'))) colMeter = i;
      });
      if (colApt < 0) { alert('"Daire" sütunu bulunamadı.'); return; }
      if (colArea < 0 && colMeter < 0) { alert('"m²" veya "Sayaç No" sütunu gerekli.'); return; }
      const db = getDB();
      const apts = siteFilter(db.apartments);
      const updates = []; const errors = [];
      rows.slice(1).forEach((r, idx) => {
        const daireRaw = String(r[colApt] || '').trim();
        if (!daireRaw) return;
        const norm = daireRaw.toUpperCase().replace(/\s/g, '');
        let apt = apts.find(a => aptLabel(a).toUpperCase() === norm);
        if (!apt) apt = apts.find(a => String(a.number) === norm);
        if (!apt) { const m = norm.match(/^([A-Z])[-/]?(\d+)$/); if (m) apt = apts.find(a => (a.block||'').toUpperCase() === m[1] && String(a.number) === m[2]); }
        if (!apt) { errors.push(`Satır ${idx+2}: Daire yok (${daireRaw})`); return; }
        const areaRaw = colArea >= 0 ? String(r[colArea] || '').trim().replace(',', '.') : '';
        const area = areaRaw ? parseFloat(areaRaw) : null;
        if (areaRaw && (!isFinite(area) || area < 0)) { errors.push(`Satır ${idx+2}: m² geçersiz`); return; }
        const meter = colMeter >= 0 ? String(r[colMeter] || '').trim() : '';
        updates.push({ apt, area, meter });
      });
      pendingAreaUpdate = { updates, errors, total: rows.length - 1 };
      showBulkAreaPreview();
    });
  });
}
function showBulkAreaPreview() {
  const p = pendingAreaUpdate;
  const rows = p.updates.map(u => {
    const before = `m²: ${u.apt.area || '-'} · Sayaç: ${u.apt.meter_no || '-'}`;
    const after = `m²: ${u.area !== null ? u.area : (u.apt.area || '-')} · Sayaç: ${u.meter || (u.apt.meter_no || '-')}`;
    return `<tr><td><b>${aptLabel(u.apt)}</b></td><td class="small text-muted">${before}</td><td class="small text-success">→ ${after}</td></tr>`;
  }).join('');
  const errBlock = p.errors.length ? `<div class="alert alert-warning small"><b>⚠ ${p.errors.length} satır atlanacak:</b><ul class="mb-0">${p.errors.map(e => `<li>${esc(e)}</li>`).join('')}</ul></div>` : '';
  document.getElementById('bulkAreaPreview').innerHTML = `
    ${errBlock}
    <div class="alert alert-info"><b>${p.updates.length}</b> daire güncellenecek.</div>
    <div class="table-responsive-wrap" style="max-height:400px;"><table class="table table-sm table-striped">
      <thead><tr><th>Daire</th><th>Mevcut</th><th>Yeni</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="3" class="text-muted">Güncellenecek satır yok.</td></tr>'}</tbody>
    </table></div>
    <div class="d-flex gap-2 mt-3">
      <button class="btn btn-secondary" onclick="document.getElementById('bulkAreaModal').remove()">Vazgeç</button>
      <button class="btn btn-success flex-grow-1" onclick="commitBulkArea()" ${!p.updates.length ? 'disabled' : ''}>✅ ${p.updates.length} Daireyi Güncelle</button>
    </div>`;
}
function commitBulkArea() {
  if (currentUser()?.role !== 'admin') { alert('Yetkiniz yok.'); return; }
  const p = pendingAreaUpdate;
  if (!p || !p.updates.length) return;
  const db = getDB();
  let updated = 0;
  p.updates.forEach(u => {
    const apt = db.apartments.find(a => a.id === u.apt.id);
    if (!apt) return;
    if (u.area !== null) apt.area = u.area;
    if (u.meter && u.meter !== apt.meter_no) {
      const oldMeter = apt.meter_no || '';
      apt.meter_no = u.meter;
      const newId = db.nextId.meterHistory = (db.nextId.meterHistory || 1);
      db.nextId.meterHistory = newId + 1;
      db.meterHistory.push({ id: newId, site_id: currentSiteId(), apartment_id: apt.id, old_meter: oldMeter, new_meter: u.meter, source: 'toplu', changed_by: currentUser()?.username || '', changed_at: new Date().toISOString() });
      const resident = db.users.find(u2 => u2.role === 'resident' && u2.apartment_id === apt.id);
      if (resident && isNotificationEnabled(resident.id, 'meter_change')) {
        const notifId = db.nextId.notification = (db.nextId.notification || 1);
        db.nextId.notification = notifId + 1;
        db.notifications.push({ id: notifId, site_id: currentSiteId(), apartment_id: apt.id, type: 'meter_change',
          message: `Dairenizin ısı pay ölçer numarası değiştirildi. Eski: ${oldMeter || '-'} → Yeni: ${u.meter || '-'}`,
          channel: 'app', resident_name: resident.full_name || resident.username, resident_email: resident.email || '', resident_phone: resident.phone || '',
          is_read: false, created_at: new Date().toISOString() });
      }
    }
    updated++;
  });
  setDB(db);
  document.getElementById('bulkAreaModal')?.remove();
  pendingAreaUpdate = null;
  alert(`${updated} daire güncellendi.`);
  render();
}

function renderDues(user) {
  const db = getDB();
  const ro = user.role === 'inspector';
  const fMonth = sessionStorage.getItem('duesFilterMonth') || '';
  const fYear  = sessionStorage.getItem('duesFilterYear')  || '';
  const fStatus = sessionStorage.getItem('duesFilterStatus') || '';
  const fApartment = sessionStorage.getItem('duesFilterApartment') || '';
  const fCategory = sessionStorage.getItem('duesFilterCategory') || '';

  let filtered = siteFilter(db.dues);
  if (fMonth)  filtered = filtered.filter(d => d.month === parseInt(fMonth));
  if (fYear)   filtered = filtered.filter(d => d.year  === parseInt(fYear));
  if (fStatus === 'paid')   filtered = filtered.filter(d => d.is_paid);
  if (fStatus === 'unpaid') filtered = filtered.filter(d => !d.is_paid);
  if (fApartment) filtered = filtered.filter(d => d.apartment_id === parseInt(fApartment));
  if (fCategory === 'aidat') filtered = filtered.filter(d => !d.category || d.category === 'aidat');
  if (fCategory === 'ısı') filtered = filtered.filter(d => d.category === 'ısı');
  if (fCategory === 'proje') filtered = filtered.filter(d => d.category === 'proje');

  const sorted = [...filtered].sort((a,b) => a.apartment_id - b.apartment_id || a.year - b.year || a.month - b.month);

  const rows = sorted.map(d => {
    const apt = db.apartments.find(a => a.id === d.apartment_id);
    const partials = (db.partialPayments || []).filter(pp => pp.due_id === d.id);
    const partialTotal = partials.reduce((s,pp) => s + Number(pp.amount), 0);
    const remaining = Number(d.amount) - partialTotal;
    return `<tr>
      <td>${apt ? aptLabel(apt) : '-'}</td>
      <td>${MONTHS[d.month-1]} ${d.year}

    <div class="card mb-3"><div class="card-body">

        <h6>Tüm Dairelere Toplu Aidat</h6>
        <form id="bulkDueForm" class="row g-2">
          <div class="col-md-4"><select name="month" class="form-select" required>${monOpts}</select></div>

          <div class="col-md-3"><input name="amount" type="number" step="0.01" class="form-control" placeholder="₺" required></div>

}
function toggleDue(id) {
  const db = getDB();
  const d = db.dues.find(x => x.id === id);
  if (!d) return;
  if (!d.is_paid) {
    const answer = prompt('Ödeme tarihi (YYYY-AA-GG). Boş = bugün:', new Date().toISOString().slice(0,10));
    if (answer === null) return;
    d.is_paid = true;
    d.paid_at = answer ? new Date(answer).toISOString() : new Date().toISOString();
  } else { d.is_paid = false; d.paid_at = null; }
  setDB(db); render();
}
function bulkPayAll() {
  const fMonth = sessionStorage.getItem('duesFilterMonth') || '';
  const fYear  = sessionStorage.getItem('duesFilterYear')  || '';
  const fStatus = sessionStorage.getItem('duesFilterStatus') || '';
  const fApartment = sessionStorage.getItem('duesFilterApartment') || '';
  const db = getDB();
  let targets = siteFilter(db.dues).filter(d => !d.is_paid);
  if (fMonth) targets = targets.filter(d => d.month === parseInt(fMonth));
  if (fYear)  targets = targets.filter(d => d.year  === parseInt(fYear));
  if (fApartment) targets = targets.filter(d => d.apartment_id === parseInt(fApartment));
  if (fStatus === 'paid') return;
  if (!targets.length) { alert('Filtreye uyan ödenmemiş kayıt yok.'); return; }
  if (!confirm(`${targets.length} aidat "ödendi" işaretlenecek.`)) return;
  const now = new Date().toISOString();
  targets.forEach(d => { d.is_paid = true; d.paid_at = now; });
  setDB(db); render();
}
function bulkUnpayAll() {
  const fMonth = sessionStorage.getItem('duesFilterMonth') || '';
  const fYear  = sessionStorage.getItem('duesFilterYear')  || '';
  const fStatus = sessionStorage.getItem('duesFilterStatus') || '';
  const fApartment = sessionStorage.getItem('duesFilterApartment') || '';
  const db = getDB();
  let targets = siteFilter(db.dues).filter(d => d.is_paid);
  if (fMonth) targets = targets.filter(d => d.month === parseInt(fMonth));
  if (fYear)  targets = targets.filter(d => d.year  === parseInt(fYear));
  if (fApartment) targets = targets.filter(d => d.apartment_id === parseInt(fApartment));
  if (fStatus === 'unpaid') return;
  if (!targets.length) { alert('Filtreye uyan ödenmiş kayıt yok.'); return; }
  if (!confirm(`${targets.length} aidat "ödenmedi" işaretlenecek.`)) return;
  targets.forEach(d => { d.is_paid = false; d.paid_at = null; });
  setDB(db); render();
}
function uploadReceipt(dueId, file) {
  if (!file) return;
  if (file.size > getMaxFileSize()) { alert('Dosya limiti aşıldı.'); return; }
  const reader = new FileReader();
  reader.onload = ev => {
    const db = getDB();
    const d = db.dues.find(x => x.id === dueId);
    if (!d) return;
    d.receipt = { name: file.name, type: file.type, data: ev.target.result, uploaded_at: new Date().toISOString() };
    try { setDB(db); } catch (err) { alert('Depolama sınırı aşıldı.'); return; }
    render();
  };
  reader.readAsDataURL(file);
}
function viewReceipt(dueId) {
  const db = getDB();
  const d = db.dues.find(x => x.id === dueId);
  if (!d || !d.receipt) return;
  if (d.receipt.type === 'application/pdf') {
    const w = window.open();
    w.document.write(`<iframe src="${d.receipt.data}" style="border:0;width:100%;height:100vh"></iframe>`);
    return;
  }
  const m = document.createElement('div');
  m.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
  m.onclick = e => { if (e.target === m) m.remove(); };
  m.innerHTML = `<div style="background:white;padding:12px;border-radius:8px;"><button class="btn btn-sm btn-outline-secondary mb-2" onclick="this.parentElement.parentElement.remove()">Kapat</button><img src="${d.receipt.data}" style="max-width:85vw;max-height:80vh;display:block;"></div>`;
  document.body.appendChild(m);
}
function removeReceipt(dueId) {
  if (!confirm('Dekont silinsin mi?')) return;
  const db = getDB();
  const d = db.dues.find(x => x.id === dueId);
  if (!d) return;
  delete d.receipt;
  setDB(db); render();
}
function downloadReceipt(dueId) {
  const db = getDB();
  const d = db.dues.find(x => x.id === dueId);
  if (!d) return;
  const apt = db.apartments.find(a => a.id === d.apartment_id);
  const resident = db.users.find(u => u.role === 'resident' && u.apartment_id === d.apartment_id);
  if (!d.is_paid && !confirm('Bu aidat ödenmemiş. Yine de makbuz?')) return;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a5' });
  doc.setDrawColor(200); doc.rect(5, 5, 138, 200);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(16);
  doc.text('AIDAT MAKBUZU', 74, 20, { align: 'center' });
  doc.setFontSize(9); doc.setFont('helvetica', 'normal');
  doc.text(activeSite()?.name || 'Site Yönetimi', 74, 27, { align: 'center' });
  doc.line(15, 32, 133, 32);
  doc.setFontSize(10); let y = 45;
  const line = (label, value) => { doc.setFont('helvetica','bold'); doc.text(label, 15, y); doc.setFont('helvetica','normal'); doc.text(String(value), 60, y); y += 10; };
  line('Makbuz No:', 'MKZ-' + String(d.id).padStart(5,'0'));
  line('Daire:', apt ? aptLabel(apt) : '-');
  line('Sakin:', resident ? (resident.full_name || resident.username) : '-');
  line('Dönem:', `${MONTHS[d.month-1]} ${d.year}`);
  line('Tutar:', money(d.amount));
  line('Durum:', d.is_paid ? 'ÖDENDİ' : 'ÖDENMEDİ');
  line('Ödeme Tarihi:', d.paid_at ? new Date(d.paid_at).toLocaleDateString('tr-TR') : '-');
  y += 5;
  doc.setFillColor(230,245,233); doc.rect(15, y, 118, 18, 'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(12);
  doc.text('TOPLAM: ' + money(d.amount), 74, y + 12, { align: 'center' });
  doc.save(`makbuz-${apt ? aptLabel(apt) : d.apartment_id}-${d.year}-${String(d.month).padStart(2,'0')}.pdf`);
}
function downloadBulkReceipts() {
  const fMonth = sessionStorage.getItem('duesFilterMonth') || '';
  const fYear  = sessionStorage.getItem('duesFilterYear')  || '';
  if (!fMonth || !fYear) { alert('Lütfen ay ve yıl filtresi seç.'); return; }
  const db = getDB();
  const month = parseInt(fMonth), year = parseInt(fYear);
  const dues = siteFilter(db.dues).filter(d => d.month === month && d.year === year && d.is_paid).sort((a,b) => a.apartment_id - b.apartment_id);
  if (!dues.length) { alert('Ödenmiş aidat yok.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a5' });
  let firstPage = true;
  dues.forEach(d => {
    if (!firstPage) doc.addPage(); firstPage = false;
    const apt = db.apartments.find(a => a.id === d.apartment_id);
    const resident = db.users.find(u => u.role === 'resident' && u.apartment_id === d.apartment_id);
    doc.setDrawColor(200); doc.rect(5, 5, 138, 200);
    doc.setFont('helvetica','bold'); doc.setFontSize(16);
    doc.text('AIDAT MAKBUZU', 74, 20, { align: 'center' });
    doc.setFontSize(9); doc.setFont('helvetica','normal');
    doc.text(activeSite()?.name || 'Site Yönetimi', 74, 27, { align: 'center' });
    doc.line(15, 32, 133, 32);
    doc.setFontSize(10); let y = 45;
    const line = (label, value) => { doc.setFont('helvetica','bold'); doc.text(label, 15, y); doc.setFont('helvetica','normal'); doc.text(String(value), 60, y); y += 10; };
    line('Makbuz No:', 'MKZ-' + String(d.id).padStart(5,'0'));
    line('Daire:', apt ? aptLabel(apt) : '-');
    line('Sakin:', resident ? (resident.full_name || resident.username) : '-');
    line('Dönem:', `${MONTHS[d.month-1]} ${d.year}`);
    line('Tutar:', money(d.amount));
    line('Durum:', 'ÖDENDİ');
    line('Ödeme Tarihi:', d.paid_at ? new Date(d.paid_at).toLocaleDateString('tr-TR') : '-');
    y += 5; doc.setFillColor(230,245,233); doc.rect(15, y, 118, 18, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(12);
    doc.text('TOPLAM: ' + money(d.amount), 74, y + 12, { align: 'center' });
  });
  doc.save(`makbuzlar-${year}-${String(month).padStart(2,'0')}.pdf`);
}
function exportDuesCSV() {
  const db = getDB();
  const rows = [
    [`${activeSite()?.name || 'Site'} — Aidatlar`],
    [`Dışa aktarma: ${new Date().toLocaleString('tr-TR')}`],
    [],
    ['Daire','Blok','No','Dönem','Ay','Yıl','Tutar (TL)','Kısmi Ödenen (TL)','Kalan (TL)','Durum','Ödeme Tarihi','Dekont']
  ];
  siteFilter(db.dues).sort((a,b) => a.apartment_id - b.apartment_id || a.year - b.year || a.month - b.month)
    .forEach(d => {
      const apt = db.apartments.find(a => a.id === d.apartment_id);
      const partials = (db.partialPayments || []).filter(pp => pp.due_id === d.id);
      const partialTotal = partials.reduce((s,pp) => s + Number(pp.amount), 0);
      const remaining = Number(d.amount) - partialTotal;
      rows.push([
        apt ? aptLabel(apt) : '-', apt ? (apt.block||'') : '', apt ? apt.number : '',
        `${MONTHS[d.month-1]} ${d.year}`, MONTHS[d.month-1], d.year,
        Number(d.amount).toFixed(2),
        partialTotal > 0 ? partialTotal.toFixed(2) : '',
        partialTotal > 0 && !d.is_paid ? remaining.toFixed(2) : '',
        d.is_paid ? 'Ödendi' : (partialTotal > 0 ? 'Kısmi' : 'Ödenmedi'),
        d.paid_at ? new Date(d.paid_at).toLocaleDateString('tr-TR') : '',
        d.receipt ? 'Var (' + d.receipt.name + ')' : 'Yok'
      ]);
    });
  downloadCSV(`aidatlar-${new Date().toISOString().slice(0,10)}.csv`, rows);
}

function saveNotificationPrefs() {
  const user = currentUser();
  if (!user) return;
  const toggles = document.querySelectorAll('.notif-pref-toggle');

  toggles.forEach(t => { if (!t.checked) disabled.push(t.dataset.key); });
  const db = getDB();
  let prefs = (db.notificationPrefs || []).find(p => p.user_id === user.id);
  if (!prefs) {
    const newId = db.nextId.notificationPref = (db.nextId.notificationPref || 1);
    db.nextId.notificationPref = newId + 1;
    prefs = { id: newId, user_id: user.id, disabled: [] };
    db.notificationPrefs.push(prefs);
  }
  prefs.disabled = disabled;
  prefs.updated_at = new Date().toISOString();
  setDB(db);
  document.getElementById('notifPrefsModal')?.remove();
  alert('Tercihler kaydedildi.');
  render();

      </div>
    </form>
  </div>`;
  document.body.appendChild(modal);
  document.getElementById('partialPayRequestForm').addEventListener('submit', e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const amount = parseFloat(fd.get('amount'));
    if (!amount || amount <= 0 || amount > remaining + 0.01) { document.getElementById('partialPayError').textContent = 'Tutar geçersiz.'; return; }
    const file = fd.get('receipt');
    if (file && file.size > getMaxFileSize()) { document.getElementById('partialPayError').textContent = 'Dosya çok büyük.'; return; }
    const proceed = (receiptData) => {
      const db2 = getDB();
      const newId = db2.nextId.paymentRequest = (db2.nextId.paymentRequest || 1);
      db2.nextId.paymentRequest = newId + 1;
      db2.paymentRequests.push({
        id: newId, site_id: currentSiteId(), due_id: dueId, apartment_id: d.apartment_id,
        month: d.month, year: d.year, amount: Number(amount.toFixed(2)),
        method: fd.get('method'), note: (fd.get('note') || '').trim(), kind: 'partial',
        receipt: receiptData, status: 'pending',
        created_at: new Date().toISOString(), user_id: currentUser().id
      });
      setDB(db2); modal.remove();
      alert('Kısmi ödeme bildiriminiz iletildi.');
      render();
    };
    if (!file || !file.size) { proceed(null); return; }
    const reader = new FileReader();
    reader.onload = ev => proceed({ name: file.name, type: file.type, data: ev.target.result });
    reader.readAsDataURL(file);
  });
}

      id: newId, site_id: currentSiteId(), due_id: dueId, apartment_id: d.apartment_id,

      note: (fd.get('note') || '').trim(), recorded_by: currentUser()?.username || '', created_at: new Date().toISOString()
    });

    const newPrevPaid = newPrevParts.reduce((s,pp) => s + Number(pp.amount), 0);
    const due = db2.dues.find(x => x.id === dueId);
    if (due && newPrevPaid >= Number(due.amount) - 0.01) {

}

function approvePayment(reqId) {
  const db = getDB();
  const req = db.paymentRequests.find(p => p.id === reqId);
  if (!req || req.status !== 'pending') return;
  if (req.kind === 'partial') {
    if (!confirm(`${money(req.amount)} kısmi ödeme onaylanacak.`)) return;
    const newId = db.nextId.partialPayment = (db.nextId.partialPayment || 1);
    db.nextId.partialPayment = newId + 1;
    db.partialPayments.push({
      id: newId, site_id: req.site_id, due_id: req.due_id, apartment_id: req.apartment_id,
      amount: Number(req.amount), paid_at: new Date().toISOString(), note: req.note || '',
      recorded_by: currentUser()?.username || '', from_request_id: req.id,
      created_at: new Date().toISOString()
    });
    const due = db.dues.find(d => d.id === req.due_id);
    if (due) {
      const allParts = db.partialPayments.filter(pp => pp.due_id === due.id);
      const totalParts = allParts.reduce((s,pp) => s + Number(pp.amount), 0);
      if (totalParts >= Number(due.amount) - 0.01) {
        due.is_paid = true; due.paid_at = new Date().toISOString();
        if (req.receipt) due.receipt = req.receipt;
      }
    }
    req.status = 'approved'; req.resolved_at = new Date().toISOString();
    setDB(db); render();
    alert('Kısmi ödeme onaylandı.');
    return;
  }
  if (!confirm('Ödeme onaylanacak ve aidat "ödendi" işaretlenecek.')) return;
  const due = db.dues.find(d => d.id === req.due_id);
  if (due) { due.is_paid = true; due.paid_at = new Date().toISOString(); if (req.receipt) due.receipt = req.receipt; }
  req.status = 'approved'; req.resolved_at = new Date().toISOString();
  setDB(db); render();
  alert('Ödeme onaylandı.');
}
function rejectPayment(reqId) {
  const reason = prompt('Red nedeni (opsiyonel):', '');
  if (reason === null) return;
  const db = getDB();
  const req = db.paymentRequests.find(p => p.id === reqId);
  if (!req) return;
  req.status = 'rejected'; req.reject_reason = reason; req.resolved_at = new Date().toISOString();
  setDB(db); render();
  alert('Ödeme reddedildi.');
}
function viewRequestReceipt(reqId) {
  const db = getDB();
  const req = db.paymentRequests.find(p => p.id === reqId);
  if (!req || !req.receipt) return;
  if (req.receipt.type === 'application/pdf') {
    const w = window.open();
    w.document.write(`<iframe src="${req.receipt.data}" style="border:0;width:100%;height:100vh"></iframe>`);
    return;
  }
  const m = document.createElement('div');
  m.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
  m.onclick = e => { if (e.target === m) m.remove(); };
  m.innerHTML = `<div style="background:white;padding:12px;border-radius:8px;"><button class="btn btn-sm btn-outline-secondary mb-2" onclick="this.parentElement.parentElement.remove()">Kapat</button><img src="${req.receipt.data}" style="max-width:85vw;max-height:80vh;display:block;"></div>`;
  document.body.appendChild(m);
}

function calculateInterestPreview() {
  const db = getDB();
  const rate = Number(db.settings.dailyInterestRate) || 0;
  if (rate <= 0) { alert('Önce ayarlardan faiz oranını gir.'); return; }
  const items = [];
  siteFilter(db.dues).forEach(d => {
    const r = calcDueInterest(d, rate);
    if (r) {
      const apt = db.apartments.find(a => a.id === d.apartment_id);
      items.push({ id: d.id, label: `${apt ? aptLabel(apt) : '-'} — ${MONTHS[d.month-1]} ${d.year}`,
        amount: Number(d.amount), days: r.days, interest: r.interest, dueDate: r.dueDate });
    }
  });
  if (!items.length) { alert('Gecikmiş aidat yok.'); return; }
  const existing = document.getElementById('interestModal');
  if (existing) existing.remove();
  const modal = document.createElement('div');
  modal.id = 'interestModal';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
  const totalInt = items.reduce((s,i) => s+i.interest, 0);
  modal.innerHTML = `<div style="background:white;border-radius:8px;max-width:90vw;max-height:90vh;overflow:auto;padding:16px;min-width:600px;">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <h5 class="mb-0">Gecikme Faizi Önizlemesi</h5>
      <button class="btn btn-sm btn-outline-secondary" onclick="document.getElementById('interestModal').remove()">Kapat</button>
    </div>
    <p class="small text-muted">Günlük: <b>${(rate*100).toFixed(3)}%</b></p>
    <table class="table table-sm table-striped">
      <thead><tr><th>Daire / Dönem</th><th class="text-end">Anapara</th><th class="text-end">Vade</th><th class="text-end">Gün</th><th class="text-end">Faiz</th><th class="text-end">Toplam</th></tr></thead>
      <tbody>${items.map(i => `<tr><td>${esc(i.label)}</td><td class="text-end">${money(i.amount)}</td><td class="text-end">${i.dueDate.toLocaleDateString('tr-TR')}</td><td class="text-end">${i.days}</td><td class="text-end text-warning">${money(i.interest)}</td><td class="text-end"><b>${money(i.amount + i.interest)}</b></td></tr>`).join('')}</tbody>
      <tfoot><tr><th colspan="4" class="text-end">TOPLAM</th><th class="text-end text-warning">${money(totalInt)}</th><th></th></tr></tfoot>
    </table>
    <div class="d-flex gap-2">
      <button class="btn btn-success" onclick="applyInterest()">✅ Uygula</button>
      <button class="btn btn-outline-secondary" onclick="document.getElementById('interestModal').remove()">Vazgeç</button>
    </div>
  </div>`;
  modal.onclick = e => { if (e.target === modal) modal.remove(); };
  document.body.appendChild(modal);
}
function applyInterest() {
  if (!confirm('Faizler aidatlara eklenecek.')) return;
  const db = getDB();
  const rate = Number(db.settings.dailyInterestRate) || 0;
  let count = 0;
  siteFilter(db.dues).forEach(d => {
    const r = calcDueInterest(d, rate);
    if (r) { d.interest = (Number(d.interest) || 0) + r.interest; d.amount = Number(d.amount) + r.interest; count++; }
  });
  setDB(db);
  document.getElementById('interestModal')?.remove();
  alert(`${count} aidata faiz uygulandı.`);
  render();
}

function renderCash(user) {
  const db = getDB();
  const ro = user.role === 'inspector';
  const startStr = sessionStorage.getItem('cashStart') || '';
  const endStr   = sessionStorage.getItem('cashEnd')   || '';
  const startDate = startStr ? new Date(startStr + 'T00:00:00') : null;
  const endDate   = endStr   ? new Date(endStr   + 'T23:59:59') : null;
  const sid = currentSiteId();

  const movements = [];
  siteFilter(db.dues).filter(d => d.is_paid).forEach(d => {
    const apt = db.apartments.find(a => a.id === d.apartment_id);
    const catLabel = d.category === 'ısı' ? '🔥 Isı' : d.category === 'proje' ? '📋 Proje' : 'Aidat';
    movements.push({ source:'aidat', date: d.paid_at || d.created_at,
      label: `${catLabel} — ${apt ? aptLabel(apt) : '-'} (${MONTHS[d.month-1]} ${d.year})${d.imported_from_bank ? ' 🏦' : ''}`,
      type:'gelir', amount: Number(d.amount) });
  });
  siteFilter(db.expenses).forEach(e => movements.push({
    source:'gider', date: e.paid_at || e.created_at,
    label: `Gider — ${e.category}${e.description?' / '+e.description:''}`,
    type:'gider', amount: Number(e.amount) }));
  siteFilter(db.cashMovements).forEach(m => movements.push({
    source:'manuel', id: m.id, date: m.date,
    label: `${m.type==='gelir'?'Gelir':'Gider'} — ${m.description}`,
    type: m.type, amount: Number(m.amount) }));
  siteFilter(db.extraIncomes).forEach(x => movements.push({
    source:'ekstra', id: x.id, date: x.date,
    label: `Ekstra — ${x.category}${x.tenant_name ? ' ('+x.tenant_name+')' : ''}`,
    type:'gelir', amount: Number(x.amount) }));
  (db.partialPayments || []).filter(pp => pp.site_id === sid).forEach(pp => {
    const due = db.dues.find(d => d.id === pp.due_id);
    const apt = due ? db.apartments.find(a => a.id === due.apartment_id) : null;
    const project = due ? (db.projects || []).find(p => p.id === due.project_id) : null;
    movements.push({ source:'kısmi', date: pp.paid_at,
      label: `💸 Kısmi — ${project ? project.name : 'Proje'} · ${apt ? aptLabel(apt) : '-'}${pp.note ? ' (' + pp.note + ')' : ''}`,
      type:'gelir', amount: Number(pp.amount) });
  });
  movements.sort((a,b) => new Date(b.date) - new Date(a.date));

  const inRange = (iso) => {
    const t = new Date(iso).getTime();
    if (startDate && t < startDate.getTime()) return false;
    if (endDate   && t > endDate.getTime())   return false;
    return true;
  };
  const preRange = startDate ? movements.filter(m => new Date(m.date).getTime() < startDate.getTime()) : [];
  const filteredMovements = movements.filter(m => inRange(m.date));
  const openingBalance = preRange.reduce((s,m) => s + (m.type === 'gelir' ? m.amount : -m.amount), 0);
  const totalIn  = filteredMovements.filter(m => m.type === 'gelir').reduce((s,m) => s+m.amount, 0);
  const totalOut = filteredMovements.filter(m => m.type === 'gider').reduce((s,m) => s+m.amount, 0);

  const rows = filteredMovements.map(m => `<tr>
    <td>${new Date(m.date).toLocaleDateString('tr-TR')}</td>
    <td>${esc(m.label)}</td>
    <td><span class="badge bg-${m.source === 'aidat' ? 'success' : m.source === 'gider' ? 'danger' : m.source === 'ekstra' ? 'info' : m.source === 'kısmi' ? 'warning' : 'secondary'}">${m.source}</span></td>
    <td class="${m.type === 'gelir' ? 'text-success' : 'text-danger'}">${m.type === 'gelir' ? '+' : '-'}${money(m.amount)}</td>
    <td>${!ro && (m.source === 'manuel' || m.source === 'ekstra')
      ? `<button class="btn btn-sm btn-outline-danger" onclick="${m.source === 'ekstra' ? 'deleteExtraIncome' : 'deleteMovement'}(${m.id})">Sil</button>`
      : '<span class="text-muted small">-</span>'}</td>
  </tr>`).join('');

  return `

      <small class="text-muted">— ${esc(activeSite()?.name || '')}</small></h3>

    ${(() => {
      const soon = expiringContracts(60);
      if (!soon.length) return '';
      return `<div class="alert alert-info"><b>⏰ ${soon.length} kira sözleşmesi 60 gün içinde sona eriyor.</b>
        <button class="btn btn-sm btn-outline-dark ms-2" onclick="sendRentReminders()">📨 Hatırlatma Gönder</button></div>`;
    })()}

    <div class="card mb-3"><div class="card-body">
      <h6>Dönem Raporu</h6>
      <div class="row g-2 mb-2">
        <div class="col-md-3"><label class="form-label small">Başlangıç</label>
          <input type="date" class="form-control form-control-sm" value="${startStr}"
                 onchange="sessionStorage.setItem('cashStart',this.value);render()"></div>
        <div class="col-md-3"><label class="form-label small">Bitiş</label>
          <input type="date" class="form-control form-control-sm" value="${endStr}"
                 onchange="sessionStorage.setItem('cashEnd',this.value);render()"></div>
        <div class="col-md-3 d-flex align-items-end">
          <button class="btn btn-sm btn-outline-secondary w-100"
                  onclick="sessionStorage.removeItem('cashStart');sessionStorage.removeItem('cashEnd');render()">Sıfırla</button>
        </div>
      </div>
      <div class="row g-3 mt-2">
        <div class="col-md-3"><div class="card text-bg-secondary"><div class="card-body">
          <div class="small">Açılış</div><div class="fs-4">${money(openingBalance)}</div></div></div></div>
        <div class="col-md-3"><div class="card text-bg-success"><div class="card-body">

      <div class="text-end mt-2">

  siteFilter(db.dues).filter(d => d.is_paid).forEach(d => {
    const apt = db.apartments.find(a => a.id === d.apartment_id);

  });
  siteFilter(db.expenses).forEach(e => all.push({ date: e.paid_at || e.created_at, source:'gider', label: `Gider — ${e.category}`, type:'gider', amount: Number(e.amount) }));
  siteFilter(db.cashMovements).forEach(m => all.push({ date: m.date, source:'manuel', label: m.description, type: m.type, amount: Number(m.amount) }));
  siteFilter(db.extraIncomes).forEach(x => all.push({ date: x.date, source:'ekstra', label: `${x.category}${x.tenant_name?' ('+x.tenant_name+')':''}`, type:'gelir', amount: Number(x.amount) }));
  (db.partialPayments || []).filter(pp => pp.site_id === sid).forEach(pp => {
    const due = db.dues.find(d => d.id === pp.due_id);
    const apt = due ? db.apartments.find(a => a.id === due.apartment_id) : null;
    const project = due ? (db.projects || []).find(p => p.id === due.project_id) : null;
    all.push({ date: pp.paid_at, source: 'kısmi', label: `💸 Kısmi — ${project ? project.name : 'Proje'} · ${apt ? aptLabel(apt) : '-'}`, type: 'gelir', amount: Number(pp.amount) });
  });
  const inRange = iso => {
    const t = new Date(iso).getTime();
    if (startDate && t < startDate.getTime()) return false;
    if (endDate   && t > endDate.getTime())   return false;
    return true;
  };
  const filtered = all.filter(m => inRange(m.date)).sort((a,b)=>new Date(a.date)-new Date(b.date));
  const opening = all.filter(m => startDate && new Date(m.date).getTime() < startDate.getTime()).reduce((s,m)=>s+(m.type==='gelir'?m.amount:-m.amount),0);
  const rows = [
    [`${activeSite()?.name || 'Site'} — Kasa Raporu`],
    [`Dönem: ${startStr || 'başlangıç'} → ${endStr || 'bugün'}`],
    [`Açılış: ${opening.toFixed(2)} TL`],
    [],
    ['Tarih','Kaynak','Açıklama','Tür','Tutar (TL)'],
    ...filtered.map(m => [new Date(m.date).toLocaleDateString('tr-TR'), m.source, m.label, m.type, (m.type==='gelir'?'+':'-') + m.amount.toFixed(2)]),
    [],
    ['Dönem Geliri', filtered.filter(m=>m.type==='gelir').reduce((s,m)=>s+m.amount,0).toFixed(2)],
    ['Dönem Gideri', filtered.filter(m=>m.type==='gider').reduce((s,m)=>s+m.amount,0).toFixed(2)],
    ['Kapanış', (opening + filtered.filter(m=>m.type==='gelir').reduce((s,m)=>s+m.amount,0) - filtered.filter(m=>m.type==='gider').reduce((s,m)=>s+m.amount,0)).toFixed(2)]
  ];
  downloadCSV(`kasa-raporu-${startStr||'ilk'}_${endStr||'bugun'}.csv`, rows);
}

  (db.partialPayments || []).filter(pp => pp.site_id === sid).forEach(pp => {
    const due = db.dues.find(d => d.id === pp.due_id);
    const apt = due ? db.apartments.find(a => a.id === due.apartment_id) : null;
    const project = due ? (db.projects || []).find(p => p.id === due.project_id) : null;
    all.push({ date: pp.paid_at, source: 'Kısmi Ödeme', label: `${project ? project.name : 'Proje'} · ${apt ? aptLabel(apt) : '-'}`, type: 'gelir', amount: Number(pp.amount) });
  });
  const inRange = iso => {
    const t = new Date(iso).getTime();
    if (startDate && t < startDate.getTime()) return false;
    if (endDate   && t > endDate.getTime())   return false;
    return true;
  };
  const filtered = all.filter(m => inRange(m.date)).sort((a,b)=>new Date(a.date)-new Date(b.date));
  const opening = all.filter(m => startDate && new Date(m.date).getTime() < startDate.getTime()).reduce((s,m)=>s+(m.type==='gelir'?m.amount:-m.amount),0);
  const totalIn = filtered.filter(m=>m.type==='gelir').reduce((s,m)=>s+m.amount,0);
  const totalOut = filtered.filter(m=>m.type==='gider').reduce((s,m)=>s+m.amount,0);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const pageW = 210, margin = 15;
  let y = 20;
  doc.setFont('helvetica', 'bold'); doc.setFontSize(16);
  doc.text(site.name || 'Site Yönetimi', pageW/2, y, { align: 'center' }); y += 7;
  if (site.address) { doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.text(site.address, pageW/2, y, { align: 'center' }); y += 5; }
  doc.setFont('helvetica', 'bold'); doc.setFontSize(13);
  doc.text('KASA RAPORU', pageW/2, y + 3, { align: 'center' }); y += 10;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
  doc.text(`Dönem: ${startStr || 'başlangıç'} → ${endStr || 'bugün'}`, pageW/2, y, { align: 'center' }); y += 4;
  doc.text(`Rapor: ${new Date().toLocaleString('tr-TR')}`, pageW/2, y, { align: 'center' }); y += 8;
  doc.line(margin, y, pageW - margin, y); y += 6;
  const boxW = (pageW - 2*margin - 9) / 4;
  const boxes = [
    { label: 'Açılış', value: money(opening), color: [108,117,125] },
    { label: 'Gelir', value: '+' + money(totalIn), color: [25,135,84] },
    { label: 'Gider', value: '−' + money(totalOut), color: [220,53,69] },
    { label: 'Kapanış', value: money(opening + totalIn - totalOut), color: [13,110,253] }
  ];
  boxes.forEach((b, i) => {
    const x = margin + i * (boxW + 3);
    doc.setFillColor(...b.color); doc.roundedRect(x, y, boxW, 16, 2, 2, 'F');
    doc.setTextColor(255); doc.setFont('helvetica', 'normal'); doc.setFontSize(7);
    doc.text(b.label, x + boxW/2, y + 5, { align: 'center' });
    doc.setFont('helvetica', 'bold'); doc.setFontSize(10);
    doc.text(b.value, x + boxW/2, y + 12, { align: 'center' });
  });
  doc.setTextColor(0); y += 22;
  const colX = [margin, margin + 20, margin + 45, pageW - margin - 28];
  const drawHeader = () => {
    doc.setFillColor(240,240,240); doc.rect(margin, y - 4, pageW - 2*margin, 7, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(8);
    doc.text('Tarih', colX[0]+1, y); doc.text('Kaynak', colX[1], y); doc.text('Açıklama', colX[2], y);
    doc.text('Tutar', pageW - margin - 1, y, { align: 'right' }); y += 5;
  };
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8);
  drawHeader();
  filtered.forEach(m => {
    if (y > 275) { doc.addPage(); y = 20; drawHeader(); }
    doc.text(new Date(m.date).toLocaleDateString('tr-TR'), colX[0]+1, y);
    doc.setFontSize(7); doc.text(m.source, colX[1], y); doc.setFontSize(8);
    const lines = doc.splitTextToSize(m.label, colX[3] - colX[2] - 3);
    doc.text(lines[0] || '', colX[2], y);
    if (m.type === 'gelir') doc.setTextColor(25,135,84); else doc.setTextColor(220,53,69);
    doc.setFont('helvetica', 'bold');
    doc.text((m.type === 'gelir' ? '+' : '−') + money(m.amount), pageW - margin - 1, y, { align: 'right' });
    doc.setFont('helvetica', 'normal'); doc.setTextColor(0);
    y += 4.5;
  });
  doc.save(`kasa-raporu-${startStr||'ilk'}_${endStr||'bugun'}.pdf`);
}

function renderStats() {
  const db = getDB();
  const allYears = new Set();
  siteFilter(db.dues).forEach(d => allYears.add(d.year));
  siteFilter(db.expenses).forEach(e => allYears.add(e.year));
  if (!allYears.size) allYears.add(new Date().getFullYear());
  const stored = parseInt(sessionStorage.getItem('statsYear'));
  const year = allYears.has(stored) ? stored : [...allYears].sort((a,b)=>b-a)[0];
  const incMap = {}, expMap = {};
  MONTHS.forEach((_,i) => { incMap[i+1]=0; expMap[i+1]=0; });
  siteFilter(db.dues).filter(d => d.year===year && d.is_paid).forEach(d => incMap[d.month] += Number(d.amount));
  siteFilter(db.partialPayments || []).forEach(pp => {
    const dt = new Date(pp.paid_at);
    if (dt.getFullYear() === year) incMap[dt.getMonth() + 1] += Number(pp.amount);
  });
  siteFilter(db.expenses).filter(e => e.year===year).forEach(e => expMap[e.month] += Number(e.amount));
  const incTot = Object.values(incMap).reduce((a,b)=>a+b,0);
  const expTot = Object.values(expMap).reduce((a,b)=>a+b,0);
  const catMap = {};
  siteFilter(db.expenses).filter(e => e.year===year).forEach(e => {
    const k = e.category || 'Diğer';
    catMap[k] = (catMap[k] || 0) + Number(e.amount);
  });
  const extraCatMap = {};
  siteFilter(db.extraIncomes || []).filter(x => new Date(x.date).getFullYear() === year).forEach(x => {
    const k = x.category || 'Diğer';
    extraCatMap[k] = (extraCatMap[k] || 0) + Number(x.amount);
  });
  const extraMatrix = {};
  siteFilter(db.extraIncomes || []).filter(x => new Date(x.date).getFullYear() === year).forEach(x => {
    const k = x.category || 'Diğer';
    const m = new Date(x.date).getMonth() + 1;
    if (!extraMatrix[k]) extraMatrix[k] = Array(12).fill(0);
    extraMatrix[k][m-1] += Number(x.amount);
  });
  const rows = MONTHS.map((m,i) => {
    const inc = incMap[i+1], exp = expMap[i+1];
    return `<tr><td>${m}</td><td class="text-success">${money(inc)}</td><td class="text-danger">${money(exp)}</td><td class="${inc-exp>=0?'text-success':'text-danger'}">${money(inc-exp)}</td></tr>`;
  }).join('');
  setTimeout(() => { drawStatsChart(incMap, expMap); drawCategoryPie(catMap); drawExtraIncomePie(extraCatMap); }, 0);
  return `
    <h3>İstatistikler — ${year} <small class="text-muted">— ${esc(activeSite()?.name || '')}</small></h3>
    <div class="mb-3"><select class="form-select w-auto" onchange="sessionStorage.setItem('statsYear',this.value);render()">
      ${[...allYears].sort((a,b)=>b-a).map(y => `<option value="${y}" ${y===year?'selected':''}>${y}</option>`).join('')}
    </select></div>
    <div class="row g-3 mb-4">
      <div class="col-md-4"><div class="card text-bg-success"><div class="card-body"><div class="small">Yıllık Gelir</div><div class="fs-3">${money(incTot)}</div></div></div></div>
      <div class="col-md-4"><div class="card text-bg-danger"><div class="card-body"><div class="small">Yıllık Gider</div><div class="fs-3">${money(expTot)}</div></div></div></div>
      <div class="col-md-4"><div class="card text-bg-primary"><div class="card-body"><div class="small">Net</div><div class="fs-3">${money(incTot-expTot)}</div></div></div></div>
    </div>
    <h5>Aylık Gelir / Gider Grafiği</h5>
    <div class="card mb-4"><div class="card-body"><div class="chart-wrap"><canvas id="statsChart"></canvas></div></div></div>
    <h5 class="mt-4">Gider Kategorileri (${year})</h5>
    <div class="row">
      <div class="col-md-6"><div class="card"><div class="card-body"><div class="chart-wrap"><canvas id="categoryChart"></canvas></div></div></div></div>
      <div class="col-md-6"><div class="card"><div class="card-body"><table class="table table-sm mb-0">
        <thead><tr><th>Kategori</th><th class="text-end">Tutar</th></tr></thead>
        <tbody>${Object.keys(catMap).length ? Object.entries(catMap).sort((a,b)=>b[1]-a[1]).map(([k,v]) => `<tr><td>${esc(k)}</td><td class="text-end">${money(v)}</td></tr>`).join('') : '<tr><td colspan="2" class="text-muted">Gider yok.</td></tr>'}</tbody>
      </table></div></div></div>
    </div>
    <h5 class="mt-4">Ekstra Gelir Kategorileri (${year})</h5>
    <div class="row">
      <div class="col-md-6"><div class="card"><div class="card-body"><div class="chart-wrap"><canvas id="extraIncomeChart"></canvas></div></div></div></div>
      <div class="col-md-6"><div class="card"><div class="card-body"><table class="table table-sm mb-0">
        <thead><tr><th>Kategori</th><th class="text-end">Tutar</th></tr></thead>
        <tbody>${Object.keys(extraCatMap).length ? Object.entries(extraCatMap).sort((a,b)=>b[1]-a[1]).map(([k,v]) => `<tr><td>${esc(k)}</td><td class="text-end">${money(v)}</td></tr>`).join('') : '<tr><td colspan="2" class="text-muted">Ekstra gelir yok.</td></tr>'}</tbody>
      </table></div></div></div>
    </div>
    <h5 class="mt-4">Ekstra Gelirler — Aylık Takip (${year})</h5>
    <div class="card"><div class="card-body">
      ${Object.keys(extraMatrix).length ? `<div class="table-responsive-wrap"><table class="table table-sm table-bordered mb-0 text-center">
        <thead><tr><th class="text-start">Kategori</th>${MONTHS.map(m => `<th>${m.slice(0,3)}</th>`).join('')}<th>Toplam</th></tr></thead>
        <tbody>${Object.entries(extraMatrix).map(([k, arr]) => {
          const total = arr.reduce((s,v)=>s+v,0);
          return `<tr><td class="text-start fw-bold">${esc(k)}</td>${arr.map(v => `<td class="${v>0?'text-success':''}">${v>0 ? v.toFixed(0) : '-'}</td>`).join('')}<td class="fw-bold text-success">${total.toFixed(2)}</td></tr>`;
        }).join('')}</tbody>
      </table></div>` : '<div class="text-muted text-center py-4">Bu yıl için ekstra gelir yok.</div>'}
    </div></div>
    <h5 class="mt-4">🏘️ Daire Karşılaştırma</h5>
    <div class="card mb-4"><div class="card-body">
      <div class="row g-2 mb-2">
        <div class="col-md-8"><div class="d-flex flex-wrap gap-2">
          ${siteFilter(db.apartments).sort((a,b)=>(a.block||'').localeCompare(b.block||'')||a.number.localeCompare(b.number)).map(a => `<div class="form-check form-check-inline"><input class="form-check-input apt-compare-cb" type="checkbox" value="${a.id}" id="cmpApt${a.id}"><label class="form-check-label small" for="cmpApt${a.id}">${aptLabel(a)}</label></div>`).join('')}

    <h5 class="mt-4">Aylık Dağılım Tablosu</h5>
    <div class="table-responsive-wrap"><table class="table table-bordered bg-white">
      <thead><tr><th>Ay</th><th>Gelir</th><th>Gider</th><th>Net</th></tr></thead>
      <tbody>${rows}</tbody>

let statsChartInstance = null;
function drawStatsChart(incMap, expMap) {
  const el = document.getElementById('statsChart');
  if (!el || typeof Chart === 'undefined') return;
  if (statsChartInstance) { statsChartInstance.destroy(); statsChartInstance = null; }
  statsChartInstance = new Chart(el, {
    type: 'bar',
    data: { labels: MONTHS, datasets: [
      { label: 'Gelir', data: MONTHS.map((_,i)=>incMap[i+1]||0), backgroundColor: '#198754' },
      { label: 'Gider', data: MONTHS.map((_,i)=>expMap[i+1]||0), backgroundColor: '#dc3545' }
    ]},
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { tooltip: { callbacks: { label: ctx => `${ctx.dataset.label}: ${money(ctx.raw)}` } } },
      scales: { y: { beginAtZero: true } } }
  });
}
let categoryChartInstance = null;
function drawCategoryPie(catMap) {
  const el = document.getElementById('categoryChart');
  if (!el || typeof Chart === 'undefined') return;
  if (categoryChartInstance) { categoryChartInstance.destroy(); categoryChartInstance = null; }
  const entries = Object.entries(catMap).sort((a,b)=>b[1]-a[1]);
  if (!entries.length) { el.parentElement.innerHTML = '<div class="text-muted text-center py-5">Gider yok.</div>'; return; }
  const palette = ['#0d6efd','#dc3545','#198754','#ffc107','#6f42c1','#fd7e14','#20c997','#6c757d','#e83e8c','#17a2b8'];
  categoryChartInstance = new Chart(el, {
    type: 'doughnut',
    data: { labels: entries.map(e=>e[0]), datasets: [{ data: entries.map(e=>e[1]), backgroundColor: entries.map((_,i)=>palette[i%palette.length]) }] },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom' }, tooltip: { callbacks: { label: ctx => {
        const total = ctx.dataset.data.reduce((a,b)=>a+b,0);
        const pct = total ? (ctx.raw/total*100).toFixed(1) : 0;
        return `${ctx.label}: ${money(ctx.raw)} (${pct}%)`;
      }}}}}
  });
}

let aptCompareChartInstance = null;
function drawAptCompareChart() {
  const selected = Array.from(document.querySelectorAll('.apt-compare-cb:checked')).map(cb => parseInt(cb.value));
  if (selected.length < 1) { alert('En az 1 daire seç.'); return; }
  if (selected.length > 4) { alert('En fazla 4 daire.'); return; }

  const colors = ['#0d6efd','#dc3545','#198754','#ffc107'];
  const datasets = selected.map((aptId, idx) => {
    const apt = db.apartments.find(a => a.id === aptId);
    if (!apt) return null;
    let data;
    if (type === 'dues') {
      data = MONTHS.map((_, i) => {
        const m = i + 1;
        return siteFilter(db.dues).filter(d => d.apartment_id === aptId && d.month === m && d.year === year && d.category !== 'ısı').reduce((s,d) => s + Number(d.amount), 0);
      });
    } else if (type === 'heat') {
      data = MONTHS.map((_, i) => {
        const m = i + 1;
        return siteFilter(db.dues).filter(d => d.apartment_id === aptId && d.month === m && d.year === year && d.category === 'ısı').reduce((s,d) => s + Number(d.amount), 0);
      });
    } else {
      data = MONTHS.map((_, i) => {
        const m = i + 1;
        const bill = siteFilter(db.heatBills).find(b => b.month === m && b.year === year);
        if (!bill) return 0;
        const item = bill.distribution.find(d => d.apartment_id === aptId);
        return item ? Number(item.pay) : 0;
      });
    }
    return { label: aptLabel(apt), data, borderColor: colors[idx % colors.length], backgroundColor: colors[idx % colors.length] + '30', tension: .3, borderWidth: 2, pointRadius: 4 };
  }).filter(Boolean);
  aptCompareChartInstance = new Chart(el, {
    type: 'line',
    data: { labels: MONTHS, datasets },

      scales: { y: { beginAtZero: true } } }

let siteHeatCmpChartInstance = null;
function drawSiteHeatCompareChart() {
  const year = parseInt(document.getElementById('siteHeatCmpYear')?.value);
  const type = document.getElementById('siteHeatCmpType')?.value || 'pay';
  if (!year) return;
  const db = getDB();
  const el = document.getElementById('siteHeatCompareChart');
  if (!el || typeof Chart === 'undefined') return;
  if (siteHeatCmpChartInstance) { siteHeatCmpChartInstance.destroy(); siteHeatCmpChartInstance = null; }
  const datasets = [];
  const palette = ['#0d6efd','#dc3545','#198754','#ffc107','#6f42c1','#fd7e14','#20c997','#6c757d'];
  const siteStats = [];
  db.sites.forEach((site, idx) => {
    const bills = (db.heatBills || []).filter(b => b.site_id === site.id && b.year === year);
    if (!bills.length) return;
    const monthly = MONTHS.map((_, i) => {
      const bill = bills.find(b => b.month === i + 1);
      if (!bill) return 0;
      if (type === 'pay') return bill.distribution.reduce((s,d) => s + Number(d.pay), 0);
      if (type === 'amount') return Number(bill.totalBill);
      const count = bill.distribution.length || 1;
      return bill.distribution.reduce((s,d) => s + Number(d.pay), 0) / count;
    });
    const total = monthly.reduce((s,v) => s + v, 0);
    if (total === 0) return;
    siteStats.push({ name: site.name, total, count: bills.length });
    datasets.push({ label: site.name, data: monthly, borderColor: palette[idx % palette.length], backgroundColor: palette[idx % palette.length] + '20', tension: .3, fill: false, borderWidth: 2, pointRadius: 3 });
  });
  if (!datasets.length) { el.parentElement.innerHTML = '<div class="text-muted text-center py-5">Bu yıl için hiçbir sitede ısı verisi yok.</div>'; return; }
  siteHeatCmpChartInstance = new Chart(el, {
    type: 'line',
    data: { labels: MONTHS.map(m => m.substring(0,3)), datasets },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'top' }, tooltip: { callbacks: { label: ctx => {
        const v = ctx.raw;
        if (type === 'amount') return `${ctx.dataset.label}: ${money(v)}`;
        if (type === 'avg') return `${ctx.dataset.label}: ${Number(v).toFixed(2)} (ort.)`;
        return `${ctx.dataset.label}: ${Number(v).toFixed(0)}`;
      }}}},
      scales: { y: { beginAtZero: true } } }
  });
  const info = document.getElementById('siteHeatCmpInfo');
  if (info) info.innerHTML = siteStats.sort((a,b) => b.total - a.total).map(s => {
    const v = type === 'amount' ? money(s.total) : type === 'avg' ? s.total.toFixed(2) : s.total.toFixed(0);
    return `<b>${esc(s.name)}</b>: ${v} (${s.count} ay)`;
  }).join(' · ');
}

let pendingHeat = null;

    const tmpl = (db.heatVendorTemplates || []).find(t => t.id === tmplId && t.site_id === currentSiteId());
    if (tmpl) return { colAptPatterns: tmpl.aptPatterns, colPayPatterns: tmpl.payPatterns, label: tmpl.name };
  }
  return {
    genel: { colAptPatterns: ['DAİRE','DAIRE','APT','NO'], colPayPatterns: ['PAY','ÖLÇER','OLCER','TÜKETİM','TUKETIM','DEĞER','DEGER','VALUE','CONSUMPTION'], label: 'Daire + Pay Ölçer' },
    kamstrup: { colAptPatterns: ['DAİRE','DAIRE','LOKASYON','LOCATION','APT'], colPayPatterns: ['TÜKETİM','TUKETIM','CONSUMPTION','ENERJİ','ENERJI','ENERGY','VALUE','DEĞER'], label: 'Kamstrup' },
    techem: { colAptPatterns: ['DAİRE','DAIRE','NUTZEINHEIT','UNIT','APT'], colPayPatterns: ['VERBRAUCH','CONSUMPTION','TÜKETİM','TUKETIM','WERT','DEĞER','VALUE'], label: 'Techem' },
    ista: { colAptPatterns: ['DAİRE','DAIRE','OBJEKT','OBJECT','APT'], colPayPatterns: ['VERBRAUCH','TÜKETİM','TUKETIM','EINHEIT','DEĞER','VALUE'], label: 'Ista' },
    meter: { colAptPatterns: ['SAYAÇ','SAYAC','METER','SERIAL','SERİ','SERI'], colPayPatterns: ['PAY','ÖLÇER','OLCER','TÜKETİM','TUKETIM','DEĞER','VALUE'], label: 'Sayaç No + Pay' }
  }[vendor] || {};
}

function setupHeatFileListener() {
  const inp = document.getElementById('heatFile');
  if (!inp) return;
  inp.addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) { alert('Dosya 5 MB\'dan büyük.'); return; }
    const vendor = document.getElementById('heatVendor')?.value || 'genel';
    const cfg = getHeatVendorConfig(vendor);
    readSpreadsheet(file, rows => {
      if (!rows || rows.length < 2) { alert('Dosya boş.'); return; }
      const headers = rows[0];
      let colApt = -1, colPay = -1;
      headers.forEach((h, i) => {
        const u = String(h).toUpperCase();
        if (colApt < 0 && cfg.colAptPatterns.some(p => u.includes(p))) colApt = i;
        if (colPay < 0 && cfg.colPayPatterns.some(p => u.includes(p))) colPay = i;
      });
      if (colApt < 0) headers.forEach((h, i) => { const u = String(h).toUpperCase(); if (colApt < 0 && (u.includes('DAİRE') || u.includes('DAIRE') || u.includes('SAYAÇ') || u.includes('SAYAC'))) colApt = i; });
      if (colPay < 0) headers.forEach((h, i) => { const u = String(h).toUpperCase(); if (colPay < 0 && (u.includes('PAY') || u.includes('ÖLÇER') || u.includes('TÜKETİM') || u.includes('DEĞER'))) colPay = i; });
      if (colApt < 0 || colPay < 0) { alert('Sütunlar tanınamadı.'); return; }
      pendingHeat = { headers, rows: rows.slice(1), colApt, colPay, vendor };
      showHeatFileInfo();
    });
  });
}
function showHeatFileInfo() {

  if (!info || !pendingHeat) return;
  const { headers, rows, colApt, colPay, vendor } = pendingHeat;
  const cfg = getHeatVendorConfig(vendor);
