function last6MonthsKPI() {

    const incManual = (db.cashMovements || []).filter(m => m.site_id === sid && m.type === 'gelir' && new Date(m.date).getFullYear() === year && new Date(m.date).getMonth() + 1 === month).reduce((s,m) => s + Number(m.amount), 0);

function downloadCSV(filename, rows) { const csv = rows.map(row => row.map(cell => { const s = String(cell ?? ''); return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(';')).join('\r\n'); const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url); }
function parseCSV(text) { text = text.replace(/^\uFEFF/, ''); const firstLine = text.split(/\r?\n/)[0] || ''; const counts = { ';': (firstLine.match(/;/g)||[]).length, ',': (firstLine.match(/,/g)||[]).length, '\t': (firstLine.match(/\t/g)||[]).length }; const sep = Object.keys(counts).reduce((a,b) => counts[a] >= counts[b] ? a : b); const rows = []; let cur = []; let field = ''; let inQuotes = false; for (let i = 0; i < text.length; i++) { const ch = text[i]; if (inQuotes) { if (ch === '"') { if (text[i+1] === '"') { field += '"'; i++; } else { inQuotes = false; } } else { field += ch; } } else { if (ch === '"') inQuotes = true; else if (ch === sep) { cur.push(field); field = ''; } else if (ch === '\r') {} else if (ch === '\n') { cur.push(field); rows.push(cur); cur = []; field = ''; } else field += ch; } } if (field.length || cur.length) { cur.push(field); rows.push(cur); } return rows.filter(r => r.some(c => String(c).trim() !== '')); }
function parseExcel(file, callback) { if (typeof XLSX === 'undefined') { alert('Excel kütüphanesi yüklenemedi.'); callback(null); return; } const reader = new FileReader(); reader.onload = ev => { try { const data = new Uint8Array(ev.target.result); const workbook = XLSX.read(data, { type: 'array' }); const firstSheet = workbook.Sheets[workbook.SheetNames[0]]; const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1, raw: false, defval: '' }); callback(rows.filter(r => r.some(c => String(c).trim() !== ''))); } catch (err) { alert('Excel okunamadı: ' + err.message); callback(null); } }; reader.readAsArrayBuffer(file); }
function readSpreadsheet(file, callback) { if (!file) { callback(null); return; } const name = file.name.toLowerCase(); if (name.endsWith('.xlsx') || name.endsWith('.xls')) parseExcel(file, callback); else { const reader = new FileReader(); reader.onload = ev => callback(parseCSV(ev.target.result)); reader.readAsText(file, 'UTF-8'); } }

function calcDueInterest(due, dailyRate, refDate) { if (due.is_paid) return null; const dueDate = new Date(due.year, due.month, 0); const today = refDate || new Date(); if (today <= dueDate) return null; const days = Math.floor((today - dueDate) / (1000*60*60*24)); if (days <= 0) return null; return { days, dueDate, interest: Number(due.amount) * dailyRate * days }; }

/* ============================================================
   YENİ DAİRE → GEÇMİŞ AİDAT DÖNEMLERİNİ KOPYALA
============================================================ */
function syncNewApartmentDues(newApt) {
  if (!newApt || !newApt.id) return 0;
  const db = getDB(); const sid = currentSiteId();
  const now = new Date();
  const cutoff = new Date(now.getFullYear(), now.getMonth() - 11, 1);
  const periods = new Map();
  siteFilter(db.dues).forEach(d => {
    if (d.apartment_id === newApt.id) return;
    if (d.category && d.category !== 'aidat') return;
    const dDate = new Date(d.year, d.month - 1, 1);
    if (dDate < cutoff) return;
    const key = `${d.year}-${d.month}`;
    if (!periods.has(key)) periods.set(key, { year: d.year, month: d.month, amounts: [] });
    periods.get(key).amounts.push(Number(d.amount));
  });
  if (!periods.size) return 0;
  let added = 0;
  const addedPeriods = [];
  periods.forEach(({ year, month, amounts }) => {
    const exists = db.dues.find(d => d.apartment_id === newApt.id && d.year === year && d.month === month && (!d.category || d.category === 'aidat'));
    if (exists) return;
    const counts = {};
    amounts.forEach(a => { counts[a] = (counts[a] || 0) + 1; });
    const mode = Object.entries(counts).sort((a,b) => b[1] - a[1])[0];
    const amount = parseFloat(mode[0]);
    if (!isFinite(amount) || amount <= 0) return;
    db.dues.push({ id: db.nextId.due++, site_id: sid, apartment_id: newApt.id, month, year, amount, is_paid: false, paid_at: null });
    added++;
    addedPeriods.push(`${MONTHS[month-1]} ${year} — ${money(amount)}`);
  });
  if (added > 0) {
    setDB(db);
    setTimeout(() => { alert(`ℹ️ ${aptLabel(newApt)} dairesi için ${added} dönemde aidat borcu otomatik oluşturuldu:\n\n${addedPeriods.join('\n')}`); }, 100);
  }
  return added;
}

  if (user.role === 'inspector' && (currentPage === 'admin-actions' || currentPage === 'settings')) currentPage = 'dashboard';

    case 'residents': return renderResidents(user);
    case 'dues': return renderDues(user);
    case 'expenses': return renderExpenses(user);
    case 'notifications': return renderNotifications(user);
    case 'cash': return renderCash(user);
    case 'my-notifications': return renderMyNotifications(user);

    case 'stats': return renderStats(user);
    case 'settings': return renderSettings(user);
    case 'admin-actions': return renderAdminActions(user);
    case 'change-password': return renderChangePassword(user);
    case 'tenant-dashboard': return renderTenantDashboard(user);
    case 'tenant-payment-history': return renderTenantPaymentHistory(user);
    case 'heat-billing': return renderHeatBilling(user);
    case 'apartment-history': return renderApartmentHistory(user);
    case 'budget': return renderBudget(user);
    case 'projects': return renderProjects(user);
    case 'announcements': return renderAnnouncements(user);
    case 'announcement-detail': return renderAnnouncementDetail(user);
    case 'monthly-summary': return renderMonthlySummary(user);
    case 'reports': return renderReports(user);
    default: return renderDashboard(user);
  }
}

function toggleDue(dueId) {
  const d = getDues().find(x => x.id === dueId);
  if (!d) return;
  updateDue(dueId, { paid: !d.paid, paidDate: !d.paid ? todayISO() : null });
  render();
  toast(d.paid ? 'Ödenmedi olarak işaretlendi' : 'Ödendi olarak işaretlendi');
}

function bulkPayAll() {
  if (!confirm('Filtrelenen tüm aidatlar ödendi yapılsın mı?')) return;
  getDues().forEach(d => updateDue(d.id, { paid: true, paidDate: todayISO() }));
  render();
  toast('Tümü ödendi yapıldı');
}

function bulkUnpayAll() {
  if (!confirm('Filtrelenen tüm aidatlar ödenmedi yapılsın mı?')) return;
  getDues().forEach(d => updateDue(d.id, { paid: false, paidDate: null }));
  render();
  toast('Tümü ödenmedi yapıldı');
}

function uploadReceipt(dueId) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*,application/pdf';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      updateDue(dueId, { receipt: ev.target.result, receiptName: file.name });
      render();
      toast('Makbuz yüklendi');
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

function viewReceipt(dueId) {
  const d = getDues().find(x => x.id === dueId);
  if (!d || !d.receipt) return;
  if (d.receipt.startsWith('data:application/pdf')) {
    window.open(d.receipt, '_blank');
  } else {
    openModal('Makbuz', `<img src="${d.receipt}" style="max-width:100%">`, null, 'Geniş');
  }
}

function removeReceipt(dueId) {
  if (!confirm('Makbuz silinsin mi?')) return;
  updateDue(dueId, { receipt: null, receiptName: null });
  render();
  toast('Makbuz silindi');
}

function downloadReceipt(dueId) {
  const d = getDues().find(x => x.id === dueId);
  if (!d || !d.receipt) return;
  const a = document.createElement('a');
  a.href = d.receipt;
  a.download = d.receiptName || 'makbuz';
  a.click();
}

function downloadBulkReceipts() {
  const dues = getDues().filter(d => d.receipt);
  if (dues.length === 0) { toast('Makbuz yok'); return; }
  dues.forEach((d, i) => setTimeout(() => downloadReceipt(d.id), i * 300));
}

function renderCash() {
  const container = document.getElementById('cashContent');
  if (!container) return;
  const movements = getCashMovements();
  const extras = getExtraIncomes();
  const dues = getDues().filter(d => d.paid);
  const expenses = getExpenses().filter(e => e.paid);
  const totalIn = dues.reduce((s, d) => s + (d.amount || 0), 0) + extras.reduce((s, x) => s + (x.amount || 0), 0);
  const totalOut = expenses.reduce((s, e) => s + (e.amount || 0), 0);
  const balance = totalIn - totalOut;

  let html = `<div class="cash-summary">
    <div class="kpi-card"><div class="kpi-label">Toplam Gelir</div><div class="kpi-value success">${formatMoney(totalIn)}</div></div>
    <div class="kpi-card"><div class="kpi-label">Toplam Gider</div><div class="kpi-value danger">${formatMoney(totalOut)}</div></div>
    <div class="kpi-card"><div class="kpi-label">Kasa Bakiyesi</div><div class="kpi-value ${balance >= 0 ? 'success' : 'danger'}">${formatMoney(balance)}</div></div>
  </div>
  <div class="toolbar">
    <button class="btn" onclick="openAddMovementModal()">➕ Hareket Ekle</button>
    <button class="btn" onclick="openAddExtraIncomeModal()">💵 Ek Gelir</button>
    <button class="btn" onclick="openExtraIncomeCalendar()">📅 Ek Gelir Takvimi</button>

    <button class="btn" onclick="exportPartialPaymentsCSV()">📄 Kısmi Ödemeler</button>
    <button class="btn" onclick="downloadCashPDF()">🖨️ PDF</button>
  </div>
  <h4>Manuel Hareketler</h4>
  <table class="data-table"><thead><tr><th>Tarih</th><th>Tip</th><th>Açıklama</th><th>Tutar</th><th>İşlem</th></tr></thead><tbody>`;
  movements.forEach(m => {
    html += `<tr><td>${m.date || '-'}</td><td>${m.type === 'in' ? 'Gelir' : 'Gider'}</td>
      <td>${escapeHtml(m.desc || '-')}</td><td>${formatMoney(m.amount)}</td>
      <td><button class="btn-sm btn-danger" onclick="deleteMovement('${m.id}')">Sil</button></td></tr>`;
  });
  html += `</tbody></table><h4>Ek Gelirler</h4>
  <table class="data-table"><thead><tr><th>Tarih</th><th>Açıklama</th><th>Tutar</th><th>İşlem</th></tr></thead><tbody>`;
  extras.forEach(x => {
    html += `<tr><td>${x.date || '-'}</td><td>${escapeHtml(x.desc || '-')}</td><td>${formatMoney(x.amount)}</td>
      <td><button class="btn-sm btn-danger" onclick="deleteExtraIncome('${x.id}')">Sil</button></td></tr>`;
  });
  html += '</tbody></table>';
  container.innerHTML = html;

function exportCashReport() {
  const headers = ['Tip', 'Tarih', 'Açıklama', 'Tutar'];

  getCashMovements().forEach(m => rows.push([m.type === 'in' ? 'Gelir' : 'Gider', m.date, m.desc, m.amount]));
  getExtraIncomes().forEach(x => rows.push(['Ek Gelir', x.date, x.desc, x.amount]));
  getDues().filter(d => d.paid).forEach(d => rows.push(['Aidat', d.paidDate, `Aidat ${d.month}/${d.year}`, d.amount]));
  getExpenses().filter(e => e.paid).forEach(e => rows.push(['Gider', e.paidDate, e.desc || e.category, e.amount]));
  const csv = '\uFEFF' + [headers, ...rows].map(r => r.map(v => `"${String(v || '').replace(/"/g, '""')}"`).join(';')).join('\n');

function calculateInterestPreview(dueId) {
  const d = getDues().find(x => x.id === dueId);
  if (!d) return 0;
  const dueDate = new Date(d.year, d.month - 1, 1);
  const days = Math.max(0, Math.floor((Date.now() - dueDate) / 86400000));
  return Math.round(d.amount * 0.0013 * days * 100) / 100;
}

function applyInterest(dueId) {
  const interest = calculateInterestPreview(dueId);
  const d = getDues().find(x => x.id === dueId);
  if (!d) return;
  updateDue(dueId, { amount: d.amount + interest, interestApplied: true });
  render(); toast(`Faiz eklendi: ${formatMoney(interest)}`);
}

function drawCashFlowChart() {
  const ctx = document.getElementById('chartCashFlow');
  if (!ctx || typeof Chart === 'undefined') return;
  const map = {};
  getCashMovements().forEach(m => { const k = (m.date || '').slice(0, 7); if (!map[k]) map[k] = { in: 0, out: 0 }; map[k][m.type === 'in' ? 'in' : 'out'] += m.amount; });
  const labels = Object.keys(map).sort();
  new Chart(ctx, { type: 'line', data: { labels, datasets: [

function drawDebtByBlockChart() {

function renderMonthlySummary() {

  const dues = getDues().filter(d => d.year === y && d.month === m);
  const expenses = getExpenses().filter(e => (e.date || '').startsWith(`${y}-${String(m).padStart(2, '0')}`));
  const income = dues.filter(d => d.paid).reduce((s, d) => s + d.amount, 0);

  container.innerHTML = `

function exportMonthlySummaryCSV() {
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth() + 1;
  const headers = ['Tip', 'Açıklama', 'Tutar'];
  const rows = [];
  getDues().filter(d => d.year === y && d.month === m && d.paid).forEach(d => rows.push(['Aidat', `${d.month}/${d.year}`, d.amount]));
  getExpenses().filter(e => (e.date || '').startsWith(`${y}-${String(m).padStart(2, '0')}`)).forEach(e => rows.push(['Gider', e.desc || e.category, -e.amount]));
  const csv = '\uFEFF' + [headers, ...rows].map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(';')).join('\n');
  downloadFile(`aylik_ozet_${y}_${m}.csv`, csv, 'text/csv');
}

function getHeatVendorConfig() {
  return getSetting('heatVendorConfig') || { vendors: {}, active: '' };
}

function onHeatVendorChange(val) {
  const cfg = getHeatVendorConfig();
  cfg.active = val;
  setSetting('heatVendorConfig', cfg);
  showHeatFileInfo();
}

function setupHeatFileListener() {
  const input = document.getElementById('heatFileInput');
  if (!input) return;
  input.onchange = e => {
    const f = e.target.files[0];
    const info = document.getElementById('heatFileInfo');
    if (info) info.textContent = f ? `Seçilen dosya: ${f.name} (${Math.round(f.size / 1024)} KB)` : '';
    if (f) previewHeatBilling(f);
  };
}

function showHeatFileInfo() {
  const cfg = getHeatVendorConfig();
  const info = document.getElementById('heatFileInfo');
  if (info) info.textContent = cfg.active ? `Aktif firma: ${cfg.active}` : 'Firma seçilmedi.';
}

function previewHeatBilling(file) {
  const reader = new FileReader();
  reader.onload = ev => {
    const text = ev.target.result;
    const lines = text.split(/\r?\n/).filter(l => l.trim());
    const rows = lines.map(l => l.split(/[;,]/));
    showHeatPreview(rows);
  };
  reader.readAsText(file);
}

function showHeatPreview(rows) {
  const area = document.getElementById('heatPreviewArea');
  if (!area) return;
  let html = '<table class="data-table"><tbody>';
  rows.slice(0, 50).forEach(r => html += '<tr>' + r.map(c => `<td>${escapeHtml(c)}</td>`).join('') + '</tr>');
  html += '</tbody></table>';
  html += `<button class="btn" onclick="commitHeatBilling()">✅ İçe Aktar</button>`;
  area.innerHTML = html;
  window.__heatRows = rows;
}

function commitHeatBilling() {
  const rows = window.__heatRows || [];
  if (!rows.length) { toast('Veri yok'); return; }
  const period = prompt('Dönem (örn. 2025-01):', new Date().toISOString().slice(0, 7)) || '';
  const total = rows.slice(1).reduce((s, r) => s + (parseFloat(r[3]) || 0), 0);
  addHeatBill({ period, total, rows: rows.slice(1), date: todayISO() });
  window.__heatRows = null;
  render(); toast('Isı faturası içe aktarıldı');
}

function detectAnomalies() {
  const bills = getHeatBills ? getHeatBills() : [];
  if (!bills.length) { toast('Fatura yok'); return; }
  const avg = bills.reduce((s, b) => s + b.total, 0) / bills.length;
  const anomalies = bills.filter(b => b.total > avg * 1.5);
  if (anomalies.length === 0) { toast('Anomali yok'); return; }
  openModal('Anomaliler', '<ul>' + anomalies.map(a => `<li>${a.period}: ${formatMoney(a.total)}</li>`).join('') + '</ul>', null);
}

function getBudget() { return getSetting('budget') || {}; }
function getActuals() {
  const actuals = {};
  getExpenses().forEach(e => { const k = e.category || 'Diğer'; actuals[k] = (actuals[k] || 0) + e.amount; });
  return actuals;
}

function renderBudget() {
  const container = document.getElementById('budgetContent');
  if (!container) return;
  const budget = getBudget();
  const actuals = getActuals();
  const cats = Array.from(new Set([...Object.keys(budget), ...Object.keys(actuals)]));
  let html = `<div class="toolbar">
    <button class="btn" onclick="copyBudgetFromPreviousYear()">📋 Geçen Yıldan Kopyala</button>
    <button class="btn" onclick="copyBudgetFromActuals()">📊 Gerçekleşenden Kopyala</button>
    <button class="btn" onclick="downloadBudgetPDF()">🖨️ PDF</button>
  </div>
  <table class="data-table"><thead><tr><th>Kategori</th><th>Bütçe</th><th>Gerçekleşen</th><th>Fark</th></tr></thead><tbody>`;
  cats.forEach(c => {
    const b = budget[c] || 0, a = actuals[c] || 0;
    html += `<tr><td>${escapeHtml(c)}</td><td><input type="number" value="${b}" onchange="updateBudget('${c}', this.value)"></td>
      <td>${formatMoney(a)}</td><td class="${a - b > 0 ? 'danger' : 'success'}">${formatMoney(a - b)}</td></tr>`;
  });
  html += '</tbody></table><canvas id="budgetChart"></canvas>';
  container.innerHTML = html;
  drawBudgetChart();
}

function updateBudget(cat, val) {
  const budget = getBudget();
  budget[cat] = parseFloat(val) || 0;
  setSetting('budget', budget);
  renderBudget();
}

function drawBudgetChart() {
  const ctx = document.getElementById('budgetChart');
  if (!ctx || typeof Chart === 'undefined') return;
  const budget = getBudget();
  const actuals = getActuals();
  const labels = Array.from(new Set([...Object.keys(budget), ...Object.keys(actuals)]));
  new Chart(ctx, { type: 'bar', data: { labels, datasets: [
    { label: 'Bütçe', data: labels.map(l => budget[l] || 0), backgroundColor: '#2196f3' },
    { label: 'Gerçekleşen', data: labels.map(l => actuals[l] || 0), backgroundColor: '#ff9800' }
  ] } });
}

function copyBudgetFromPreviousYear() {
  const prev = getSetting('budgetPrevYear') || {};
  setSetting('budget', { ...prev });
  renderBudget(); toast('Kopyalandı');
}

function copyBudgetFromActuals() {
  setSetting('budget', { ...getActuals() });
  renderBudget(); toast('Gerçekleşenden kopyalandı');
}

function downloadBudgetPDF() {
  const budget = getBudget();
  const actuals = getActuals();
  const win = window.open('', '_blank');
  let html = '<html><head><title>Bütçe</title></head><body><h2>Bütçe Raporu</h2><table border="1" cellpadding="6"><tr><th>Kategori</th><th>Bütçe</th><th>Gerçekleşen</th></tr>';
  Object.keys(budget).forEach(c => html += `<tr><td>${c}</td><td>${formatMoney(budget[c])}</td><td>${formatMoney(actuals[c] || 0)}</td></tr>`);
  html += '</table></body></html>';
  win.document.write(html); win.document.close(); win.print();
}

function exportBackup() {
  const data = {};
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    data[k] = localStorage.getItem(k);
  }
  downloadFile(`yedek_${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(data, null, 2), 'application/json');
  toast('Yedek indirildi');
}

function importBackup(ev) {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!confirm('Mevcut veriler yedekle değiştirilecek. Devam?')) return;
      Object.keys(data).forEach(k => localStorage.setItem(k, data[k]));
      toast('Yedek yüklendi'); setTimeout(() => location.reload(), 800);
    } catch (err) { alert('Geçersiz yedek dosyası'); }
  };
  reader.readAsText(file);
}

/* ============================================================
   AYARLAR
   ============================================================ */
function renderSettings() {
  const c = document.getElementById('settingsContent');
  if (!c) return;
  const logo = getSetting('siteLogo');
  const theme = getSetting('theme') || 'light';
  const cardStyle = getSetting('cardStyle') || 'rounded';
  const font = getSetting('fontFamily') || 'Arial';
  const fontSize = getSetting('fontSize') || '14';
  const density = getSetting('density') || 'normal';
  c.innerHTML = `
    <div class="settings-section">
      <h4>Site Logosu</h4>
      ${logo ? `<img src="${logo}" style="max-height:80px"><button class="btn-sm btn-danger" onclick="removeSiteLogo()">Kaldır</button>` : `<input type="file" id="logoInput" accept="image/*" onchange="uploadSiteLogo(event)">`}
    </div>
    <div class="settings-section">
      <h4>Görünüm</h4>
      <label>Tema: <select onchange="changeColorTheme(this.value)">
        <option value="light" ${theme === 'light' ? 'selected' : ''}>Açık</option>
        <option value="dark" ${theme === 'dark' ? 'selected' : ''}>Koyu</option>
      </select></label><br>
      <label>Kart Stili: <select onchange="changeCardStyle(this.value)">
        <option value="rounded" ${cardStyle === 'rounded' ? 'selected' : ''}>Yuvarlak</option>
        <option value="square" ${cardStyle === 'square' ? 'selected' : ''}>Köşeli</option>
      </select></label><br>
      <label>Yazı Tipi: <select onchange="changeFontFamily(this.value)">
        <option value="Arial" ${font === 'Arial' ? 'selected' : ''}>Arial</option>
        <option value="Roboto" ${font === 'Roboto' ? 'selected' : ''}>Roboto</option>
        <option value="Georgia" ${font === 'Georgia' ? 'selected' : ''}>Georgia</option>
      </select></label><br>
      <label>Yazı Boyutu: <input type="number" value="${fontSize}" onchange="changeFontSize(this.value)"></label><br>
      <label>Yoğunluk: <select onchange="changeDensity(this.value)">
        <option value="normal" ${density === 'normal' ? 'selected' : ''}>Normal</option>
        <option value="compact" ${density === 'compact' ? 'selected' : ''}>Sıkı</option>
      </select></label>
    </div>
    <div class="settings-section">
      <h4>Otomasyon</h4>
      <button class="btn" onclick="runAutoNow()">▶️ Şimdi Çalıştır</button>
    </div>
    <div class="settings-section">
      <h4>Tehlikeli İşlemler</h4>
      <button class="btn btn-danger" onclick="deleteSite()">🗑️ Siteyi Sil</button>
    </div>`;
}

function uploadSiteLogo(ev) {
  const f = ev.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = e => { setSetting('siteLogo', e.target.result); renderSettings(); toast('Logo yüklendi'); };
  r.readAsDataURL(f);
}
function removeSiteLogo() { setSetting('siteLogo', null); renderSettings(); }
function deleteSite() { if (confirm('Site ve tüm veriler silinsin mi?')) { localStorage.clear(); location.reload(); } }
function deleteBlock(id) { if (confirm('Blok silinsin mi?')) { deleteBlockById(id); render(); } }
function runAutoNow() { toast('Otomatik görevler çalıştırıldı'); }
function runRentRemindersNow() { toast('Kira hatırlatmaları gönderildi'); }
function runHeatRemindersNow() { toast('Isı hatırlatmaları gönderildi'); }
function runOwnerRemindersNow() { toast('Malik hatırlatmaları gönderildi'); }
function changeColorTheme(v) { setSetting('theme', v); document.body.dataset.theme = v; }
function changeCardStyle(v) { setSetting('cardStyle', v); document.body.dataset.cardStyle = v; }
function changeFontFamily(v) { setSetting('fontFamily', v); document.body.style.fontFamily = v; }
function changeFontSize(v) { setSetting('fontSize', v); document.body.style.fontSize = v + 'px'; }
function changeDensity(v) { setSetting('density', v); document.body.dataset.density = v; }

/* ============================================================
   ŞİFRE
   ============================================================ */
function renderChangePassword() {
  const c = document.getElementById('changePasswordContent');
  if (!c) return;
  c.innerHTML = `
    <div class="form-group"><label>Mevcut Şifre</label><input type="password" id="cpOld"></div>
    <div class="form-group"><label>Yeni Şifre</label><input type="password" id="cpNew"></div>
    <div class="form-group"><label>Yeni Şifre (Tekrar)</label><input type="password" id="cpNew2"></div>
    <button class="btn" onclick="savePasswordChange()">Kaydet</button>`;
}

function savePasswordChange() {
  const oldP = document.getElementById('cpOld').value;
  const n1 = document.getElementById('cpNew').value;
  const n2 = document.getElementById('cpNew2').value;
  const current = getSetting('adminPassword') || '1234';
  if (oldP !== current) { toast('Mevcut şifre yanlış'); return; }
  if (n1 !== n2) { toast('Yeni şifreler eşleşmiyor'); return; }
  if (n1.length < 4) { toast('Şifre en az 4 karakter olmalı'); return; }
  setSetting('adminPassword', n1);
  toast('Şifre değiştirildi');
}

/* ============================================================
   ATTACH HANDLERS (KRİTİK)
   ============================================================ */
function attachHandlers() {
  // Navigasyon
  document.querySelectorAll('[data-nav]').forEach(el => {
    el.onclick = e => { e.preventDefault(); navigate(el.dataset.nav); };
  });

  // Blok / Daire / Sakin formları
  const blockForm = document.getElementById('addBlockForm');
  if (blockForm) blockForm.onsubmit = e => {
    e.preventDefault();
    const name = document.getElementById('newBlockName').value.trim();
    if (!name) return;
    addBlock({ name });
    blockForm.reset(); render(); toast('Blok eklendi');
  };

  const aptForm = document.getElementById('addApartmentForm');
  if (aptForm) aptForm.onsubmit = e => {
    e.preventDefault();
    const blockId = document.getElementById('aptBlock').value;
    const no = parseInt(document.getElementById('aptNo').value);
    const type = document.getElementById('aptType').value;
    if (!blockId || !no) return;
    addApartment({ blockId, no, type, meterNo: '', note: '' });
    aptForm.reset(); render(); toast('Daire eklendi');
  };

  const resForm = document.getElementById('addResidentForm');
  if (resForm) resForm.onsubmit = e => {
    e.preventDefault();
    const apartmentId = document.getElementById('resApt').value;
    const name = document.getElementById('resName').value.trim();
    const type = document.getElementById('resType').value;
    const phone = document.getElementById('resPhone').value.trim();
    const email = document.getElementById('resEmail').value.trim();
    if (!apartmentId || !name) return;
    addResident({ apartmentId, name, type, phone, email });
    resForm.reset(); render(); toast('Sakin eklendi');
  };

  // Filtreler
  const dueFilterMonth = document.getElementById('dueFilterMonth');
  if (dueFilterMonth) dueFilterMonth.onchange = renderDues;
  const dueFilterPaid = document.getElementById('dueFilterPaid');
  if (dueFilterPaid) dueFilterPaid.onchange = renderDues;

  // Global modal kapatma
  document.querySelectorAll('.modal-close, .modal-overlay').forEach(el => {
    el.onclick = e => { if (e.target === el) closeModal(); };
  });

  // ESC ile modal kapat
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  // Toplu işlem butonları varsa
  const bulkBtn = document.getElementById('bulkAreaBtn');
  if (bulkBtn) bulkBtn.onclick = openBulkAreaModal;

  // Isı firma seçimi
  const hv = document.getElementById('heatVendorSel');
  if (hv) hv.onchange = () => onHeatVendorChange(hv.value);

  // Çıkış
  const logoutBtn = document.getElementById('logoutBtn');
  if (logoutBtn) logoutBtn.onclick = () => { if (confirm('Çıkış yapılsın mı?')) { sessionStorage.removeItem('loggedIn'); location.reload(); } };

  // Tema uygula
  document.body.dataset.theme = getSetting('theme') || 'light';
  document.body.dataset.cardStyle = getSetting('cardStyle') || 'rounded';
  document.body.style.fontFamily = getSetting('fontFamily') || 'Arial';
  document.body.style.fontSize = (getSetting('fontSize') || '14') + 'px';
  document.body.dataset.density = getSetting('density') || 'normal';

  // Logo uygula
  const logo = getSetting('siteLogo');
  const logoEl = document.getElementById('siteLogo');
  if (logoEl && logo) logoEl.src = logo;
}

/* ============================================================
   RENDER — ANA YÖNLENDİRİCİ
   ============================================================ */
function render() {
  const page = currentPage || 'dashboard';
  document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
  const target = document.getElementById('page-' + page);
  if (target) target.style.display = 'block';

  switch (page) {
    case 'dashboard': renderDashboard(); break;
    case 'apartments': renderApartments(); break;
    case 'residents': renderResidents(); break;
    case 'dues': renderDues(); break;
    case 'expenses': renderExpenses(); break;
    case 'cash': renderCash(); break;
    case 'notifications': renderNotifications(); break;
    case 'stats': renderStats(); break;
    case 'monthly': renderMonthlySummary(); break;
    case 'reports': renderReports(); break;
    case 'heat': renderHeatBilling(); break;
    case 'projects': renderProjects(); break;
    case 'apartmentHistory': renderApartmentHistory(); break;
    case 'budget': renderBudget(); break;
    case 'adminActions': renderAdminActions(); renderAdminSettings(); renderAdminBulkActions(); renderAdminDataManagement(); break;
    case 'settings': renderSettings(); break;
    case 'changePassword': renderChangePassword(); break;
  }
  attachHandlers();
}

/* İlk yükleme */
document.addEventListener('DOMContentLoaded', () => {
  if (typeof initStorage === 'function') initStorage();
  render();
});
</script>
